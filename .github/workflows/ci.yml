name: CI

# Runner capacity (2026-10-08): one run of this workflow holds a shared
# org-wide runner slot for about 2h20m (p50 137 min, Oct 7-8). Before this
# change every branch push ran it twice, once for `push` and once for the
# PR's `pull_request` event, and superseded runs kept going. So:
#   - `push` runs only on the long-lived branches. Feature branches get CI
#     through their pull request; use workflow_dispatch for a branch with no
#     PR yet.
#   - A new commit on a pull request cancels that PR's in-progress run.
#     Pushes keep a unique group (the run id), so every main commit is still
#     checked and none is cancelled.
on:
  pull_request:
  push:
    branches:
      - main
      - codex/thesis-ledger-facts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chronicle:
    name: Chronicle checks
    runs-on: ubuntu-latest
    # Kill a hung run instead of letting it hold a slot for GitHub's 360-minute
    # default. Successful runs on main-based branches took 76-147 min on Oct 7-8
    # (p50 137); the spread is runner speed, which varied 1.6x on one commit.
    timeout-minutes: 210

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint Chronicle surface
        run: >
          uv run ruff check
          chronicle
          policyengine_chronicle
          db
          scripts
          tests

      - name: Test UK calibration source additions
        run: uv run pytest -q tests/test_chronicle_uk_national_2025.py

      - name: Test Chronicle surface
        # --durations lists the slowest tests so a slowdown is visible in the
        # log instead of only in the job's total time.
        run: >
          uv run pytest -q --durations=25

      # Keep this security-sensitive operational surface explicit even though
      # the broad Chronicle lint and test commands above also cover it.
      - name: Lint OpenTimestamps anchoring
        run: uv run ruff check scripts/ots_anchor.py tests/test_ots_anchor.py

      - name: Test OpenTimestamps anchoring
        run: uv run pytest -q tests/test_ots_anchor.py

      - name: Build source input database
        run: |
          uv run chronicle --db /tmp/chronicle-targets-ci.db init
          uv run chronicle --db /tmp/chronicle-targets-ci.db load all
          uv run chronicle --db /tmp/chronicle-targets-ci.db stats

      - name: Build wheel
        run: |
          rm -rf dist
          uv build

      - name: Test wheel install
        run: |
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          uv venv /tmp/chronicle-wheel-smoke --python 3.14
          uv pip install --python /tmp/chronicle-wheel-smoke/bin/python "$wheel_path"
          cd /tmp
          /tmp/chronicle-wheel-smoke/bin/python - <<'PY'
          import policyengine_chronicle
          import policyengine_chronicle.normalization
          import policyengine_chronicle.sources
          import policyengine_chronicle.targets
          from policyengine_chronicle.schema import (
              CONSUMER_FACT_SCHEMA_SHA256,
              CONSUMER_FACT_SCHEMA_SHA256_BY_VERSION,
              consumer_fact_schema,
          )

          assert policyengine_chronicle.__name__ == "policyengine_chronicle"
          # Every consumer-fact contract must ship inside the wheel: frozen v1,
          # the v2 labels contract, the v3 geography-name contract, and the v4
          # contract rows are emitted under.
          assert (
              consumer_fact_schema("ledger.consumer_fact.v1")["title"]
              == "Ledger consumer fact contract row"
          )
          assert consumer_fact_schema()["title"] == "Chronicle consumer fact contract row"
          assert consumer_fact_schema()["properties"]["schema_version"] == {
              "const": "chronicle.consumer_fact.v4"
          }
          assert set(CONSUMER_FACT_SCHEMA_SHA256_BY_VERSION) == {
              "ledger.consumer_fact.v1",
              "chronicle.consumer_fact.v2",
              "chronicle.consumer_fact.v3",
              "chronicle.consumer_fact.v4",
          }
          # v4 rows take their UK area names from the register, which the
          # export reads from package data, so the wheel must carry it.
          from chronicle.geography_names import canonical_geography_name

          assert canonical_geography_name("E06000001") == "Hartlepool"
          assert len(CONSUMER_FACT_SCHEMA_SHA256) == 64
          PY
          /tmp/chronicle-wheel-smoke/bin/chronicle --help >/dev/null
