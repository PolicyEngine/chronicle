name: CI

on:
  pull_request:
  push:

jobs:
  chronicle:
    name: Chronicle checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint Chronicle surface
        run: >
          uv run ruff check
          chronicle
          policyengine_chronicle
          db
          scripts
          tests

      - name: Test Chronicle surface
        run: >
          uv run pytest -q

      # Keep this security-sensitive operational surface explicit even though
      # the broad Chronicle lint and test commands above also cover it.
      - name: Lint OpenTimestamps anchoring
        run: uv run ruff check scripts/ots_anchor.py tests/test_ots_anchor.py

      - name: Test OpenTimestamps anchoring
        run: uv run pytest -q tests/test_ots_anchor.py

      - name: Build source input database
        run: |
          uv run chronicle --db /tmp/chronicle-targets-ci.db init
          uv run chronicle --db /tmp/chronicle-targets-ci.db load all
          uv run chronicle --db /tmp/chronicle-targets-ci.db stats

      - name: Build wheel
        run: |
          rm -rf dist
          uv build

      - name: Test wheel install
        run: |
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          uv venv /tmp/chronicle-wheel-smoke --python 3.14
          uv pip install --python /tmp/chronicle-wheel-smoke/bin/python "$wheel_path"
          cd /tmp
          /tmp/chronicle-wheel-smoke/bin/python - <<'PY'
          import policyengine_chronicle
          import policyengine_chronicle.normalization
          import policyengine_chronicle.sources
          import policyengine_chronicle.targets
          from policyengine_chronicle.schema import (
              CONSUMER_FACT_SCHEMA_SHA256,
              CONSUMER_FACT_SCHEMA_SHA256_BY_VERSION,
              consumer_fact_schema,
          )

          assert policyengine_chronicle.__name__ == "policyengine_chronicle"
          # Every consumer-fact contract must ship inside the wheel: frozen v1,
          # the v2 labels contract, and the v3 contract rows are emitted under.
          assert (
              consumer_fact_schema("ledger.consumer_fact.v1")["title"]
              == "Ledger consumer fact contract row"
          )
          assert consumer_fact_schema()["title"] == "Chronicle consumer fact contract row"
          assert consumer_fact_schema()["properties"]["schema_version"] == {
              "const": "chronicle.consumer_fact.v3"
          }
          assert set(CONSUMER_FACT_SCHEMA_SHA256_BY_VERSION) == {
              "ledger.consumer_fact.v1",
              "chronicle.consumer_fact.v2",
              "chronicle.consumer_fact.v3",
          }
          assert len(CONSUMER_FACT_SCHEMA_SHA256) == 64
          PY
          /tmp/chronicle-wheel-smoke/bin/chronicle --help >/dev/null
