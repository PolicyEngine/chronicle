[project]
name = "policyengine-chronicle"
version = "0.1.0"
description = "PolicyEngine Chronicle source-data foundation: source-backed facts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" }
]

dependencies = [
    "sqlmodel>=0.0.22",
    "supabase>=2.0.0",  # Supabase Python client
    "jsonschema>=4.20.0",  # Consumer-fact row contract validation
    "pyyaml>=6.0",
    "httpx>=0.27.0",  # For fetching external data
    "numpy>=1.24.0",  # For source table normalization
    "pandas>=2.0.0",  # For source table parsing
    "pyarrow>=22.0.0",
    "openpyxl>=3.1.0",
    "odfpy>=1.4.1",
    "xlrd>=2.0.1",
    "pypdf>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "ruff>=0.5.0",
]
[project.scripts]
chronicle = "policyengine_chronicle.cli:main"
# Back-compat alias during the Ledger→Chronicle transition (María's wrangler flow docs).
ledger = "policyengine_chronicle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chronicle", "db", "packages", "policyengine_chronicle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Delete each passing test's tmp_path at teardown, and the whole session
# basetemp once every test passes. A test that fails in its body keeps its
# directory; at exit pytest removes older sessions' directories, keeping the
# newest one and any still locked by a running session. To keep passing tests'
# directories while debugging, run with -o tmp_path_retention_policy=all
# (--basetemp alone does not keep them).
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 88
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
]
