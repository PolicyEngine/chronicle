    notes: 'Verbatim publisher workbook; Info!A13 attributes the data to the Federale
      Pensioendienst and Info!A14 says 2019 - 2025. Only 2025 numeric cells from the
      five declared data sheets become facts. Gross pension amounts refer to January
      2025; pensioners paid only by the kadaster are excluded from pensioner tables.
      Jaaruitgave retains its printed year and kadaster categories. Licence and January
      definitions are acquisition context from the source landing page and reuse terms
      supplied with this capture; Info itself is an index without detailed definitions.
      Attribution: PensionStat.be (Federale Pensioendienst / Sigedis), data 2025,
      retrieved 2026-10-23. R2 pointers are declared for the Belgium session to upload
      after review; no upload has occurred.'
