notes: >-
  Full publisher workbook, unchanged: the file that the ACF page lists as
  "FY2024 15 Months TANF Caseload". The maintainer downloaded it in a browser on
  2026-11-27 because acf.gov answers automated requests with an AWS WAF
  challenge. The workbook covers October 2023 to December 2024: its FYCY2024
  sheets hold the fiscal year 2024 averages (October to September), which the
  package reads, beside calendar year 2024 averages. Cell A4 of those sheets
  holds the date 2025-06-10. This file replaces the workbook that the package
  read until chronicle#449 (tanf_caseload_2024.xlsx, sha256
  6a9c86ad056ac256d409b48c23731d158d6e94d6dae6b5bd888c42a6021db27c, 220896
  bytes, sheets dated 2025-01-30), which stays in R2 and is registered raw-only
  in ../tanf_caseload_2024_raw_only/manifest.yaml. ACF revised fiscal year 2024
  between the two files: from U.S. Totals to Wyoming, 31 of the 220 family
  averages differ (U.S. Totals, Colorado, Guam, Maryland, North Carolina, Rhode
  Island, Tennessee, Vermont and Washington) and 18 of the 165 recipient
  averages differ (U.S. Totals, Colorado, Maryland, North Carolina, Rhode
  Island and Tennessee). storage.r2 is a content-addressed locator; no upload
  or archival completion is asserted.
