provenance_notes: 'MHCLG, Council Tax levels set by local authorities in England 2024
  to 2025 (first published 21 March 2024). The 2024-25 release publishes Tables 1
  to 9 as nine files; this is Table 9. Council tax requirement, taxbase and chargeable
  dwellings for every billing and precepting authority (sheets Billing_Authorities,
  Precepting_Authorities, GLA, GMCA_and_WYCA, Data_Billing, Data_Precepting, List2,
  Precepting_Bodies), revised in May 2024. Its cover calls it Local Authority Level
  data for 2024-25; later releases publish that as Table 10. Besides its ten data
  sheets the workbook carries 272 empty sheets named after external file references.
