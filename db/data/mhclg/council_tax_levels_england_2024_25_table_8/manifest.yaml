provenance_notes: 'MHCLG, Council Tax levels set by local authorities in England 2024
  to 2025 (first published 21 March 2024). The 2024-25 release publishes Tables 1
  to 9 as nine files; this is Table 8. Area council tax for a dwelling occupied by
  two adults, Bands A to H, for each of the 296 billing authorities, with E code,
  ONS code, region, class and area. Figures include adult social care and parish precepts
  (note a); the band ratios to Band D are 6/9 to 18/9 (note b). This is the 2024-25
  counterpart of Table 9 in mhclg-council-tax-levels-england-summary-2025-26: the
  2024-25 release numbers it Table 8. Licence: Open Government Licence v3.0. Raw-only
  for chronicle#412 item 2.'
