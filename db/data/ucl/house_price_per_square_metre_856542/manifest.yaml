license_evidence: 'ReShare''s record for 856542 states Creative Commons Attribution 4.0 International
  (CC BY 4.0). UCL''s Licence_Information_for_data_sources.docx in bundle 1 adds that tranall_link_02122023.zip,
  LRPPD_02122023.zip and NSPL_NOV_2023_UK.zip contain Royal Mail copyright postcode and address data,
  limited to non-commercial use, with all non-address data under the Open Government Licence v3.0.
  It quotes the EPC terms, which say the data contains personal data and that Royal Mail''s copyright
  notice must go with any address data that is shared, and the Price Paid terms. So the bytes stay
  out of this public repository: the zips are git-ignored and the private ledger-raw bucket holds
  them, bundle 1 with that notice.'
