provenance_notes: 'The data for the charts of Advani, Flew, Pepin-Hall and Summers (2026),
  Removing the £100,000 childcare cliff-edge: Impacts and cost of reform, a CenTax Policy
  Report published in September 2026 (https://centax.org.uk/wp-content/uploads/2026/09/AdvaniFlewPepin-HallSummers2026_Removing-the-childcare-cliff-edge.pdf).
  The server reported the file last modified on 10 November 2026; its bytes are those of the
  copy CenTax shared with PolicyEngine on 21 October 2026 (the same sha256). Its 45 sheets,
  two of them section dividers, hold the report''s tables and figures from HMRC administrative
  data on parents in England and Scotland: income distributions of parents of 3- and 4-year-olds
  by adjusted net income in 2021-22, the tax year CenTax labels 2022 (Figure 3.1, £500 bins
  to £200,000; by main source of income, Figure 3.3, £1,000 bins to £150,000; by sex, Figure
  3.6, £500 bins to £150,000; by region, Figure 3.7, £1,000 bins to £150,000, pooled over
  the tax years 2018-19 to 2021-22), sample statistics (Table A.1), the
  share with a partner not in work (Figure 3.12), and the authors'' model outputs (bunching,
  frictions, elasticities, notch sizes and fiscal costs). Registered raw-only: no Chronicle
  build parses it. PolicyEngine/microcosm#1399 derives its CenTax parent cells from Figures
  3.1, 3.3, 3.6 and 3.7 and reads Table A.1 and Figure 3.12 as diagnostics, verifying the
  bytes against this manifest; no consumer binds the model outputs. Stored in R2 only (storage.local:
  false) and not committed, because no licence is stated (see license_evidence); a build
  that needs it reads it from the source-artifact cache, or with LEDGER_SOURCE_ARTIFACT_FETCH=1
  from source_url.'
