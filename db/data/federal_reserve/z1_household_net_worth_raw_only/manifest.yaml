  Z.1 release of 2026-06-11 as a PDF, from the same dated folder as the S1M.b
  page that the package reads. Its printed page 145 (PDF page 147) heads S1M.b
  "Billions of dollars; amounts outstanding end of period, not seasonally
  adjusted", the unit the package declares; the HTML page prints no unit line.
  Its line 40, FL152090005, reads 156278.8, 169760.7 and 182866.8 for 2023 to
  2025, as the HTML does. 2026 is the B.101 page of the release of 2026-03-19,
  which the package read until chronicle#449.
