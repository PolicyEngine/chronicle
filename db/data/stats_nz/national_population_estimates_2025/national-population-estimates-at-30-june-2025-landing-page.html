    <div id="pageViewData" data-value="{&quot;DateTaxonomyTerm&quot;:{&quot;ID&quot;:&quot;8028&quot;,&quot;ClassName&quot;:&quot;DateTaxonomyTerm&quot;,&quot;Date&quot;:null,&quot;DisplayName&quot;:&quot;National population estimates: At 30 June 2025&quot;,&quot;DateFormat&quot;:&quot;F Y&quot;,&quot;DateString&quot;:&quot;19 August 2025&quot;,&quot;PublicationDate&quot;:&quot;2025-08-19 10:45:00&quot;},&quot;ID&quot;:&quot;80024&quot;,&quot;Title&quot;:&quot;National population estimates: At 30 June 2025&quot;,&quot;ClassName&quot;:&quot;BlockPage&quot;,&quot;BackgroundColor&quot;:&quot;white&quot;,&quot;FeaturedMedia&quot;:[],&quot;FeaturedText&quot;:&quot;&lt;p&gt;&lt;span&gt;National population estimates give the best available measure of the population, by age and sex, usually living in Aotearoa New Zealand.&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;IsPublishing&quot;:false,&quot;MediaPosition&quot;:&quot;&quot;,&quot;PageLayout&quot;:&quot;info&quot;,&quot;PageLink&quot;:&quot;\/information-releases\/national-population-estimates-at-30-june-2025\/&quot;,&quot;PageDate&quot;:&quot;2025-08-19 10:45:00&quot;,&quot;TagPosition&quot;:&quot;bottom&quot;,&quot;MetaDescription&quot;:&quot;The estimated resident population of Aotearoa New Zealand was 5,324,700 (provisionally) at 30 June 2025.&quot;,&quot;PageBreadcrumbs&quot;:[{&quot;Title&quot;:&quot;Home&quot;,&quot;MenuTitle&quot;:&quot;Home&quot;,&quot;Link&quot;:&quot;\/&quot;},{&quot;Title&quot;:&quot;Information releases&quot;,&quot;MenuTitle&quot;:&quot;Information releases&quot;,&quot;Link&quot;:&quot;\/information-releases\/&quot;},{&quot;Title&quot;:&quot;National population estimates: At 30 June 2025&quot;,&quot;MenuTitle&quot;:&quot;National population estimates: At 30 June 2025&quot;,&quot;Link&quot;:&quot;\/information-releases\/national-population-estimates-at-30-june-2025\/&quot;}],&quot;SiteBanner&quot;:[],&quot;PageBlocks&quot;:[{&quot;ID&quot;:&quot;126909&quot;,&quot;Title&quot;:&quot;Description national population estimates \u2013 use from Dec 2024 release&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;intro\&quot;&gt;National population estimates give the best available measure of the population, by age and sex, usually living in Aotearoa New Zealand.&lt;\/span&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;129707&quot;,&quot;Title&quot;:&quot;National population estimates: At 30 June 2025 \u2013 key facts 1&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Key facts&lt;\/h2&gt;\n&lt;p&gt;At 30 June 2025:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;the estimated resident population of Aotearoa New Zealand was 5,324,700 (provisionally)&lt;\/li&gt;\n&lt;li&gt;there were 2,678,500 females and 2,646,200 males&lt;\/li&gt;\n&lt;li&gt;the median age of females and males was 39.0 and 37.4 years respectively.&amp;nbsp;&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;During the year ended June 2025:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;New Zealand\u2019s population grew by 34,700 (0.7 percent)&lt;\/li&gt;\n&lt;li&gt;estimated natural increase (births minus deaths) was 21,000 (61 percent of total growth)&lt;\/li&gt;\n&lt;li&gt;estimated net migration (migrant arrivals minus migrant departures) was 13,700 (39 percent of total growth).&amp;nbsp;&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;During the quarter ended June 2025:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;New Zealand\u2019s population grew by 4,600 (0.1 percent)&lt;\/li&gt;\n&lt;li&gt;estimated natural increase (births minus deaths) was 4,800&lt;\/li&gt;\n&lt;li&gt;estimated net migration (migrant arrivals minus migrant departures) was -200. This means that there were more migrant departures than migrant arrivals.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;At each quarterly release of national population estimates, we revise the six previous quarters, primarily to reflect updates to international migration estimates, which take 16 months to be finalised.&lt;\/p&gt;\n&lt;p&gt;The following table compares the population estimates of the previous quarters, as released in &lt;a href=\&quot;\/information-releases\/national-population-estimates-at-31-march-2025-2023-base\/\&quot;&gt;National population estimates: At 31 March 2025 (2023-base)&lt;\/a&gt; in May 2025, with the current estimates.&lt;\/p&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse;\&quot;&gt;&lt;caption&gt;\n&lt;p class=\&quot;paragraph\&quot; style=\&quot;margin-bottom: 12.0pt; line-height: normal;\&quot;&gt;&lt;span style=\&quot;font-size: 11.0pt; mso-ascii-font-family: Calibri; mso-fareast-font-family: Calibri; mso-hansi-font-family: Calibri; mso-bidi-font-family: Calibri; color: black; mso-themecolor: text1;\&quot;&gt;Summary of population revisions&lt;sup&gt;1&lt;\/sup&gt;&lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;\n&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td style=\&quot;width: 167px;\&quot; width=\&quot;154\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Reference period (as at)&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;width: 164px;\&quot; width=\&quot;114\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/information-releases\/national-population-estimates-at-31-march-2025-2023-base\/\&quot;&gt;Estimates published on&amp;nbsp;&lt;\/a&gt;&lt;\/strong&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/information-releases\/national-population-estimates-at-31-march-2025-2023-base\/\&quot;&gt;15 May 2025&amp;nbsp;&lt;\/a&gt;&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td style=\&quot;width: 164px;\&quot; width=\&quot;133\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Estimates published on&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;19 August 2025&lt;\/strong&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;\/
