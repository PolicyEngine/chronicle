provenance_notes: >-
  Raw-only record for cbo-revenue-projections-income-by-source-2026-02; no
  package reads this file. It is CBO's workbook of revenue projections for the
  February 2026 baseline, unchanged. The maintainer downloaded it in a browser
  on 2026-11-27 from the link on CBO's Budget and Economic Data page, because
  cbo.gov answers automated requests with a DataDome HTTP 403, and the browser
  saved it as 51138-2026-02-Revenue.xlsx. The file's address was not requested
  again from here; CRS Insight IN12690 of 2026-05-06 links the same address.
  The package's manifest and concept evidence named the file
  51138-2026-02-Revenue-Projections.xlsx until chronicle#449. Its
  Contents sheet says "This file was reposted on February 26, 2026, to correct
  values in Tables 7a and 7b for the revenue effects of the 2025 reconciliation
  act", and the file was last saved on 2026-02-26. The package reads a CSV
  extract of sheet "3.Individual Income Tax Details" (billions of dollars,
  calendar years). tests/test_chronicle_449_cbo_revenue_projections.py reads
  that sheet and checks that each of the CSV's 84 values (six rows, 2023 to
  2036) equals its workbook cell. The bytes were uploaded to storage.r2 on
  2026-11-27 with chronicle publish-raw and checked there with chronicle
  verify-raw.
