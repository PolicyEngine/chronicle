provenance_notes: "Released 16 September 2026, data to July 2026. One row per area\
  \ and month, 151,920 rows, with a 54-column header row; Date is dd/mm/yyyy. Country\
  \ and region series start in April 1968, and the 317 England and Wales local authorities\
  \ run 379 months from January 1995. Index levels are January 2023 = 100. Each of\
  \ the property-type (Detached, SemiDetached, Terraced, Flat), funding (Cash, Mortgage),\
  \ buyer (FTB, FOO) and build (New, Old) breakdowns carries Price, Index and 1-month\
  \ and 12-month changes. The sales-volume columns are blank before 1995 and for the\
  \ latest months while registrations complete. Each monthly release revises earlier\
  \ months, so a consumer pins this release by sha256, and the bytes are archived\
  \ in R2 and not committed. The Isles of Scilly (E06000053) have no series. Open\
  \ Government Licence v3.0, with HM Land Registry's attribution: Contains HM Land\
  \ Registry data \xA9 Crown copyright and database right 2020. This data is licensed\
  \ under the Open Government Licence v3.0."
