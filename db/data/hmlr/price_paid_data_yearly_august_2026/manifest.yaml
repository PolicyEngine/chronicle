provenance_notes: Published 29 September 2026 (objects last modified 28 September
  2026). Each file holds every standard (A) and additional (B) price paid transaction
  with a date of transfer in its year, as at this release, with the release's amendments
  and deletions applied; together the 32 files are the release's single file (pp-complete.csv,
  5,525,539,417 bytes, 31,610,742 rows), which is not registered because publish-raw
  uploads through wrangler, whose object put refuses files above 300 MiB. CSV, 16
  quoted fields, no header row; field contract in docs/data-sources/uk-high-value-housing.md.
  Open Government Licence v3.0 with HM Land Registry's attribution statement; the
  address fields are Royal Mail and Ordnance Survey address data that HM Land Registry
  licenses for personal or non-commercial use and for residential property price information
  services, so the bytes are archived in R2 and not committed to this public repository.
