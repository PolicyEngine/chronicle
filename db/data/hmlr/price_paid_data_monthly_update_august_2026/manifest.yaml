provenance_notes: 'Published 29 September 2026 (object last modified 28 September
  2026). The release''s change file: transactions received in August 2026 and the
  additions, changes and deletions it makes to earlier releases, one row each, record
  status A, C or D in column 16 against the transaction unique identifier. Chronicle
  archives the file and does not apply it; hmlr-price-paid-data-yearly-august-2026
  is the same release as a snapshot, one file per year of transfer. Field contract:
  docs/data-sources/uk-high-value-housing.md. Open Government Licence v3.0 with HM
  Land Registry''s attribution statement; the address fields are Royal Mail and Ordnance
  Survey address data that HM Land Registry licenses for personal or non-commercial
  use and for residential property price information services, so the bytes are archived
  in R2 and not committed to this public repository.'
