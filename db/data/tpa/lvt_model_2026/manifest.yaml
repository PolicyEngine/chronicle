provenance_notes: 'Tax Policy Associates'' open land value tax model, three files at commit
  fef94f9e7a36ada25a9c29f1f6827759a12eed07 (10 September 2026), still the repository''s latest
  commit on 4 November 2026. They are a third party''s modelling assumptions and model output,
  not a publisher''s statistics, so no facts are built from them. preprocessing/config.py
  holds the model''s constants: the rebuild cost per square metre by property type (BASE_COST_PER_M2,
  commented ''BCIS/ABI-style, houses vs flats''), the regional factors (REGION_FACTOR, commented
  ''BCIS regional location factors''), the calibration anchors and the transition settings.
  webapp/cells.json holds the model''s output for the web app: its run settings under ''meta''
  and its estimates by local authority under ''las''. LICENSE is the MIT licence the files
  are published under. The bytes are kept in R2 only: config.py is Python source, which this
  repository''s lint would otherwise read as its own code.'
