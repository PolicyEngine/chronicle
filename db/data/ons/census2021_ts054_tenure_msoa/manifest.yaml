provenance_notes: 'Nomis''s Census 2021 bulk download for TS054, which its census
  2021 bulk page lists. The package reads the member census2021-ts054-msoa.csv (587,135
  bytes, one row per MSOA and one column per category). The Nomis API query that ons-census2021-ts054-tenure-lad
  pins, at geography TYPE152 rather than TYPE424, returns at most 25,000 rows to an
  unregistered user: 2,778 of the 7,264 MSOAs. Fetched in three pages on 12 November
  2026, its 65,376 rows equal the member''s cells. The member''s metadata file (metadata/ts054-2021-2.txt)
  is version 2 of TS054, issued on 6 January 2023; ONS lists later versions of 30
  January and 28 March 2023, and the API''s current rows match this file.'
