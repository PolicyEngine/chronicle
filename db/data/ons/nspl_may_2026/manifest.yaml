provenance_notes: 'Every current and terminated UK postcode as at May 2026 (Data/NSPL_MAY_2026_UK.csv,
  2,726,477 rows, 35 fields in a header row; the same rows by postcode area under
  Data/multi_csv), with the user guide and code lists. The edition before ons-nspl-august-2026,
  registered for its deprivation and area classification fields: imd20ind is the IMD
  rank of the postcode''s 2011-based small area, IoD 2019 for England (1 to 32,844),
  WIMD 2019 for Wales (1 to 1,909), SIMD 2020v2 for Scotland (1 to 6,976 data zones)
  and NIMDM 2017 for Northern Ireland (1 to 890 SOAs), and oac11ind the 2011 Output
  Area Classification, beside oa21cd (2021 output area in England and Wales, 2022
  output area in Scotland, 2021 Data Zone in Northern Ireland). The Documents folder
  carries the four IMD lookups (IMD lookup EN as at 12_19, WA as at 12_19, SC as at
  12_20, NI as at 12_17). In August 2026 ONS replaced these with imd25ind (IoD 2025
  and WIMD 2025; zero in Scotland and Northern Ireland) and oac21ind. The zip is above
  GitHub''s 100 MB file limit, so its bytes are archived in R2 and not committed.
  Licence: Open Government Licence v3.0, with the attributions the user guide requires
  (OS data and Royal Mail data, Crown copyright and database right; Source: Office
  for National Statistics). The user guide also requires a separate Land and Property
  Services licence for commercial use of the Northern Ireland (BT) postcodes. Raw-only
  for chronicle#412 items 1 and 3.'
