provenance_notes: 'ONS 2021 Rural Urban Classification for England and Wales, the
  all-supplementary- tables workbook (released 6 March 2025, updated 31 March 2026):
  Tables 1A to 1E are the lookups for 2021 output areas (188,880), LSOAs (35,672),
  MSOAs (7,264) and local authority districts on 2021 (331) and 2024 (318) boundaries,
  each with RUC21CD, RUC21NM and the urban/rural flag; the other tables are supplementary.
