provenance_notes: 'Every current and terminated UK postcode (Data/NSPL_AUG_2026_UK.csv,
  2,729,090 rows, 35 fields in a header row; the same rows split by postcode area
  under Data/multi_csv), with the user guide and code lists. Each postcode carries
  dointr and doterm (introduction and termination, yyyymm) and is assigned best-fit,
  from its 2021 Census output area, to the 2021 output area (oa21cd), LSOA and MSOA
  2021, local authority (lad26cd), Westminster constituency on the July 2024 boundaries
  (pcon24cd) and other geographies. The zip is above GitHub''s 100 MB file limit,
  so its bytes are archived in R2 and not committed. Licence: Open Government Licence
  v3.0, with the attributions the user guide requires (OS data and Royal Mail data,
  Crown copyright and database right; Source: Office for National Statistics). The
  user guide also requires a separate Land and Property Services licence for commercial
  use of the Northern Ireland (BT) postcodes.'
