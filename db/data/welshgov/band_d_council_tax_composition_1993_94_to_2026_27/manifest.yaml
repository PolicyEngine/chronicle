provenance_notes: 'StatsWales ''Composition of average band D council tax by billing
  authority'' (Welsh Government budget requirement returns), the whole dataset as
  one CSV export, 1993-94 to 2026-27: GBP per band D and percentage change for the
  total council tax of the billing authority area, the county council element with
  and without community councils, the community council element and the police element,
  for the 22 billing authorities and ''Total Unitary Authorities'', with a council
  tax reduction scheme row for 1996-97 to 2000-01. The 2024-25 rows are the unrounded
  values behind Table 1 of welshgov-council-tax-levels-2024-25. The API regenerates
  the export, so this registration pins the bytes of one fetch. Licence: Open Government
  Licence v3.0. Raw-only for chronicle#412 item 2.'
