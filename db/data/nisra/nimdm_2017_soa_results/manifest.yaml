provenance_notes: 'Northern Ireland Multiple Deprivation Measure 2017 (NISRA, November
  2017), Super Output Area results: the MDM rank (1 most deprived to 890) and the
  seven domain ranks for each of the 890 SOAs (2001 boundaries, unchanged for 2011),
  with LGD 2014 and the 2015 default urban/rural status, and one sheet per domain
  with its indicators. NISRA publishes ranks, not deciles. The May 2026 NSPL (ons-nspl-may-2026)
  carries the MDM ranks as imd20ind. NISRA publishes no lookup from SOAs or Small
  Areas to Data Zones 2021. Licence: Open Government Licence. Raw-only for chronicle#412
  item 1.'
