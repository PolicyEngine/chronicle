provenance_notes: 'DESNZ domestic gas consumption by Middle Layer Super Output Area
  (MSOA, 2021 boundaries) and Scottish intermediate zone (2022 boundaries), Great
  Britain, 2010 to 2024, revised 19 December 2025: number of consuming meters, total
  consumption (kWh), mean and median kWh per meter and non-consuming meters, one sheet
  per gas year (mid- May to mid-May from 2018; weather corrected). 2015 onwards use
  2021/2022 geographies, 2010-2014 the 2011 ones. Disclosive areas are moved to ''Unallocated''
  and shown blank, with no text markers. Registered raw-only for chronicle#356: the
  LSOA/data-zone workbook carries the facts.'
