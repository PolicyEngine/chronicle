provenance_notes: >-
  Raw-only record for jct-tax-expenditures-2025; no package reads this file.
  It is the publisher PDF of JCX-45-25, "Estimates of Federal Tax Expenditures
  for Fiscal Years 2025-2029", dated December 3, 2025 (52 pages), unchanged.
  The maintainer downloaded it in a browser on 2026-11-27 because jct.gov
  blocks automated requests; the browser saved it as x-45-25.pdf. Table 1
  ("Tax Expenditure Estimates By Budget Function, Fiscal Years 2025 - 2029",
  billions of dollars) is on printed pages 34 to 43, with a Corporations block
  and an Individuals block of five fiscal years each. The package reads a CSV
  extract of 13 lines of the Individuals block's 2025 column;
  tests/test_chronicle_449_jct_tax_expenditures.py checks the extract against
  this file's text. storage.r2 is a content-addressed locator; no upload or
  archival completion is asserted.
