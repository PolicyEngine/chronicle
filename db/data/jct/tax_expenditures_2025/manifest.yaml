notes:
- 'Fiscal year 2025 values use the Individuals block of Table 1 only (the Corporations
  block is not read). JCX-45-25 gives its estimates by federal fiscal year, in billions
  of dollars, so the package types them fiscal_year 2025 and the CSV holds dollars.
  Each CSV row is one JCT line: jct_line_label is the line as Table 1 prints it, without
  its footnote marks, and jct_table_1_printed_page is the printed page of the PDF that
  holds it. JCT prints the charitable deduction on three lines; the CSV keeps the three
  lines apart and holds no sum.

  '
- 'The CSV is a manual extract of the publisher PDF (x-45-25.pdf), which the maintainer
  downloaded in a browser on 2026-11-27 because jct.gov blocks automated requests. The
  PDF is registered raw-only in ../tax_expenditures_2025_raw_only/manifest.yaml, and
  tests/test_chronicle_449_jct_tax_expenditures.py reads its text and checks each CSV
  value against its Table 1 line. The publication page is given as the source URL; the
  PDF link on that page carries an attachment id that was not recorded. storage.r2 is a
  content-addressed locator; no upload or archival completion is asserted.

  '
