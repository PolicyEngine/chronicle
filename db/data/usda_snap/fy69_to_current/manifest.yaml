table: SNAP Monthly State Participation and Benefit Summary FY69 to current
notes: >-
  The package reads member FY24.xlsx of the publisher zip
  snap-zip-fy69tocurrent-11.zip. Its sheets are dated 11/13/2026 and hold fiscal
  year 2024, October 2023 to September 2024, as USDA published it then. Until
  chronicle#449 the package read FY24.xlsx of snap-zip-fy69tocurrent-6.zip
  (sheets dated 06/13/2025, zip sha256
  3eee091653335a00a80c6fe76b84904b309dddba0c8b63a256b7e079e4101abe). The two
  members have the same sheets, labels and cell positions. USDA changed 495 of
  their numbers, in 34 of the 64 Total rows among others. The zip bytes are the
  bytes that ../fy69_to_current_fy2025/manifest.yaml registers, copied
  unchanged. That file was fetched with chronicle fetch-artifact on 2026-11-26
  from www.fna.usda.gov, to which www.fns.usda.gov answers with a 301 redirect.
  The -6 zip stays in this directory because
  usda-snap-fy2025-monthly-state-caseloads reads it
  (manifest_fy2025_monthly_source_package.yaml). The bytes were uploaded to
  storage.r2 on 2026-11-27 with chronicle publish-raw and checked there with
  chronicle verify-raw.
