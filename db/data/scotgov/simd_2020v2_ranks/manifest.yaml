provenance_notes: 'Scottish Index of Multiple Deprivation 2020v2 ranks (SIMD 2020
  published 28 January 2020; version 2, April 2020, corrects the income ranks DWP
  supplied): the overall rank (1 most deprived to 6,976) and seven domain ranks for
  each of the 6,976 data zones on 2011 boundaries, with NRS 2017 small area population
  estimates. It prints no deciles; the data zone lookup (scotgov-simd-2020v2-data-zone-lookup)
