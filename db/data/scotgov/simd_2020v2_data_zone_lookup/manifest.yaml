provenance_notes: 'SIMD 2020v2 data zone lookup, the file updated in 2025: for each
  of the 6,976 data zones on 2011 boundaries, the overall SIMD 2020v2 rank, vigintile,
  decile and quintile, the domain ranks, 2017 population and working-age population,
  the 2016 six-fold urban rural class and the intermediate zone, council area, health
  board, multi-member ward and Scottish Parliament constituency (sheet ''SIMD 2020v2
  DZ lookup data''; the other data sheet is a lookup tool). Its ranks equal scotgov-simd-2020v2-ranks.
  The NRS Census 2022 index (nrs-census2022-index, Census_2022_Index/OA_TO_HIGHER_AREAS.csv)
  already assigns each 2022 output area a 2011 data zone and this rank, best fit by
  output area centroid. Licence: Open Government Licence v3.0. Raw-only for chronicle#412
  item 1.'
