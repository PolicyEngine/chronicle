provenance_notes: 'Published 24 September 2026 with the summary tables, as CTSOP_3_1__1_.zip;
  members dated 22 September 2026. Members: CTSOP_3_1/CTSOP3_1_2026_03_31.csv (95,493,012
  bytes) and CTSOP_3_1/CTSOP3_1_CSV_table_notes.xlsx. The CSV has a header row (geography,
  ba_code, ecode, area_name, band, 43 property-type columns from bungalow_1 to unknown, all_properties)
  and 392,014 rows, one per area and band (All, A to H, and I in Wales): ENGWAL 10, NATL 19,
  REGL 81, CTYMET 261, LAUA 2,884, MSOA 65,784, LSOA 322,965 and UNMD 10. Counts are rounded
  to the nearest 10, with counts between 1 and 4 suppressed as [c]; band I rows are printed
  only for areas in Wales and for England and Wales and the unmatched row. The zip assigns
  properties to areas by postcode (ONS NSPL), so its rows can differ from the summary workbook''s
  billing-authority counts (pinned under voa-council-tax-bands-2026): its England and Wales
  rows equal table CTSOP3.0''s, its country rows do not, and 2,214 of its 2,884 LAUA rows
  differ. Open Government Licence v3.0.'
