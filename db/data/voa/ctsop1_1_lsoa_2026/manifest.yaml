provenance_notes: 'Published 24 September 2026 with the summary tables; members dated 22 September
  2026. Members: CTSOP_1_1/CTSOP1_1_2026_03_31.csv (4,288,885 bytes) and CTSOP_1_1/CTSOP1_1_CSV_table_notes.xlsx;
  the 2025 zip''s CSV was CTSOP1.1/CTSOP1_1_2025_03_31.csv. The CSV has a header row (geography,
  ba_code, ecode, area_name, band_a to band_i, all_properties) and 43,296 rows: ENGWAL 1,
  NATL 2, REGL 9, CTYMET 29, LAUA 318, MSOA 7,264, LSOA 35,672 and UNMD 1 (ecode UNMATCHED).
  Counts are rounded to the nearest 10, with counts between 1 and 4 suppressed as [c]; band
  I is [z] outside Wales. The zip assigns properties to areas by postcode (ONS NSPL), so its
  rows can differ from the summary workbook''s billing-authority counts (pinned under voa-council-tax-bands-2026):
  its national, regional and unmatched rows equal table CTSOP2.0''s, and 316 of its 318 LAUA
  rows differ from CTSOP1.0''s. Open Government Licence v3.0.'
