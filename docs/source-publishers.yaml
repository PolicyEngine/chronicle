# Publisher of every Chronicle source folder (packages/<folder> and
# db/data/<folder>; every package lives in the same folder as its data).
#
# Chronicle holds government-produced records only: see the 2026-10-21
# amendment to docs/adr-chronicle-facts-only.md. tests/test_source_publishers.py
# fails when a folder is missing here, when an entry names no folder, or when a
# non-government folder appears beyond the three that predate the rule.
#
# status:
#   government      part of a national, subnational, or supranational government
#   edge_case       a category whose treatment awaits a ruling (edge_case names it);
#                   existing packages stay until then
#   non_government  predates the rule; stays until its migration is ruled on
schema_version: chronicle.source_publishers.v1
folders:
  bea:
    publisher: U.S. Bureau of Economic Analysis
    status: government
  bfp:
    publisher: Federal Planning Bureau (Belgium)
    status: government
    notes: Same publisher as fpb, under its French acronym.
  cbo:
    publisher: Congressional Budget Office
    status: government
  census:
    publisher: U.S. Census Bureau
    status: government
  cms_aca:
    publisher: Centers for Medicare & Medicaid Services
    status: government
  cms_medicaid:
    publisher: Centers for Medicare & Medicaid Services
    status: government
  cms_medicare:
    publisher: Centers for Medicare & Medicaid Services
    status: government
  cms_nhe:
    publisher: Centers for Medicare & Medicaid Services
    status: government
  defra:
    publisher: Department for Environment, Food & Rural Affairs
    status: government
  desnz:
    publisher: Department for Energy Security and Net Zero
    status: government
  dfc_ni:
    publisher: Department for Communities (Northern Ireland)
    status: government
  dfe:
    publisher: Department for Education
    status: government
  dfi_ni:
    publisher: Department for Infrastructure (Northern Ireland)
    status: government
  dft:
    publisher: Department for Transport
    status: government
  dwp:
    publisher: Department for Work and Pensions
    status: government
    notes: >-
      pip_daily_living_foi_2025 is a DWP freedom-of-information reply fetched
      from WhatDoTheyKnow, a third-party host.
  eurostat:
    publisher: Eurostat (European Commission)
    status: edge_case
    edge_case: intergovernmental
  federal_reserve:
    publisher: Board of Governors of the Federal Reserve System
    status: edge_case
    edge_case: central_bank
  fpb:
    publisher: Federal Planning Bureau (Belgium)
    status: government
  hhs_acf:
    publisher: Administration for Children and Families (HHS)
    status: government
  hhs_acf_liheap:
