    status: government
  hmlr:
    publisher: HM Land Registry
    status: government
  hmrc:
    publisher: HM Revenue & Customs
    status: government
  ici:
    publisher: Investment Company Institute
    status: non_government
    notes: Trade association of US regulated funds.
  ird:
    publisher: Inland Revenue (New Zealand)
    status: government
  irs_soi:
    publisher: Internal Revenue Service, Statistics of Income
    status: government
  isc:
