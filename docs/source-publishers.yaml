# Publisher of every Chronicle source folder (packages/<folder> and
# db/data/<folder>; every package lives in the same folder as its data).
#
# Chronicle admits only government-produced records: see the 2026-10-21
# amendment to docs/adr-chronicle-facts-only.md. tests/test_source_publishers.py
# fails when a folder is missing here, when an entry names no folder, or when a
# non-government or edge-case folder appears beyond those added before the rule
# took effect. It reads these entries only; it does not check each package.
#
# status:
#   government      part of a national, subnational, or supranational government
#   edge_case       a category whose treatment awaits a ruling (edge_case names
#                   it: central_bank, regulator, public_body, supranational);
#                   existing folders stay, and new ones wait for the ruling
#   non_government  added before the rule took effect; stays until its
#                   migration is ruled on
#
# notes give joint publishers, other publishers inside a folder, and some
# third-party hosts as examples; they are not a complete list of where each
# package's files are fetched.
schema_version: chronicle.source_publishers.v1
folders:
  bea:
    publisher: U.S. Bureau of Economic Analysis
    status: government
  bfp:
    publisher: Federal Planning Bureau (Belgium)
    status: government
    notes: Same publisher as fpb, under its French acronym.
  cbo:
