# OBR Economic and fiscal outlook, October 2026 (published with the Budget on 28 October
# 2026), for PolicyEngine/chronicle#393. Written by
# scripts/build_obr_efo_october_2026.py from the pinned workbook; edit that, not this.
# Values are as the tables print them, with value_scale for the stated unit. Fiscal-year
# periods store the opening year (2025-26 -> 2025). Each year column's assertion follows
# the band above it: 'Outturn' (and 'Estimate', 'Estimated Outurn') gives observation
# and 'Forecast' gives source_projection; a table with no band is all forecast. In
# October, 2025-26 is outturn, where in March it was a forecast, and 2031-32 is a new
# forecast year.
#
# The March 2026 package's lines (package obr-efo-expenditure-march-2026), under the
# obr.efo_2026_10 prefix with their line ids, display labels and concepts. Each is found
# by its table's title and its row's label; the row numbers and the October table number
# ride on each record set and its notes. Where both vintages publish a line and year,
# Chronicle keeps this package's number (chronicle#397), so the March package keeps only
# the years October does not print.
#
# Rows October renames against March: council_tax_england: row label 'England council
# tax receipts' (March table 4.1) is now 'England council tax receipts1' (table 5.1);
# council_tax_total: row label 'Total net council tax receipts1' (March table 4.1) is
# now 'Total net council tax receipts2' (table 5.1).
#
# Expenditure tables 4.x are now 5.x, with the same titles. Table 5.1 adds a footnote to
# England's council tax receipts: outturn reflects the latest MHCLG pre-measures data
# and does not align with the public sector finances data used elsewhere. Its 'NI
# domestic rates' row is one of the two places the OBR shows Northern Ireland domestic
# rates; the other is receipts table 4.2 row 6, in obr-efo-receipts-october-2026.
#
