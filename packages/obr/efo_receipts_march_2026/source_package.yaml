# OBR EFO March 2026. Values are GBP billion in the workbook (value_scale 1e9).
# Fiscal-year periods store the opening year (FY2024-25 -> 2024), matching the
# hmrc fy2024_25 precedent, with one explicit record set per year (not {year}
# templating; see PolicyEngine/ledger#135 on bundle year handling). FY2024-25
# columns are labelled 'Outturn' in the workbooks, so the fy2024 record sets carry
# assertion observation; later years are source_projection. Row labels are exact
# cell text including OBR footnote markers (e.g. 'Incapacity benefits2').
#
# Years (chronicle#397): where two vintages publish a number for the same line and
# year, Chronicle keeps the later one. The October 2026 EFO
# (obr-efo-receipts-october-2026) prints this package's lines from 2025-26 to 2031-32,
# and sheet 3.10's from 2026-27, so this package keeps only what October lacks: each
# line's 2024-25 outturn and, for the seven duties sheet 3.10 breaks betting and gaming
# duties into, the 2025-26 forecast. Sheet 3.10's own 2025-26 total goes too: October
# prints it as table 4.1's 'Betting and gaming taxes', the same concept and accrued
# basis under another line id, so scripts/build_obr_efo_october_2026.py keeps that
# line's March record set itself. Every other line keeps its line id and concept here,
# and the October build reads its lines from here; scripts/build_uk_excise_packages.py
# and scripts/build_uk_1095_port_packages.py leave out every line and year the October
# package publishes, matched on concept, basis, geography, entity and period.
#
# Sheet 3.7 (chronicle#357 item 2), appended by scripts/build_uk_1095_port_packages.py
# at the end of the file: 'Property transactions taxes: Receipts by sector', the EFO's
# only breakdown of SDLT, by property type and rate. The EFO publishes no split by type
# of buyer. Ported: SDLT from residential property, its main rates, higher rates on
# additional dwellings (net of refunds, matching HMRC's Table 2f) and non-UK resident
# surcharge, and SDLT from non-residential property. Total SDLT (row 6) is sheet 3.8's
# 'Stamp duty land tax' line and is not repeated; ATED and the devolved taxes are not
# asked for. Stamped United Kingdom like the rest of this package, though SDLT applies
# in England and Northern Ireland.
#
# Excise lines (chronicle#381, for PolicyEngine/microcosm#1359), generated by
# scripts/build_uk_excise_packages.py before the sheet 3.7 block: sheet 3.8's tobacco,
# spirits, wine, beer and cider, and betting and gaming duties, vaping tax and (for
# chronicle#395) vehicle excise duties, on the cash basis the sheet's title and note
# state; the seven duties sheet 3.10 breaks betting and gaming duties into, forecast
# years only (since chronicle#397 its total is the October package's); sheet 3.11's
# tobacco clearances; sheet 3.12's alcohol clearances and its accrued alcohol receipts;
# and sheet 3.2's Camelot payments to the National Lottery Distribution Fund, horserace
# betting levy and statutory gaming levy. Sheet 3.10 states no basis: its total equals
# sheet 3.1's 'Betting and gaming taxes' row, which that sheet's note puts on an accrued
# basis, in every year, so its lines are stamped accrual. These lines carry
# period_coverage and, where the workbook gives one, an accounting_basis dimension that
# keeps a duty's cash and accrued lines apart. Clearances are stored in sticks,
# kilograms and litres of pure alcohol (value_scale 1e6, 1e3 and 1e5), with the
# published unit kept as a dimension. Sheet 3.2 states no basis, and its lines carry
# none.
schema_version: ledger.source_package.v1
