label: 'OBR EFO March 2026 detailed forecast tables: receipts'
dimension_labels:
  'obr.efo_line': 'EFO table line'
  'accounting_basis': 'Accounting basis'
  'published_unit': 'Published unit'
dimension_value_labels:
  'accounting_basis':
    'cash': 'Cash basis'
    'accrual': 'Accrued basis'
  'published_unit':
    'million_sticks': 'Million sticks'
    'thousand_kilograms': 'Thousand kilograms'
    'thousand_hectolitres_of_alcohol': 'Thousand hectolitres of alcohol'
