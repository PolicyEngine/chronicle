# OBR EFO March 2026 detailed forecast tables: economy, one record set per
# calendar year and line (not {year} templating). Calendar 2024 is outturn
# (assertion observation).
#
# Years (chronicle#397): where two vintages publish a number for the same line and
# year, Chronicle keeps the later one. The October 2026 EFO
# (obr-efo-economy-october-2026) prints every line here for calendar 2025 to 2031, so
# this package keeps only calendar 2024. Every line keeps its line id and concept,
# and scripts/build_obr_efo_october_2026.py reads its lines from here.
