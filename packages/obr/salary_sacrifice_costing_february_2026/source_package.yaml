# OBR supplementary forecast information release 'Costing of charging NICs on
# salary-sacrificed pension contributions' (5 February 2026), Table 1.1 'Tax base and static
# costing', for PolicyEngine/chronicle#302 section 5. The measure (announced at Budget 2025)
# ends the NICs exemption for salary-sacrificed and bonus-sacrificed pension contributions
# above an annual GBP 2,000 threshold from April 2029. No later OBR update of this costing
# was found (March 2026 EFO, policy measures database, forecast evaluation and fiscal risks
# reports checked on 2026-09-29), so this is the newest release for every year it covers.
#
# Every cell of Table 1.1 is ported, 2027-28 to 2030-31 (the table's columns; the costing's
# Table 1.6 behavioural lines are not asked for and are not ported):
# - the tax base - salary-sacrificed and bonus-sacrificed pension contributions above the
#   GBP 2,000 annual threshold (paragraphs 1.6 and 1.9 define the base as the contributions
#   above the threshold; the row labels do not repeat it, so it rides on the
#   contribution_portion filter). Salary-sacrifice base: HMRC's 2024 ASHE-based estimate grown
#   at 0.9 per cent a year faster than employment, plus OBR employment and wage growth;
#   bonus-sacrifice base: historic APSS107 returns grown with employment and wages. HMRC
#   holds no administrative salary-sacrifice data (paragraph 1.4);
# - the increase in the average employee and employer NICs rates on each base (percentage
#   points, zero before April 2029);
# - the static yield of each base and the total static yield, GBP billion, positive = an
#   increase in receipts. The table labels the salary-sacrifice yield row '(GBP m)' while its
#   values are GBP billion (in 2029-30 its 2.5 and the bonus row's 2.3 make the total row's
#   GBP 4.9 billion, to rounding); the facts carry GBP with a billion scale and the guard
#   keeps the publisher's text.
#
# All are OBR-certified HMRC projections: provenance model_output, assertion
# source_projection. UK geography (NICs are UK-wide).
