# OBR EFO March 2026. Values are GBP billion in the workbook (value_scale 1e9).
# Fiscal-year periods store the opening year (FY2024-25 -> 2024), matching the
# hmrc fy2024_25 precedent, with one explicit record set per year (not {year}
# templating; see PolicyEngine/ledger#135 on bundle year handling). FY2024-25
# columns are labelled 'Outturn' in the workbooks, so the fy2024 record sets carry
# assertion observation; later years are source_projection. Row labels are exact
# cell text including OBR footnote markers (e.g. 'Incapacity benefits2').
#
# Years (chronicle#397): where two vintages publish a number for the same line and
# year, Chronicle keeps the later one. The October 2026 EFO
# (obr-efo-expenditure-october-2026) prints every line here from 2025-26 to 2031-32,
# so this package keeps only each line's 2024-25 outturn. Every line keeps its line id
# and concept, and scripts/build_obr_efo_october_2026.py reads its lines from here.
# The high-value council tax surcharge, forecast from 2028-29, has no 2024-25 value,
# so it is in the October package only; the October build keeps its March record set
# as the template for that line.
#
# Table 4.1's council tax block: the England, Scotland and Wales receipts rows,
# 'Total council tax receipts' (row 15, their sum), 'NI domestic rates', the
# 'Council tax accruals adjustment' (row 17) and 'Total net council tax receipts'
# (row 19, which equals rows 15 + 16 + 17 + 18). Row 18, the 'High-value Council
# tax surcharge', is blank in 2024-25 (it is forecast from 2028-29) and emits no
# fact. Consumers that bind a household council tax liability choose between the
# nation rows or row 15 (cash receipts, GB) and row 19 (which adds NI domestic
# rates and the accruals adjustment); the percentage-change rows are not ported.
#
# Table 4.9's geography (chronicle#357 item 4). The table prints none. Its
# "DWP social security" lines are DWP's forecast: DWP's benefit expenditure and
# caseload tables (Spring 2026, the dwp-benefit-expenditure-caseload-spring-2026
# package) say in Notes 1 that they are consistent with this EFO and that its
# table 4.9 publishes the DWP forecast, and Notes 3 and 4 give the coverage:
# Great Britain, or people resident overseas receiving United Kingdom benefits,
# with a benefit's Scottish cases leaving the figures from the point executive
# competence moved to the Scottish Government. Each line carries that coverage:
# - Great Britain (K03000001), with people resident overseas: housing benefit
#   (not on JSA), incapacity benefits, Pension Credit, statutory maternity pay,
#   both Universal Credit lines, State Pension and jobseeker's allowance.
#   Incapacity benefits include Severe Disablement Allowance, which DWP gives
#   for England and Wales only from 1 April 2020; like DWP's own incapacity
#   totals, the line keeps Great Britain, and its notes say so.
# - England and Wales (K04000001), with people resident overseas: DLA and PIP
#   and Attendance Allowance (moved 1 April 2020) and Carer's Allowance (moved
#   3 September 2018) in every year the table carries, and Winter Fuel Payment,
#   devolved from April 2024, from 2024-25, the table's first year.
# - Northern Ireland (N92000002): 'NI social security in welfare cap' (row 34)
#   and 'NI social security outside welfare cap' (row 45), the Northern Ireland
#   Executive's social security, ported for the first time.
# - United Kingdom (K02000001): child benefit, an HMRC line that covers
#   Northern Ireland, and the table 4.1 and 4.19 lines, as before.
# Each measure's concept_evidence_notes names its basis. No value changes.
