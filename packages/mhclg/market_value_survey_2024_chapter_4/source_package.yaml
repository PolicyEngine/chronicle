# MHCLG, Market Value Survey: 2024 (English Housing Survey; published 14 April 2026),
# Chapter 4: High Value Homes annex tables, the sheets PolicyEngine/chronicle#408 item 2
# asks for: AT4_1, AT4_2, AT4_3, AT4_4, AT4_5, AT4_6. Written by
# scripts/build_uk_408_packages.py.
#
# The VOA valued each dwelling in the EHS physical survey as at 1 July 2024 (EHS 2022-23
# and 2023-24) and, for the 2015 survey printed alongside, as at 1 October 2015 (EHS
# 2013-14 and 2014-15); each fact's period is that valuation date. Values in GBP thousand
# are stored with value_scale 1000, as printed; dwelling and household counts in thousands
# likewise; percentages as printed. Sample sizes are their own measure
# (mhclg.mvs_sample_size). 'A' sheets are all of England, 'B' sheets England excluding
# London (mhclg:england_excluding_london, as DfT's England outside London is coded).
# Tenure, value band and the row characteristics are filters; every record set is
# survey_aggregate. Cells the publisher prints as 'u' (fewer than five unweighted cases)
# or '[x]' (not applicable) emit no fact. Not ported, because they print Chapter 1's cells
# again (asserted equal wherever both tables print a value): AT4.1's £1m-£2m and
# £2m-or-more rows (AT1.2A's) and its sample sizes (AT1.1A's); AT4.2's rest-of-England
# £1m-£2m and £2m-or-more rows (AT1.2B's all-dwellings column) and its sample sizes
# (AT1.1B's and AT1.3's London row). AT4.1 prints its 2024 all-dwellings base with two
# digits transposed against AT1.1A.
#
# Filter values: each value band has one slug wherever it is printed: '£1m-£2m' is
# gbp_1m_to_2m (Chapter 1's '£1,000,000 to £2,000,000'); '£2m or more' (AT4.1, AT4.2) and
# '£2m plus' (AT4.3, AT4.4) are gbp_2m_or_more (Chapter 1's '£2,000,000 or more'); 'Less
# than £1m' is less_than_gbp_1m and '£1m plus' (AT4.6) gbp_1m_or_more. AT4.5's 'Home value
# £1.5m or higher' and 'Perceives value at or above £1.5m' are gbp_1_5m_or_more, and 'Home
# value lower than £1.5m' and 'Perceives value below £1.5m' less_than_gbp_1_5m.
