  measures:
  - measure_id: medium_density_p25
    label: Land value, medium site density, 25th percentile of new-build house price per square metre
      (GBP per hectare)
    ordinal: 0
    column: M
    source_column_id: medium_density_p25
    source_column_dimensions:
      site_density_scenario: medium
      new_build_price_percentile: p25
    expected_column_header_row: 5
    expected_column_header: 25
    concept: mhclg.residential_land_value_before_floor
    source_concept: mhclg.residential_land_value_before_floor
    concept_relation: source_label
    concept_authority: mhclg
    concept_evidence_url: https://www.gov.uk/government/publications/land-value-estimates-for-policy-appraisal-2023/land-value-estimates-for-policy-appraisal-guidelines-for-use
    concept_evidence_notes: 'MHCLG, Land value estimates for policy appraisal: guidelines for use (16
      March 2026): the estimates value a hypothetical 1 hectare site ''with services provided up to the
      boundary, without contamination or abnormal development costs ... with planning permission granted'',
      for use in economic appraisal. ''These land values do not represent the market value of land'',
      and they ''are therefore not directly comparable with the 2019 land value estimates for policy appraisal,
      or previous publications.'' Valuation date 1 October 2023. Residential values come from MHCLG''s
      residual land valuation model: the gross development value less development costs, for a site with
      a net developable area of 80% of the gross (outside London), under a low, central (''Medium'') and
      high site density scenario, at the lower quartile, 40th percentile, median, 60th percentile and
      upper quartile of new-build house price per square metre in the council area. Sheet ''Residential''
      is the estimate before MHCLG''s minimum ''floor value''; it does not report negative values (''a
      site may not be viable''), so those cells emit no fact.'
    unit: gbp_per_hectare
    aggregation: mean
    filters:
      site_density_scenario: medium
      new_build_price_percentile: p25
    constraints:
    - variable: site_density_scenario
      operator: ==
      value: medium
      label: Site density scenario
    - variable: new_build_price_percentile
      operator: ==
      value: p25
      label: Percentile of new-build house price per square metre
    expected_cell_type: number
