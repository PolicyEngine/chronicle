    concept: mhclg.residential_site_density
    source_concept: mhclg.residential_site_density
    concept_relation: source_label
    concept_authority: mhclg
    concept_evidence_url: https://www.gov.uk/government/publications/land-value-estimates-for-policy-appraisal-2023
    concept_evidence_notes: 'MHCLG, Land value estimates for policy appraisal 2023, sheet ''Residential'':
      site density (dwellings per hectare) under the low, central (''Medium'') and high scenarios for
      each council area. The central scenario is the implied average density of developments in the area
      over the last 10 years (net additional dwellings and land use change statistics); the low and high
      scenarios vary it using Glenigan data. A density floor of 30 and a ceiling of 400 dwellings per
      hectare apply. The sheet ''Residential (adj for floor)'' prints the same densities.'
    unit: dwellings_per_hectare
    aggregation: mean
    filters:
      site_density_scenario: low
