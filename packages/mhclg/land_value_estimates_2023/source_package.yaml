  - measure_id: high_density_p25
    label: Land value, high site density, 25th percentile of new-build house price per square metre (GBP
      per hectare)
    ordinal: 0
    column: R
    source_column_id: high_density_p25
    source_column_dimensions:
      site_density_scenario: high
