# VOA (HMRC Valuation Office statistics), Council Tax: stock of properties 2026, summary
# tables (published 24 September 2026; counts from the Valuation Office's administrative
# database as at 31 March 2026, England and Wales), sheets CTSOP1.0 and CTSOP2.0, for
# PolicyEngine/chronicle#408 item 3. Written by scripts/build_uk_408_packages.py. The
# workbook's CTSOP3.0 and CTSOP4.0 are the 2026 property-type and build-period packages.
#
# CTSOP1.0 counts every property in the England (1993) and Wales (2005) valuation lists by
# band and administrative area: England and Wales, the two countries, the nine English
# regions, counties, and every billing authority. CTSOP2.0 assigns properties to
# Westminster constituencies by postcode (ONS NSPL): its 575 constituency rows, and its
# country and regional rows, which count only the properties matched to a constituency and
# carry geography_match == matched. Its 'Unmatched' row (note 15) counts the rest, on the
# England-and-Wales footprint with geography_match == unmatched, as in the 2025 package.
# Its England and Wales row repeats CTSOP1.0's and is asserted equal rather than ported
# twice. The 2025 package's country and regional rows are CTSOP2.0's, without the filter.
#
# All counts are rounded to the nearest 10, with counts between 1 and 4 suppressed and
# presented as '[c]'; band I is used only in Wales's valuation list from 1 April 2005, and
# England's band I cells are '[z]'. Neither marker is a value, so those cells emit no
# fact. Areas carry the ONS codes and names the workbook prints (note markers dropped from
# names): ENGWAL and NATL rows are countries, REGL regions, CTYMET counties, metropolitan
# counties and Inner and Outer London (typed as regions, as other packages type them),
# LAUA billing authorities (Powys and Carmarthenshire each combine three billing
# authorities, notes 13 and 14), PCON 2024 Westminster constituencies. Barnsley and
# Sheffield are E08000038 and E08000039, the codes ONS gave them in 2025.
