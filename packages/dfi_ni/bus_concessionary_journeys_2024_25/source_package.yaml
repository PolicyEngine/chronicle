# Figure 6 publishes bus full-fare concession journeys alongside paid and
# subsidised-school journeys. This package reuses the pinned official workbook
# from the figures 3 and 4 package without changing those facts' identities.
# Chronicle preserves the publisher's SmartPass measure and does not infer a
# fare-paying remainder from total journeys.
