# DWP 'Winter Fuel Payment statistics for winter 2024 to 2025' (16 September 2025), England
# and Wales, for PolicyEngine/chronicle#302 section 6. In winter 2024 to 2025 Winter Fuel
# Payment was paid only to pensioners on Pension Credit or certain other means-tested
# benefits (GBP 200, or GBP 300 with someone aged 80 or over), and Scotland paid its own
# Pension Age Winter Heating Payment instead.
#
# Ported for England and Wales, the nine English regions and Wales: Table 1 (recipients by
# sex and by sex and age band - up to 69, 70 to 74, 75 to 79, 80 and over), Table 4 (the
# recipients at GBP 200 and GBP 300; its all-amounts column restates Table 1's total) and
# Table 7 (beneficiaries, recipients plus eligible partners; the share of the pension-age
# population beside it is not ported). The 'unknown' region rows have no GSS code and are not
# ported; local authority and constituency tables are not ported. The winter becomes
# fiscal_year 2024.
