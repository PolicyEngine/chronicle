# DWP, 'Young people and work: interim report'
# (https://www.gov.uk/government/publications/young-people-and-work-interim-report),
# analytical annex data tables (ODS; published with the report on 28 May 2026, the file
# replaced on 10 August 2026 when 'an error in the Excel formula' was corrected in Table
# 23 only), Table 28, for PolicyEngine/chronicle#442 item 1
# (PolicyEngine/uk-milburn-review-dashboard#1). Written by
# scripts/build_uk_young_people_work_review_packages.py from the pinned workbook; edit
# that, not this.
#
# Ported: Table 28 'PIP and UCH-LCWRA caseload and expenditure projections, aged 16-24',
# all four rows (the UC health element, 'UCH - LCWRA', and PIP; caseload and expenditure)
# in every year the table prints, 2019-20 to 2040-41. Benefit is the filter
# health_and_disability_benefit (uc_health_lcwra, personal_independence_payment), on DWP's
# own concepts dwp.benefit_caseload_count and dwp.benefit_expenditure_amount (as
# dwp-benefit-expenditure-caseload-spring-2026 uses them), at age_band 16_to_24 (ages 16
# to 24, as the title says) and England and Wales ('Population: England and Wales').
# Caseloads are people (entity person, role claimant): the annex defines UC Health as 'UC
# Health (UC-H) in this analysis refers to claimants in receipt of the 'limited capability
# to work' element, also known as the 'health element', which is offered to claimants
# receiving a LCWRA WCA outcome'. Expenditure is entity government, role payer, scaled
# from £ million to pounds. The workbook's other 57 tables are not ported.
#
# Outturn and projection: the table's period line reads 'Period: 2026-27 to 2040-41' and
# the annex describes 'fifteen-year caseload projections', so 2026-27 to 2040-41 are DWP's
# projections (provenance model_output, assertion source_projection), and 2019-20 to
# 2025-26, which 'Source: DWP administrative data' and the annex's 'based on data from
# Stat-Xplore and Autumn Budget 2025 benefit caseload and expenditure tables' describe,
# are the series' history (administrative, observation). The annex: 'The forecast outputs
# are compared to final Autumn Budget 2025 forecasts for PIP and DLA to 2031 and an
# average uplift is assumed for the years 2031 to 2042. Forecast outputs have used a
# simple methodology and should be treated as an indication only. Forecast estimates are
# based on the proportion of young people and therefore may not align with published
# benefit expenditure and caseload tables.'
#
# Rounding (the table's notes): 'Note 1: Caseloads have been rounded to the nearest
# 1,000.' 'Note 2: Expenditure has been expressed in millions and has been rounded to the
# nearest 10 for UCH - LCWRA and nearest 100 for PIP'. Neither the table nor the annex
# names a price basis, so none is asserted.
#
# Checks: the annex's findings (section 18.5) quote this table, and the generator asserts
# each: PIP expenditure 'approximately £1.3 billion in the financial year ending 2020' and
# 'around £3.3 billion in the financial year ending 2025'; '£6.5 billion and cover 700,000
# young people' in five years' time (2031-32: 6,500 and 703,000); 'up to 877,000 and £9.2
# billion' and the LCWRA caseload '229,000' and '£750 million' in the financial year
# ending 2041. The cover sheet prints 'Published:28 May 2025', a slip for 2026. 88 facts.
