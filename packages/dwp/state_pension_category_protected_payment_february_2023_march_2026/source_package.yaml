  manifest: manifest.yaml
  vintage: stat_xplore_2026_09_29
  extracted_at: '2026-09-29'
  extraction_method: >-
    Stat-Xplore Open Data API table response parsed and unpivoted to one row per cube cell,
    the count cube's rows first and then the mean cube's where the request names two
    measures; database str:database:SP_New; measures str:count:SP_New:V_F_SP_CASELOAD_New;
    str:statfn:SP_New:V_F_SP_CASELOAD_New:CAWKLYAMT:MEAN; fields in response order:
    str:field:SP_New:F_SP_QTR_New:DATE_NAME; str:field:SP_New:V_F_SP_CASELOAD_New:COA_CODE;
    str:field:SP_New:V_F_SP_CASELOAD_New:CAT; str:field:SP_New:V_F_SP_CASELOAD_New:PROCPAY;
    value sets: C_SP_CATEGORY, C_SP_PROCPAY, C_SP_QTR_New, V_C_MASTERGEOG21_GB; reference
    months Feb-23 (February 2023) through Mar-26 (March 2026), inclusive; recode total: true
    on CAT, PROCPAY, total: false on every other field.
  parser: statxplore_table_json_rows
  sheet_name: api_response
  artifact_year: 2026
