# DWP State Pension caseload and mean weekly amount (Stat-Xplore SP_New), Great Britain
# residents, by category of pension and protected payment, for PolicyEngine/chronicle#302
# section 1: the pre-2016 categories (A, B, ABL, BL, AB, Graduated Retirement Benefit only,
# C, D) against the new State Pension, with and without a protected payment.
#
# The reference months are DWP's published points from the first of 2023 to the latest:
# February 2023 to March 2026, quarterly (February, May, August, November) and then March 2026,
# the point of the 2026 Benefits Statistics Compendium, which replaced the quarterly
# releases after May 2026 (202606 is rejected as an invalid value). The publisher's field
# is named Quarter but each item is a point-in-time caseload at a reference month, so
# period_type is month.
#
# Geography is the residence-based field (National - Regional - LA - OAs). Cases paid to
# people living abroad (1,093,218 at March 2026) and cases with an unknown address (7,278)
# are separate items of that field and are not requested, so the facts are Great Britain
# residents only: 12,207,303 at March 2026, against 13,307,794 in all, the compendium's
# 13.3 million (the three items sum to 13,307,799: Stat-Xplore perturbs each cell
# independently, so a total is DWP's own cell, not a sum). Northern Ireland pensions are
# paid by DfC, not DWP, and are in no cell here.
# Annotation VI: the Shetland Islands' cases from August 2023 to August 2024 sit in the
# unknown-geography item; totals are unaffected.
#
# Category of pension is the value set C_SP_CATEGORY; protected payment is the field of
# that name (In receipt / Not in receipt / Not applicable (Pre-2016 State Pension)). Both
# request total: true, so DWP emits the margins and the grand total.
#
# Of 44 series, 21 are zero in every month and are not ported. The
# 598 facts are every other cell and a mean for each cell with at least one case.
schema_version: ledger.source_package.v1
package_id: dwp-state-pension-category-protected-payment-february-2023-march-2026
label: 'DWP Stat-Xplore: State Pension recipients and mean weekly amount by category of pension and protected payment, Great Britain residents, February 2023 to March 2026'
dimension_labels:
  'dwp.state_pension_category_protected_payment': 'Category of State Pension by protected payment'
artifact:
  source_name: dwp
  source_table: 'State Pension caseload and mean weekly amount by category of pension and protected payment, Great Britain residents, February 2023 to March 2026'
  resource_package: db
