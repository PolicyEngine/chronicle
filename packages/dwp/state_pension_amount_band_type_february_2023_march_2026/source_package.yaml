# DWP State Pension caseload (Stat-Xplore SP_New), Great Britain residents, by grouped
# weekly amount of benefit and type of pension, for PolicyEngine/chronicle#302 section 1.
# The live value set runs Nil payment, Under £20, £20-bands to £100, £100 to under £150,
# then £50-bands to £300 and over, plus Unknown (the issue feared a £150-and-over top band;
# that is the older metadata). Counts only: a mean inside an amount band restates the band.
#
# The reference months are DWP's published points from the first of 2023 to the latest:
# February 2023 to March 2026, quarterly (February, May, August, November) and then March 2026,
# the point of the 2026 Benefits Statistics Compendium, which replaced the quarterly
# releases after May 2026 (202606 is rejected as an invalid value). The publisher's field
# is named Quarter but each item is a point-in-time caseload at a reference month, so
# period_type is month.
#
# Geography is the residence-based field (National - Regional - LA - OAs). Cases paid to
# people living abroad (1,093,218 at March 2026) and cases with an unknown address (7,278)
# are separate items of that field and are not requested, so the facts are Great Britain
# residents only: 12,207,303 at March 2026, against 13,307,794 in all, the compendium's
# 13.3 million (the three items sum to 13,307,799: Stat-Xplore perturbs each cell
# independently, so a total is DWP's own cell, not a sum). Northern Ireland pensions are
# paid by DfC, not DWP, and are in no cell here.
# Annotation VI: the Shetland Islands' cases from August 2023 to August 2024 sit in the
# unknown-geography item; totals are unaffected.
#
# Amount band and type request total: true, so DWP emits the margins and the grand total.
# Of 52 series, 19 are zero in every month and are not ported. The
# 429 facts are every other cell.
