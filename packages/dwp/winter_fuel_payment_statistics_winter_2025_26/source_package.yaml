# DWP 'Winter Fuel Payment statistics for winter 2025 to 2026' (15 September 2026), Table 1
# (recipients, payment amounts and beneficiaries by region), for PolicyEngine/chronicle#302
# section 6. England and Wales: Winter Fuel Payment is devolved in Scotland from winter 2024
# to 2025. From winter 2025 to 2026 it is paid again to pensioners at every income (GBP 100 to
# GBP 300, by age and household), and HMRC recovers it through Income Tax from those with
# income over GBP 35,000 (hmrc-winter-fuel-payment-charge-2025); these counts are payments
# before recovery and exclude the pensioners who opted out.
#
# Ported for England and Wales, the nine English regions and Wales: total recipients, the
# recipients at each amount (GBP 100, 150, 200, 300; the release notes that the amounts relate
# to recipients, not beneficiaries) and total beneficiaries - recipients plus eligible
# pension-age partners, the 11.0 million the release reports against 10.9 million
# recipients. The 'unknown' region row (6,233 recipients) has no GSS code and is not ported;
# local authority and constituency tables are not ported. Counts carry disclosure control,
# so parts need not sum to totals (the four amounts sum to 7 fewer than the total). The
# winter becomes fiscal_year 2025, as in the Stat-Xplore package
# dwp-winter-fuel-payment-recipients-winters-2024-25-2025-26, which carries the age, amount
# and gender cross this workbook does not.
