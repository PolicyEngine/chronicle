# DWP 'Workplace pension participation and savings trends of employees: 2009 to 2025'
# (30 July 2026), estimates derived from the ONS Annual Survey of Hours and Earnings (ASHE),
# Great Britain, for PolicyEngine/chronicle#302 section 4. This edition is the newest release
# for every data year; the window from 2023 is ported: 2023, 2024 (revised) and 2025
# (provisional).
#
# Participation (Tables 1.1, 1.3a, 1.4, 1.5): the share of employees participating in a
# workplace pension (rounded to the nearest point, stored as a fraction) and the number
# participating (rounded to the nearest thousand; the publisher calls the counts indicative),
# by sector (public, private, overall), for eligible employees - those meeting the
# automatic-enrolment age and earnings criteria - and for all employees (Table 1.1 adds the
# ineligible), by annual earnings band (1.3a; bands in 2024 earnings terms, Note 9), age band
# (1.4) and gender (1.5). Sample-size blocks are not ported; suppressed ([x]) and negligible
# ('low') cells emit no fact.
#
# Amounts saved (Tables 2.1 eligible savers, 2.2 all savers): the annual total saved and its
# employee (net of tax), employer and income-tax-relief parts by sector, and the median
# contribution in GBP and as a share of pay by sex. Note 18: all amounts are in 2025 earnings
# terms. Each edition restates every year's amounts in its own year's earnings terms and
# re-cleans the data, so data year 2023 is GBP 152.0 billion here against the nominal GBP 131.8
# billion of the 2023 edition; the concepts name the price basis so the series is never read
# as nominal. 2025 (GBP 166.1 billion: employee GBP 44.2bn, employer GBP 101.6bn, tax relief
# GBP 20.3bn) is in its own year's terms. Annual amounts are derived from one April pay period
# (Note 22). The publisher does not say how salary-sacrificed contributions are classified;
# employers report them, so they most likely appear as employer contributions (not verified).
#
# Parity: 22,610,000 eligible employees participating in 2025 (90 per cent) and 24,207,000
# of all employees (82 per cent).
