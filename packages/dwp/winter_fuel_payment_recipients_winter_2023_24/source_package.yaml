# DWP Winter Fuel Payment recipients (Stat-Xplore WFP23, 'data to winter 2023'), Great
# Britain, by country, age band, amount and gender, winter 2023 to 2024 - the only winter of
# the 2023-onward window this database holds (later winters are in the WFP database,
# dwp-winter-fuel-payment-recipients-winters-2024-25-2025-26), for PolicyEngine/chronicle#302
# section 6. Winter Fuel Payment was then paid across Great Britain (and to some pensioners
# in the EEA and Switzerland, not requested here), at GBP 250 to GBP 600: in the release's
# words, all Winter Fuel Payments made included an additional Pensioner Cost of Living Payment
# of either GBP 150 or GBP 300.
#
# The DWP year label ('2023 / 2024') becomes fiscal_year 2023, the financial year the payments
# fall in. England, Wales and Scotland are rows with their own GSS codes; the Great Britain
# total and the regions are ported from the winter's statistics workbook
# (dwp-winter-fuel-payment-statistics-winter-2023-24), whose local tables are not ported.
# Age band (65 to 69 up to 90 and over), amount and gender request total: true.
# Winter 2023 to 2024: 11,586,201 recipients in the three countries. The workbook's Great
# Britain row, 11,589,506, is higher because its country cells are higher than the cube's in
# every country (England by 2,848, Wales by 155, Scotland by 311; the workbook header
# compares them); DWP does not say why the two releases differ. This cube is the later of the
# two: DWP first published Winter Fuel Payment statistics on Stat-Xplore, for winter 2020 to
# 2021 onwards, with the winter 2024 to 2025 statistics on 16 September 2025, a year after the
# workbook (24 September 2024), and describes them as perturbed for disclosure control.
#
# Of 960 series, 672 are zero and are not ported: the GBP 100, 150 and
# 200 amounts, which belong to later winters; the Unknown items; and the amounts never paid
# at an age - GBP 300 and GBP 350 below 80 (except GBP 350 to some English women aged 75 to
# 79), GBP 250 and GBP 500 at 85 and over, and GBP 600 to Welsh and Scottish men aged 65 to
# 69. The 288 facts are every other cell.
