# DWP Stat-Xplore 'Households on Universal Credit' by local authority and Payment Indicator,
# January 2025 to May 2026, extracted 2026-10-15, for PolicyEngine/chronicle#339
# (microcosm#1198). It re-extracts the all-claims series of 7 October 2026 with Payment
# Indicator as a dimension: 'Yes' counts households with a calculated award paid in the
# month, 'No' those with a nil award, and their sum is the all-claims count the retired
# package carried (within disclosure control). DWP's 'household' is the UC unit of
# assessment.
# The query echoes inside the preserved response. The geography recode is the October
# query's, and the 'Unknown' area (ZZXXXXXXX) emits no facts. Each cell is as published: DWP
# perturbs cells at source, so independently queried cubes and margins need not reconcile.
