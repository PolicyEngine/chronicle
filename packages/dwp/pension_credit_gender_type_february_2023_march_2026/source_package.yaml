# DWP Pension Credit caseload and mean weekly award (Stat-Xplore PC_New), Great Britain,
# by gender of the claimant and type of Pension Credit, for PolicyEngine/chronicle#302
# section 2.
#
# The reference months are DWP's published points from the first of 2023 to the latest:
# February 2023 to March 2026, quarterly and then March 2026, the point of the 2026 Benefits
# Statistics Compendium, which replaced the quarterly releases after May 2026. Each item is
# a point-in-time caseload, so period_type is month. Pension Credit is a Great Britain
# benefit (Northern Ireland's is DfC's); the geography is the residence-based field.
#
# A claim is one per benefit unit, so the entity is benefit_unit, as in
# dwp-benefit-expenditure-caseload-spring-2026; the claimant's partner is not counted
# separately (DWP's beneficiaries including partners are not a Stat-Xplore measure).
# Annotation III: from May 2024 DWP removed the 'Residual MIG' type, whose very few cases
# had been misclassified, so the type value set is Guarantee Credit only, Savings Credit
# only and Both.
#
# Gender and type request total: true. Of 16 series, 4 (the
# Unknown gender) are zero in every month and are not ported. The 312 facts are
# every other cell and a mean for each cell with at least one claim.
schema_version: ledger.source_package.v1
package_id: dwp-pension-credit-gender-type-february-2023-march-2026
label: 'DWP Stat-Xplore: Pension Credit claims and mean weekly award by gender and type, Great Britain, February 2023 to March 2026'
dimension_labels:
  'dwp.pension_credit_gender_type': 'Gender by type of Pension Credit'
artifact:
  source_name: dwp
  source_table: 'Pension Credit caseload and mean weekly award by gender and type of Pension Credit, February 2023 to March 2026'
  resource_package: db
  resource_directory: data/dwp/pension_credit_gender_type_february_2023_march_2026
  manifest: manifest.yaml
  vintage: stat_xplore_2026_09_29
  extracted_at: '2026-09-29'
  extraction_method: >-
    Stat-Xplore Open Data API table response parsed and unpivoted to one row per cube cell,
    the count cube's rows first and then the mean cube's where the request names two
    measures; database str:database:PC_New; measures str:count:PC_New:V_F_PC_CASELOAD_New;
    str:statfn:PC_New:V_F_PC_CASELOAD_New:CAWKLYAMT:MEAN; fields in response order:
    str:field:PC_New:F_PC_QTR_New:DATE_NAME; str:field:PC_New:V_F_PC_CASELOAD_New:COA_CODE;
    str:field:PC_New:V_F_PC_CASELOAD_New:CCSEX; str:field:PC_New:V_F_PC_CASELOAD_New:PCTYPE;
    value sets: C_PC_CCSEX, C_PC_PCTYPE, C_PC_QTR_New, V_C_MASTERGEOG21_GB; reference months
    Feb-23 (February 2023) through Mar-26 (March 2026), inclusive; recode total: true on
    PCTYPE, CCSEX, total: false on every other field.
  parser: statxplore_table_json_rows
  sheet_name: api_response
  artifact_year: 2026
