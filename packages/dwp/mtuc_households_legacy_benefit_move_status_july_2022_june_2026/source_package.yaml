  measures:
  - measure_id: households_sent_migration_notice
    label: Households sent a Move to UC migration notice
    ordinal: 0
    column: B
    source_column_id: value
    expected_column_header_row: 1
    expected_column_header: value
    concept: dwp.mtuc_households_sent_migration_notice
    source_concept: dwp.mtuc_households_sent_migration_notice
    concept_relation: source_label
    concept_authority: dwp
    concept_evidence_url: https://www.gov.uk/government/publications/move-to-universal-credit-statistics-background-information/move-to-universal-credit-statistics-background-information
    concept_evidence_notes: 'Official statistics in development. DWP Move to UC statistics (Stat-Xplore
      ''Households invited to Move to Universal Credit'', extracted 15 October 2026): households sent
      a managed migration notice from July 2022 to June 2026, Great Britain, by the legacy benefits the
      household received and its move status at DWP''s extract. Claimed UC: a claim made within one month
      after the deadline or any extension, including after the legacy award closed. Did not claim: no
      such claim, legacy award ended. In Progress: deadline not yet passed. Each release supersedes the
      last; cells carry Stat-Xplore''s random error.'
    unit: count
    aggregation: sum
    expected_cell_type: number
