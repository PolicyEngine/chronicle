    cell; database str:database:MtUC_Households; measure str:count:MtUC_Households:V_F_MtUC_Households;
    fields in response order: str:field:MtUC_Households:V_F_MtUC_Households:Legacy_Ben_Code; str:field:MtUC_Households:V_F_MtUC_Households:Claim_Status_Code;
    value sets C_MtUC_Legacy_Benefit_Claimed, C_MtUC_Claim_Status; recode total: true on both; the notice-month
    field is not requested, so each cell covers every notice month'
  parser: statxplore_table_json_rows
