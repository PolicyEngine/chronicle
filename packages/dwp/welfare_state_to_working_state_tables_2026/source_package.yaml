# DWP, 'From a Welfare State to a Working State: a new settlement for the next generation'
# (published 17 November 2026,
# https://www.gov.uk/government/publications/from-a-welfare-state-to-a-working-state-a-new-settlement-for-the-next-generation),
# the accompanying data tables (ODS), for PolicyEngine/chronicle#442 item 2
# (PolicyEngine/uk-milburn-review-dashboard#1). Written by
# scripts/build_uk_young_people_work_review_packages.py from the pinned workbook; edit
# that, not this.
#
# The workbook holds three tables, and none carries young people's PIP or UC health
# caseloads or spending: the review's annex (section 9) takes its 2036/37 PIP and DLA
# caseloads from the interim report's forecasts, which
# dwp-young-people-pip-lcwra-projections-2026 ports (Table 28). Ported here, as #442 asks,
# the two comparators:
#
# Table 2, 'Annual cost and saving per policy area in 2036/37, £m, 2026/27 prices': the
# annual cost (positive) or saving (negative) of the review's recommended policies in
# 2036/37 by policy area, and the 'Total NET Cost', on concept
# dwp.recommended_policy_package_annual_cost with filters policy_area and price_basis
# 2026_27_prices, scaled from £ million to pounds. The annex: 'The geographical coverage
# of the costs vary, in part depending on the devolved responsibilities of the departments
# involved', so each policy area carries the coverage the annex states for it (Opportunity
# and Support Guarantees Great Britain; health and education England; welfare savings the
# United Kingdom). Youth hiring incentives mix Great Britain grants with England-only
# apprenticeships, the annex names no coverage for the fiscal offsets, and the net total
# sums them all: those three are stamped Great Britain, the United Kingdom and the United
# Kingdom, with concept relation approximate. 'Local system reform' is '[low]', '[low]
# denotes a negligible figure, i.e. a figure that rounds to zero but is not zero' (the
# annex: 'less than £100m'), and emits no fact; the other rows sum to the total.
#
# Table 3, 'Total NEET rate impact profile, UK, 2026/27 to 2036/27' (sic: its columns run
# 2026/27 to 2036/37): the 'Projected baseline NEET rate' and the 'Projected NEET rate
# with report recommendations', filter neet_rate_projection, for 16 to 24 year olds in the
# United Kingdom, on concept dwp.neet_rate_projection, percent. The annex: 'The baseline
# forecast was derived from a central, seasonally-adjusted NEET projection scenario from
# Youth Futures Foundation (YFF) SARIMAX modelling using Labour Force Survey data from the
# Office for National Statistics (ONS) and Office for Budget Responsibility economic
# projections.' 'DWP and DfE internal analysis informed further adjustments to the
# baseline for the impacts of some employment programmes and education changes already in
# train or announced but not captured in the underlying data.' The generator asserts that
# the two agree in 2026/27, that the recommendations lower the rate every later year, and
# the annex's 'a NEET rate of around 6.8%' in 2036.
#
# Both tables are the review's 'internal modelling' (provenance model_output, assertion
# source_projection). The data tables' guidance: 'Analysis to inform the From a Welfare
# State to a Working State report has been led and coordinated by an independent team of
# government and external analysts.' 'The analysis produced to inform the From a Welfare
# State to a Working State report, including the material contained in this annex, should
# not be regarded as official government analysis or as representing agreed government
# policy.' Not ported: Table 1 ('Average annual investment in major NEET schemes, UK, 2026
# prices'), whose schemes' periods the table does not give. 29 facts.
