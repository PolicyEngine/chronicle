# DWP benefit expenditure and caseload tables 2026, published 14 April 2026:
# the outturn and forecast workbook DWP states is consistent with the OBR March
# 2026 Economic and fiscal outlook. It is the publisher's own decomposition of
# the welfare lines the obr-efo-expenditure-march-2026 package carries as
# single totals.
#
# Seven benefit families are ported - housing benefits, incapacity benefits,
# unemployment benefits, Pension Credit, State Pension, non-DWP welfare (tax
# credits and Child Benefit) and Universal Credit and equivalents - for
# financial years 2023-24 and 2024-25 (outturn) and 2025-26 and 2026-27
# (forecast). The workbook runs 1948-49 to 2030-31; these four years are the
# ones a consumer calibrating at 2025 and measuring at 2026 needs, and the rest
# is a one-line extension.
#
# The housing benefits worksheet carries the split PolicyEngine/microcosm#867
# needs: Housing Benefit by accommodation type, general needs against temporary
# and supported accommodation, in both expenditure and caseload. The publisher
# starts that split at 2024-25, so no fact is emitted for it at 2023-24. It
# also splits
# by benefit group (ESA, other working-age, Pension Credit, State Pension), by
# tenure, over and under Pension Credit qualifying age, by country and by
# funding source. The incapacity worksheet's caseload block carries ESA by
# payment type - credits only, contributory only, contributory and
# income-based, income-based only - which is the annual-average counterpart of
# the Stat-Xplore monthly cube section 5 of PolicyEngine/chronicle#280 asks
# for.
#
# Each worksheet holds three blocks: expenditure in nominal terms, the same
# expenditure restated in real 2026-27 prices, and caseload. Only the nominal
# and caseload blocks are ported. The real-terms block is the publisher's own
# deflation of the nominal one by a GDP deflator that is not in this workbook,
# so it is a restatement rather than a second measurement, and the issue asks
# for nominal.
#
# Sixty-seven lines are zero in every ported year and are not ported, as no
# all-zero category is (the #239 award-band ruling): Incapacity Benefit,
# Invalidity Benefit, Sickness Benefit and the Income Support sick-and-disabled
# lines in expenditure and caseload, which ended before 2023-24, and a handful
# of closed predecessor lines on the unemployment, Pension Credit and non-DWP
# welfare worksheets. That is 268 cells; the 882 facts here are every other
# ported cell. The workbook still carries those lines for the years they were
# paid.
#
# Forecast years are model_output and source_projection; outturn years are
# administrative observations. The Notes tab states the coverage: Great
# Britain, plus people resident overseas receiving United Kingdom benefits.
# Executive competence for several disability and winter benefits has
# transferred to the Scottish Government on dates the Notes tab lists, which
# changes what the Great Britain figures cover over time; none of the families
# ported here is one of those, but a consumer reading the wider workbook should
# know.
#
# Row identity is the publisher's line name, scoped by worksheet and carried as
# a benefit_forecast_line filter under a benefit_family filter. 'Total' and
# 'Personal tax credits' appear on several worksheets, and 'of which working
# age' under several parents on one, so a line id names its family and its
# nearest preceding heading: 'of which pensioners' under Incapacity Benefit
# (basic - total) and under Sickness Benefit are different lines. The 'Benefits
# paid Outside of UK included above' block restates lines already counted, so it
# is namespaced paid_outside_uk and never collides with them.
#
# A line's label is the publisher's text without its trailing footnote markers.
# DWP writes 'Universal Credit for those with health conditions' in the
# expenditure block and '...**' in the caseload block, and a dimension value may
# carry only one label; the markers are references to the notes under each
# worksheet, not part of the name. The row-header guard still expects the raw
# cell, asterisks and all.
