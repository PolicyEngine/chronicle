      equivalised weekly household income, in average 2024/25 prices (the release re-prices the whole
      series each year, so the price basis is a filter). Households Below Average Income, FYE 1995 to
      FYE 2025 release (26 March 2026). Weekly net disposable household income, equivalised with the modified
