      ranked by their household''s income. Relative low income is income below 60 per cent of the same
      year''s median. From FYE 2022 the survey is linked to DWP and HMRC administrative records, a break
      in series (Note 1). Figures are for the United Kingdom from 2002/03 and Great Britain before (Notes).
