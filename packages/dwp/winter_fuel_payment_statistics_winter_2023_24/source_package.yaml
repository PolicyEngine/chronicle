# DWP 'Winter Fuel Payment statistics for winter 2023 to 2024' (24 September 2024),
# caseload workbook, for PolicyEngine/chronicle#302 section 6. Winter Fuel Payment was then
# paid across Great Britain, at GBP 250 to GBP 600: every payment included an additional
# Pensioner Cost of Living Payment of GBP 150 or GBP 300.
#
# Ported for Great Britain, the nine English regions, Wales and Scotland: Table 1 (recipients by
# sex and by sex and age band - up to 69, 70 to 74, 75 to 79, 80 and over) and Table 4's
# all-ages columns (recipients at each amount, GBP 250 to GBP 600; its all-amounts column
# restates Table 1's total, and its age-band-by-amount columns are not ported). The 'All
# Cases' row adds the EEA, Switzerland and unknown regions (11,626,099 against Great
# Britain's 11,589,506) and has no single GSS code, so it is not ported; neither are the EEA
# tables nor the local tables. This release publishes no beneficiary count. The winter becomes
# fiscal_year 2023.
#
# The Wales and Scotland rows restate cells of the Stat-Xplore cube in
# dwp-winter-fuel-payment-recipients-winter-2023-24, and every one of them differs: the 28
# cells that match one to one (the total, each sex, each sex by age band to 79 and each
# amount, in both countries) and the four 80-and-over cells against the sum of the cube's
# three bands. The workbook is higher in 28 of the 32, by at most 311 recipients (Scotland's
# total, 1,012,884 here against 1,012,573) or 0.07 per cent (Wales at GBP 300); DWP does not
# say why the two releases differ. Both are DWP's published cells and are kept as
# published; for winters 2024 to 2025 and 2025 to 2026 the workbook and the cube agree cell
# for cell.
