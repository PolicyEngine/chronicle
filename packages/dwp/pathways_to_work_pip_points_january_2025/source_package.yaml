# DWP, 'Pathways to Work: Evidence pack: Chapter 2 reforming the structure'
# (https://www.gov.uk/government/consultations/pathways-to-work-reforming-benefits-and-support-to-get-britain-working-green-paper/pathways-to-work-evidence-pack-chapter-2-reforming-the-structure),
# the chapter's data tables (ODS; published 2 May 2025 with the full evidence pack; the
# consultation page records updates to this file on 17 and 23 July 2025, and the pinned
# file is the 23 July one), for PolicyEngine/chronicle#420 item 5
# (PolicyEngine/uk-pip-review-2026#3). Written by
# scripts/build_dwp_pathways_evidence_pack_package.py from the pinned workbook; edit that,
# not this.
#
# Ported, with the chapter's chart of the same number: Tables 2.9 and 2.10 (daily living
# and mobility points scored by age group), 2.11 and 2.12 (the same by primary health
# condition), 2.19 (the most points scored on any one daily living activity), 2.20 (2.19
# by daily living award), 2.21 (by age group), 2.22 (by condition), 2.27 (the points
# scored on each daily living activity) and 2.28 (2.27 by condition, five condition groups
# and the rest). Not ported: Tables 2.25 and 2.26 (by local authority and constituency;
# not requested), and the workbook's other tables (awards, prevalence, employment,
# reassessments, assessment channels, and 2.18, 2.23 and 2.24: the most points on an
# activity at clearance, by gender and by region).
#
# Population, in DWP's notes to every table: 'Figures are based on the PIP caseload at end
# January 2025'; 'Data includes working age claimants only'; 'Data only includes claimants
# living in regions under DWP policy ownership (England, Wales and Abroad)'; 'Data
# includes normal rules claimants only, and excludes special rules for end of life (SREL)
# claimants as they typically receive maximum or very high scores'. Tables 2.9 to 2.12
# cover the caseload (some claimants 'receive only one award element from Daily Living or
# Mobility', and the caseload 'does not include those claimants who were not awarded
# either component'); Tables 2.19 to 2.22, 2.27 and 2.28 'only include claimants awarded
# Daily Living component'. The facts carry these as filters and constraints worded as
# dwp-pip-daily-living-foi-2025 words them for the same caseload, and geography K04000001
# (England and Wales), the nearest GSS footprint; the claimants living abroad are in every
# figure and have no code. DWP's description of the source, on every table: 'Figures
# derived from DWP administrative data'. Period: month 2025-01.
#
# Shares are percentages as published, unit percent, aggregation share: of the group's
# claimants in each points band (daily living, 2.9 and 2.11), at each mobility total (2.10
# and 2.12), at each highest score on any one daily living activity (2.19 to 2.22), or
# scoring each value on an activity (2.27 and 2.28). Precision is the workbook's: Table
# 2.9 prints whole percentages, 2.10 to 2.12 full precision, the others mostly two
# decimals. The 'Volume' columns (claimants in the group, the shares' base, printed in
# whole thousands) are ported as counts. Each points column carries its value as a filter
# with a constraint, and the daily living bands their bounds; a share of claimants scoring
# 4 or more on one activity is the sum of Table 2.19's shares from 4 up, which Chronicle
# does not compute. Value ids for age groups, award rates, conditions and activities are
# Chronicle's; each row guards the printed text.
#
# Each of Tables 2.20 to 2.22 opens with Table 2.19's row ('All working age claimants in
# receipt of Daily Living component'), printed again with the same cells and volume, which
# the generator asserts and does not port again: Table 2.19 carries it, with daily living
# award rate standard_or_enhanced. The 'All ages' and 'All health conditions' rows of
# Tables 2.9 to 2.12 carry age_band or condition group 'all'. Both describe the whole
# caseload, on bases DWP prints differently (daily living 3,627,000 by age and 3,701,000
# by condition; mobility 3,620,000 and 3,691,000), so a total row of the age table and of
# the condition table carry the same constraints and share semantic keys: 28 facts in 14
# pairs, which the bundle reports as semantic duplicates, and a consumer chooses the
# table. Table 2.28's 'All other conditions' takes in every group but its five (Unknown or
# Missing included, note 9), so it is a value of its own, not Table 2.11's 'All Other
# Conditions'. A cell marked '-' emits no fact: in Tables 2.27 and 2.28 it is a score the
# activity's descriptors do not give (Activity 1 scores 0, 2, 4 or 8), and in Table 2.20
# the standard award's 10 and 12; the notes do not define it. 310 marked cells are not
# ported.
#
# Not ported, as publisher errors, 12 cells. First, Table 2.11's 'All health conditions'
# row (row 13) prints its bands in text order ('0-3', '10-11', '12-13', ..., '36-40',
# '4-7', '41+', '8-9'), not in the order of the headings above it: under '4-7' the share
# at 10-11, under '8-9' the share at 12-13, under '10-11' the share at 14-15, under
# '12-13' the share at 16-20, under '14-15' the share at 21-25, under '16-20' the share at
# 26-30, under '21-25' the share at 31-35, under '26-30' the share at 36-40, under '31-35'
# the share at 4-7, under '36-40' the share at 41+, under '41+' the share at 8-9. Each of
# these 11 cells is, within 0.02 points, the volume-weighted average of the table's 20
# condition rows for the band text order gives it; read in place, the '4-7' cell would be
# 16.80 against an average of 5.52. The row's '0-3' cell, which is in place, and its
# volume are ported, and Table 2.9's 'All ages' row gives the same distribution in whole
# percentages. Second, Table 2.28's Arthritis 'Activity 1 - Preparing food' row (row 22)
# prints 79.83 at 2 points, the cell of the Anxiety and Depression block's row 10, and
# adds to 98.74. Weighted by Table 2.22's volumes (the 'All other conditions' weight being
# 2,891,000 less the five groups' volumes), Table 2.28's blocks reproduce Table 2.27
# within 0.017 points in every cell but that one, where the gap, 0.121, is Arthritis's
# weight (279,000 of 2,891,000) times the row's 1.26-point shortfall; the row's other
# cells are ported.
#
# Parity, asserted by the generator on the published cells: every distribution adds to 100
# within 0.2 points (the largest gap, 0.164, is Table 2.22's 'All Other Conditions'),
# except the two rows above and Table 2.9's whole percentages, whose rows add to: All ages
# 98, 16 - 19 92, 20 - 29 100, 30 - 39 99, 40 - 49 100, 50 - 59 100, 60+ 102. Weighted by
# the published volumes, the parts reproduce the total row within: Table 2.9 0.59 points
# (whole percentages), 2.10 0.001, 2.12 0.003; and Table 2.19's overall shares within
# 0.008 (2.20, by award), 0.006 (2.21, by age) and 0.014 (2.22, by condition). Table
# 2.20's award volumes, 1,608,000 enhanced and 1,283,000 standard, are the counts
# FOI2025/24990 (dwp-pip-daily-living-foi-2025) gives for the same caseload. 1240 facts.
