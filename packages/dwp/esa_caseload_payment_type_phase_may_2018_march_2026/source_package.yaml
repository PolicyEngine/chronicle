# DWP Employment and Support Allowance caseload (Stat-Xplore ESA_Caseload_new), Great
# Britain, by Payment type and Phase of ESA claim, for chronicle#280 section 5. Every
# published reference month from May 2018 to March 2026 (32 of them; ESA is published
# quarterly, so the series runs Feb/May/Aug/Nov with March 2026 as the latest point).
# The publisher's field is named Quarter but each item is a point-in-time caseload at a
# reference month, so period_type is month and period is that month.
#
# This closes what dwp-benefit-statistics-february-2026 could not. That package carries
# the ESA total from the HTML summary - about 1 million for August 2025 - plus the
# contributions-based and income-related counts, and the publisher's own text says the
# total exceeds the two because some claimants claim both types and some receive credits
# only. Both of those are published here. August 2025: 624,745 contributions based,
# 113,801 both income and contributions based, 178,567 income based, 81,777 credits only
# and 998,885 in total. The paid caseload - the part a household frame can pay - is the
# total less the 81,777 credits-only claimants.
#
# Credits-only claimants receive no ESA payment but have their National Insurance record
# credited. The 'Both income and contributions based' item is its own item: those
# claimants are not also counted in either single-type item, so the items partition the
# caseload. They do not sum exactly to the published total - August 2025's items make
# 998,890 against 998,885 - because Stat-Xplore applies its disclosure control to each
# cell independently (annotation I on the response); the total is DWP's own cell, not a
# sum, and Chronicle emits both as published.
#
# Phase of claim is the second axis, taken in the same request: assessment phase, Work
# Related Activity group, support group and unknown. It is the Stat-Xplore counterpart of
# the ESA phase lines in dwp-benefit-expenditure-caseload-spring-2026, which gives
# financial-year averages of the same concept rather than reference-month points.
#
# Both recodes request total: true, so DWP emits both margins and the grand total itself.
# Those rows are table_record_kind: total with an 'all' filter on the totalled axis and no
# constraint for it, and no Chronicle-side summation is emitted.
#
# Seven series are zero in every one of the 32 months and are not ported, as no all-zero
# category is (the #239 award-band ruling): the Unknown payment type against each phase
# and against the phase total, and contributions-based and both-types claimants against
# Unknown phase. That is 224 cells; the 736 facts here are every other published cell.
