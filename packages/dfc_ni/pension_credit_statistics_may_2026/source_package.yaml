# Department for Communities Northern Ireland, Benefits Statistics Summary Publication,
# May 2026 (published 26 August 2026), Pension Credit workbook, for PolicyEngine/chronicle#302
# section 3: the Northern Ireland part of the UK Pension Credit caseload.
#
# This edition's rolling series make it the newest release for every point from February 2023
# to May 2026 (the Pension Credit series is identical across all fourteen 2023-2026 editions):
# Table 1 (claimants by type), Table 2 (partners), Table 3 (beneficiaries - claimants plus
# partners - by type) and Table 7 (average weekly payment by type) for those 14 points.
# Table 2's claimant column restates Table 1's total and its beneficiary column Table 3's
# total, so only its partner column is ported. The own-month cross-sections at May 2026 are
# ported too: Table 4 (claimants by age band and gender) and Table 6 (beneficiaries by age band
# and gender) in full, and Table 5's type-by-gender cells for claimants and beneficiaries (its
# all-genders columns restate Tables 1 and 3 at May 2026 and its Total row restates Tables 4
# and 6, so they are not ported twice).
#
# Not ported: Table 9 (payment bands), whose Both and Guarantee Credit only columns are
# mislabelled from the August 2025 edition on (its column totals are swapped against Table 1);
# Table 8 (duration); Tables 10 and 11 (districts, constituencies).
#
# Claimants are claims, one per benefit unit, so they carry entity benefit_unit and the
# canonical concept of the DWP Great Britain packages (dwp.pension_credit_benefit_units, source
# concept dfc_ni.pension_credit_claimants, exact); partners and beneficiaries are people.
# Counts are rounded to the nearest ten with further disclosure control; averages are GBP a
# week. May 2026: 60,030 claimants, 68,900 beneficiaries, average GBP 92.88 a week.
schema_version: ledger.source_package.v1
package_id: dfc-ni-pension-credit-statistics-may-2026
label: DfC Northern Ireland Pension Credit claimants, partners, beneficiaries and average weekly payment
  by type, February 2023 to May 2026, with May 2026 by age band and gender
dimension_labels:
  geography: Geography
  type_of_pension_credit: Type of Pension Credit
  gender: Gender
  age_band: Age band
dimension_value_labels:
  type_of_pension_credit:
    Both Guarantee and Savings Credit: Both Guarantee and Savings Credit
    Guarantee Credit only: Guarantee Credit only
    Savings Credit only: Savings Credit only
  gender:
    Female: Female
    Male: Male
  age_band:
    66-69: 66-69
    70-74: 70-74
    75-79: 75-79
    80-84: 80-84
    85-89: 85-89
    90 and over: 90 and over
    all: All ages
