# Department for Communities Northern Ireland, Benefits Statistics Summary Publication,
# May 2026 (published 26 August 2026; accredited official statistics compiled by NISRA
# analysts from DWP's State Pension GMS/MIDAS and Get Your State Pension extracts), State
# Pension workbook, for PolicyEngine/chronicle#302 section 3: the Northern Ireland part of the
# UK resident State Pension caseload, which no DWP Great Britain table carries.
#
# Every workbook carries a rolling 21-quarter series, so this edition alone is the newest
# release for every point from February 2023 to May 2026: Table 1 (claimants by category of
# pension, including the new State Pension) and Table 4 (average weekly payment by category)
# are ported for those 14 points. Earlier editions are not archived: the series was revised
# twice after first publication (the August 2024 edition replaced overstated Get Your State
# Pension estimates from August 2020; the February 2026 edition revised totals from October
# 2020 and every average from February 2021), and this edition carries the revised values.
# Its own-month cross-sections at May 2026 are also ported: Table 2 (age band by gender) in
# full, and Table 3's category-by-gender cells (its all-genders column restates Table 1's May
# 2026 row and its Total row restates Table 2's, cell for cell, so they are not ported twice). Earlier editions' cross-sections are not: they are not in this
# release, and before February 2026 they omitted the Get Your State Pension claimants
# (17,170 to 63,120, up to 19 per cent), whose age and gender were unknown.
#
# Counts are rounded to the nearest ten with further disclosure control, so parts need not sum
# to totals; averages are GBP a week to the penny. The date column holds quarter-end dates
# (the scan nearest each date), stamped here as the month. May 2026: 335,540 claimants, of whom
# 152,970 on the new State Pension; average GBP 227.39 a week. Northern Ireland pensioners
# living abroad are not in these tables (the National Insurance Fund account's GBP 3,462.9m for
# 2024-25 includes them).
#
# The counts share the canonical concepts of the DWP Great Britain packages
# (dwp.state_pension_recipients), with source concept dfc_ni.state_pension_claimants and an
# exact relation, as the NRS and NISRA population legs share the ONS concept: the same
# administrative measurement for the other nation. The averages are aligned approximately:
# DfC's note says they exclude Get Your State Pension cases, while the February 2026 revision
# suggests they may now include them; DWP's Stat-Xplore mean has no such exclusion.
# Tables 5 (payment bands) and 6 (local government districts) are not ported.
