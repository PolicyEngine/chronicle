    concept_evidence_notes: 'Direct publisher 2023 Census Count rows; one row per fact, scale
      1. New Zealand totals and Households are independently published rows, never sums of
      regions, tenure or household-size categories. Only household size (usual residents),
      three tenure categories, family type and their own totals are supplied: no household
      composition or social-renting split. Percent rows, 2013/2018, Māori-ethnic-group and
      other sections remain in the complete preserved CSV but emit no facts. Regional boundary
      vintage and a rounding policy are not stated in these files. Area Outside Region is
      its own publisher geography, never folded into a region. No reconciliation, imputation,
      aging, shares or consumer target construction.'
