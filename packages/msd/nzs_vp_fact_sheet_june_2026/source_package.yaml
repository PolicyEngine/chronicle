# The entire six-sheet publisher workbook is preserved as source cells.
# O4 emits only the June 2026 summary recipient counts for NZS and VP,
# including published additional-support, gender, age and ethnicity cuts.
# Percentages, earlier quarters, TA counts and the overseas-pension table remain
# source cells outside this package scope. No averages or national sums are made.
# Ethnicity is total-response and is not a partition; pension counts include
# non-qualified partners below age 65 as the publisher explicitly describes.
