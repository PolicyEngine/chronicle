      basis: survey_reference
      source_period_label: "2024"
      start_date: "2023-01-01"
      end_date: "2023-12-31"
      notes: >-
        The fact period preserves Eurostat TIME_PERIOD 2024 (survey year).
        For BE, DE, and FR the EU-SILC income reference period is the
