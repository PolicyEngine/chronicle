    measures: &transaction_measure
      - measure_id: amount
        label: Household-sector national-accounts non-financial transaction amount
        ordinal: 0
        column: H
        source_column_id: value
        expected_column_header_row: 1
        expected_column_header: value
        concept: belgium_household_national_accounts_non_financial_transaction_amount
        source_concept: eurostat.nasa_10_nf_tr.non_financial_transaction_amount
        concept_relation: exact
        concept_authority: ledger-be
        concept_evidence_url: https://ec.europa.eu/eurostat/databrowser/view/nasa_10_nf_tr/default/table?lang=en
        concept_evidence_notes: >-
          Each row is the exact current-price ESA 2010 amount published by
          Eurostat for Belgium and institutional sector S14_S15, which combines
          households and non-profit institutions serving households. B.2G,
          B.3G, and B.6G are balancing items, not independent paid and received
          flows; the API repeats their published levels under both directions.
          Eurostat marks the populated 2024 observations provisional in the
          returned status dimension.
          B.3G is mixed income before deducting consumption of fixed capital
          and combines labour and capital returns of household unincorporated
          enterprises. D.1 comprises D.11 wages and salaries plus D.12 actual
          and imputed employers' social contributions; on the resources side,
          D.12 is imputed to households and is not cash wages. D.4 and its
          components overlap: D.41 is ESA interest after the FISIM adjustment;
          D.42 is distributed income of corporations; D.44 is investment
          income attributable to insurance policyholders, pension entitlement
          holders, and collective investment fund shareholders, not taxable
          movable income; and D.45 is rent on natural resources, not tenant
          housing rent. D.5 covers current taxes on income, wealth, etc., not
          personal income tax alone. D.61 is the broad ESA net social
          contribution aggregate, and D.62 covers social benefits other than
          social transfers in kind. Chronicle stores every published aggregate
          without reconciling overlapping totals or constructing calibration
          targets.
        unit: eur
        aggregation: sum
        value_scale: 1000000
        expected_cell_type: number
