# Publisher: MBIE / Tenancy Services. Licence: CC BY 3.0 NZ (hub source brief).
# Pins detailed-monthly-tla-tenancy-september.csv, the file MBIE published on
# 9 Sep 2026 (data February 1993 to July 2026), fetched by the hub 2026-10-08.
# Window: August 2025 to July 2026, the latest 12 months in that file.
# MBIE describes the rental bond data as provisional and subject to revision,
# and says to always use the latest file; later files may revise these months.
# Preserve publisher cells; no reconciliation, imputation or annualisation.
# Full rows preserve log dispersion; it has no supported standard-deviation aggregation.
# CSV has no bedrooms, dwelling types, arithmetic mean or rent-population definitions.
# ta_2025 is assigned per the NZ checklist; no official TA register is staged.
# Headers TimeFrame and location_id carry the Time Frame and Location Id
# dimensions; TimeFrame values keep the publisher's d/mm/yyyy text.
