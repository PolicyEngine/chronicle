  measures:
  - measure_id: taxable_value
    label: Taxable value
    ordinal: 0
    column: C
    source_column_id: taxable_value
    expected_column_header_row: 6
    expected_column_header: Taxable value (£millions)
    concept: hmrc.benefit_in_kind_taxable_value
    source_concept: hmrc.benefit_in_kind_taxable_value
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/benefits-in-kind-statistics-july-2026
    concept_evidence_notes: 'Table 3A, Tax year 2024 to 2025 [note 1], Taxable value (£millions): company
      car benefit by range of total income of the recipient. Total income is ''inclusive of the benefit
      amount'' and ''comprises all incomes assessable for Income Tax'' (background quality report, section
      2.4). ''The figures in this table are grossed up from the sample which contains income information.
      The grossing methodology ensures that figures reflect the correct total taxable value but the total
      number of recipients will not necessarily match the figure in Table 1.'' HMRC estimates this table
      from the Survey of Personal Incomes cases matched to the P11D and RTI records: it grosses them up
      with standard SPI grossing factors, then applies a further adjustment factor so that the total taxable
      value equals the figure from the full data, and the same factor scales the recipients (background
      quality report, section 3.5). ''The data in this table are not fully complete. Some company cars
      are not included in the source data used to produce the statistics and are therefore excluded from
      the tables. For more information please see the background documentation.'' ''Numbers and amounts
      less than 10 are rounded to the nearest 5; those greater than 10 are rounded to the nearest 10''.
      Its ''All'' row prints the same value as Table 1''s 2024 to 2025 cell, which is ported, so it is
      not ported again.'
    unit: gbp
    aggregation: sum
    value_scale: 1000000
    expected_cell_type: number
