      by range of total income of the recipient, in bands HMRC groups more coarsely than Table 3A''s.
      Total income is ''inclusive of the benefit amount'' and ''comprises all incomes assessable for Income
      Tax'' (background quality report, section 2.4). ''The figures in this table are grossed up from
