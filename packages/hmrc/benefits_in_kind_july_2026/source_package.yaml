  - measure_id: recipients
    label: Recipients
    ordinal: 0
    column: M
    source_column_id: recipients
    expected_column_header_row: 3
    expected_column_header: 2022 to 2023
    concept: hmrc.benefit_in_kind_recipients
    source_concept: hmrc.benefit_in_kind_recipients
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/benefits-in-kind-statistics-july-2026
    concept_evidence_notes: 'Table 2A, recipients of company car benefit by the CO2 emissions of the car,
      2022 to 2023, in thousands. HMRC compiles these from employers'' P11D returns and, from 2017 to
      2018, the company cars employers payroll and report through Real Time Information (RTI), counting
      a car reported both ways once (background quality report, section 3.5). A recipient with more than
      one company car in the year is apportioned between the cars by the time each was held, so the rows
      add to recipients, not cars (background quality report, section 3.5). Missing or implausible CO2
      figures are imputed where other data allow, typically for under 2% of car benefits (section 3.5).
      From April 2020 the CO2 figures are WLTP measurements; before, they are NEDC figures, WLTP results
      converted back to NEDC equivalents from September 2018 (background quality report, section 2.4).
      This year uses the bands printed from 2020 to 2021: five-gram bands from 51 to 94 g/km, and 165
      to 169 and 170 g/km and over above 164. The sheet gives no rounding rule; its band cells are whole
      thousands. Its ''Total'' row restates Table 1''s car benefit recipients and is ported from Table
      1.'
    unit: count
    aggregation: sum
    value_scale: 1000
    expected_cell_type: number
