    concept_evidence_notes: 'Table 4, Tax year 2024 to 2025 [note 1], Average value (£): company car benefit
      by region of the recipient, with Northern Ireland, Scotland and Wales beside the English regions
      and an ''Unknown'' row. ''The figures in this table are grossed up from the sample which contains
      income information. The grossing methodology ensures that figures reflect the correct total taxable
      value but the total number of recipients will not necessarily match the figure in Table 1.'' HMRC
      estimates this table from the Survey of Personal Incomes cases matched to the P11D and RTI records:
      it grosses them up with standard SPI grossing factors, then applies a further adjustment factor
      so that the total taxable value equals the figure from the full data, and the same factor scales
      the recipients (background quality report, section 3.5). ''The data in this table are not fully
      complete. Some company cars are not included in the source data used to produce the statistics and
      are therefore excluded from the tables. For more information please see the background documentation.''
      ''Numbers are rounded to the nearest 5 and amounts to the nearest 10''. HMRC''s average taxable
      value per recipient, in GBP, rounded as the sheet states. The printed averages do not all equal
      the quotient of the printed, rounded taxable value and recipients, so they are ported as published,
      not derived. Its ''All'' row is not ported: it would share the key of Table 1''s 2024 to 2025 average,
      and prints a different value, so HMRC''s grossed recipients for this table differ from Table 1''s
      before rounding.'
