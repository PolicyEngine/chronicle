      to ensure statistical completeness. For more information please see the background documentation.''
      ''Numbers and amounts less than 10 are rounded to the nearest 5; those greater than 10 are rounded
      to the nearest 10''. HMRC''s average taxable value per recipient, in GBP, rounded as the sheet states.
