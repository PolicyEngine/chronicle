  - measure_id: house_purchase_withdrawers
    label: Number of individuals withdrawing for a house purchase
    ordinal: 0
    column: B
    source_column_id: house_purchase_withdrawers
    expected_column_header_row: 13
    expected_column_header: Number of individuals withdrawing for a house purchase
    concept: hmrc.lisa_withdrawers
    source_concept: hmrc.lisa_withdrawers
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/annual-savings-statistics-2026
    concept_evidence_notes: Lifetime ISA Table 1a, yearly withdrawals. The data underpinning these figures
      comes from monthly electronic uploads from LISA providers to HM Revenue & Customs. Some individuals
      may have made withdrawals from their account in multiple months. Therefore, the annual figure for
      the number of individuals making withdrawals from their accounts may be less than the sum of the
      monthly figures. The figures for the number of individuals are rounded to the nearest 50, the figures
      for the total withdrawal values are rounded to the nearest £1000, and the figures for the average
      withdrawal sizes are rounded to the nearest £1.
