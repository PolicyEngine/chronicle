# HMRC Tobacco Bulletin tables, July 2026, published 28 August 2026, for chronicle#381
# and PolicyEngine/microcosm#1359. Generated by scripts/build_uk_excise_packages.py from
# the pinned ODS; nothing re-downloaded.
#
# Table 2a (financial years 1990 to 1991 through 2025 to 2026) and Table 2b (calendar
# years 1991 to 2025): clearances of cigarettes, in sticks (published in millions), and
# of cigars, hand-rolling tobacco, other tobacco and the non-cigarette total, in
# kilograms (published in thousands). Table 1a and Table 1b: Tobacco Products Duty
# receipts by the same products and overall, GBP million, on the cash basis the
# bulletin's background and references page states. Tobacco for heating has no column:
# both sheets' notes say its receipts are included within Other. The clearances sheet's
# note repeats the receipts sheet's text ('Values are in £ millions'); the column
# headers, which every fact's lineage guards, give the units. Recent months are
# provisional; the monthly tables (1c and 2c) stay in the preserved workbook and source
# cells.
