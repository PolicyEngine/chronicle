# HMRC 'Tax relief statistics (January 2026)' (published 22 January 2026),
# https://www.gov.uk/government/statistics/tax-reliefs/tax-relief-statistics-january-2026,
# the employer National Insurance reliefs for young employees, for
# PolicyEngine/chronicle#420 item 9 (PolicyEngine/uk-young-people-work-review#6): the cost
# of each relief in Table 2 ('Six-year cost estimates (figures given in £ million)') and
# its claimants in Table 5 ('Claimants estimates'). Written by
# scripts/build_uk_young_people_packages.py from the pinned workbook.
#
# The two reliefs, as HMRC describes them: 'Relief on employer National Insurance
# contributions for employees under 21' (NIC - NS2), 'A zero rate of Class 1 secondary
# NICs for employees under 21 up to the upper secondary threshold'; and 'Relief on
# employer National Insurance contributions for apprentices under 25' (NIC - NS1), 'A zero
# rate of Class 1 secondary NICs for apprentices under 25 up to the apprentice upper
# secondary threshold'. HMRC's notes: 'The under 25 apprentice employer NICs relief takes
# precedence over the under 21 employer NICs relief (for apprentices under the age of
# 21)', so the two costs do not overlap; 'The larger than usual increase in cost presented
# in the 2025-26 forecast is expected due to the employer NICs changes which came into
# effect in April 2025, namely the reduction of the secondary threshold from £9,100 to
# £5,000 and the increase of the employer NICs rate from 13.8% to 15%'; and 'As this is a
# relief for the employer, we report the number of employers claiming the relief', so the
# claimants are employers (entity firm).
#
# Years 2020-21 to 2025-26, period the opening year (tax_year 2020 is 2020 to 2021). Table
# 2's 'First forecasted costing year' is '2025 to 2026' for both reliefs, so the 2025-26
# costs are HMRC's forecast (assertion source_projection) and the earlier years its
# estimates (observation). Table 5 prints no 2025-26 claimants ('Not available'), which
# emit no fact. The cost cells are numbers held as text in the workbook ('1,100'), read as
# numbers by the parser. The publication page's section 3.28 prints the same under-21
# series (560, 670, 850, 960, 1,100 and 1,900*, £ million; 270,000 to 340,000 claimants);
# the generator asserts it. 22 facts.
