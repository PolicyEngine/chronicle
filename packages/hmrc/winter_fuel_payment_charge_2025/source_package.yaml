# HMRC tax information and impact note 'Winter Fuel Payments charge' (policy paper, 26
# November 2025), for PolicyEngine/chronicle#302 section 6. From winter 2025 Winter Fuel
# Payment (and Scotland's Pension Age Winter Heating Payment) goes to pensioners at every
# income, and a new Income Tax charge equal to the payment recovers it from those with total
# income over GBP 35,000, UK-wide, with effect from 6 April 2025 for payments made in winter
# 2025 - so the facts carry tax year 2025-26, the first year of the charge. The note attaches
# no year to its counts; that stamp is this package's reading of the measure's effective date.
#
# The impact-on-individuals paragraph gives HMRC's estimate of who the charge reaches:
# approximately 2.2 million individuals in receipt of winter payments with total income over
# the threshold; approximately 1.3 million PAYE-only individuals, recovered through their tax
# code; 900,000 in Self Assessment, recovered through their return, including around 800,000
# who also have PAYE income; and approximately 100,000 self-employed individuals. They are
# HMRC estimates of a measure's reach, not outturns: provenance model_output, assertion
# source_projection. The 1.3 million and 900,000 partition the 2.2 million; the 800,000 and the
# 100,000 are subsets of the Self Assessment group and of the whole respectively.
# The Exchequer impact table (net of the wider eligibility, per its note) is not ported.
