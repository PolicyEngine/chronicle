# HMRC UK Betting and Gaming Statistics tables (August 2025 to July 2026), published
# 30 September 2026, for chronicle#381. Generated by scripts/build_uk_excise_packages.py
# from the pinned ODS; nothing re-downloaded.
#
# Table 1a: receipts of each betting and gaming duty, their betting total and the total,
# by financial year from 1986 to 1987 through 2025 to 2026, GBP thousand. HMRC builds
# them from banking data, payments falling due the month after each accounting period
# (background and references page), so they carry the cash accounting basis. Table 2a:
# Machine Games Duty liabilities by rate band and in total, by financial year from 2013
# to 2014, GBP thousand: liabilities declared on trader returns, refreshed from April
# 2018 as late returns arrive, not receipts. Table 2a's 'Total MGD receipts' column
# repeats Table 1a's Machine Games Duty and is not emitted. '[No Data]' (a duty not in
# force) and '[Disclosive]' (suppressed for disclosure control) cells emit no fact. Row
# labels marked '[revised]' keep the marker in source_period_label. The calendar-year and
# monthly tables stay in the preserved workbook and source cells.
