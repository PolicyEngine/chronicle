    source_column_id: market_value_1_to_2499
    expected_column_header_row: 7
    expected_column_header: £1-£2,499 (thousands)
    concept: hmrc.isa_holders
    source_concept: hmrc.isa_holders
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/annual-savings-statistics-2026
    concept_evidence_notes: 'Table 9.11, individuals holding Adult ISAs as at the end of the 2023 to 2024
      tax year, by market value. The column headings say ''(thousands)'', but the cells are counts of
      individuals: only that reading matches HMRC''s commentary (13.05 million subscribers in 2023 to
      2024), so value_scale is 1. HMRC estimates Tables 9.7 to 9.12 from a sample of individuals'' ISA
      accounts matched to the Survey of Personal Incomes and calibrated to the totals in Tables 9.4 and
      9.6; income, age, sex and region come from the Survey of Personal Incomes. Innovative Finance ISA
      holders are not included. The total number of ISA holders is not reported by ISA managers; HMRC
      estimates it from average market values of ISAs for a sample of individuals combined with reported
      aggregate ISA market values (Table 9.6). All Adult ISA types.'
    unit: count
    aggregation: sum
    value_scale: 1
    expected_cell_type: number
    filters:
      isa_market_value_band: market_value_1_to_2499
    constraints:
    - variable: isa_market_value_band
      operator: ==
      value: market_value_1_to_2499
      label: ISA market value band
    - variable: isa_market_value
      operator: '>'
      value: 0
      unit: gbp
      label: ISA market value lower bound
    - variable: isa_market_value
      operator: <
      value: 2500
      unit: gbp
      label: ISA market value upper bound
