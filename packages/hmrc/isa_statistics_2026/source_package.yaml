    concept_evidence_notes: Table 9.6, market value of Adult ISA funds by type of qualifying investment,
      2021 to 2022 (£ million), as at the end of the tax year. The information in the tables comes from
      the annual returns that must be made to the HMRC by ISA managers. Adjustments have been made for
      missing and incorrect returns. The surrender value of policies Market Valuation date may be from
      5 October of the year of return. PEP refers to Personal Equity Plans. Market values of Unit Trusts
      and Open Ended Investment Companies excludes those invested in corporate bonds. Cash component also
      includes Tax Exempt Special Savings Accounts (TESSA) only ISAs. Lifetime ISAs market values are
      included in the overall total market values for Cash ISAs and Stocks and Shares ISAs. Total ISA
      and PEP Stocks & Shares Funds and Total Adult ISA and PEP Funds have been revised for tax years
      2016 to 2017, 2021 to 2022, 2022 to 2023, 2023 to 2024. Junior ISA lines are not ported.
