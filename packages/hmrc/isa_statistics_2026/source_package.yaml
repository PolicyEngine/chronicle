      available. The annual subscription limit for Lifetime ISAs is £4,000, although those with Help to
      Buy ISAs could transfer in their account balance without affecting their annual subscription limit
      up until 5 April 2018. The government provides a 25% bonus on this amount, which is not reported
      in these statistics.
    unit: count
    aggregation: sum
    value_scale: 1000
    expected_cell_type: number
