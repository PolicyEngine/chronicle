  measures:
  - measure_id: no_further_subscription
    label: ISA holders who made no further subscription in the year
    ordinal: 0
    column: G
    source_column_id: no_further_subscription
    expected_column_header_row: 7
    expected_column_header: No Further Subscription (thousands)
    concept: hmrc.isa_holders
    source_concept: hmrc.isa_holders
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/annual-savings-statistics-2026
    concept_evidence_notes: 'Table 9.9, individuals subscribing to Adult ISAs in the 2023 to 2024 tax
      year (6 April 2023 to 5 April 2024). The column headings say ''(thousands)'', but the cells are
      counts of individuals: only that reading matches HMRC''s commentary (13.05 million subscribers in
      2023 to 2024), so value_scale is 1. HMRC estimates Tables 9.7 to 9.12 from a sample of individuals''
      ISA accounts matched to the Survey of Personal Incomes and calibrated to the totals in Tables 9.4
      and 9.6; income, age, sex and region come from the Survey of Personal Incomes. Innovative Finance
      ISA holders are not included. HMRC does not say how Lifetime ISAs are classed in these tables. HMRC:
      no further subscription represents individuals holding possibly one or more ISA account (variously
      cash, stocks and shares, or a combination of both) but who did not make a further subscription during
      the 2023 to 2024 year. The total number of ISA holders is not reported by ISA managers; HMRC estimates
      it from average market values of ISAs for a sample of individuals combined with reported aggregate
      ISA market values (Table 9.6).'
    unit: count
    aggregation: sum
    value_scale: 1
    expected_cell_type: number
    filters:
      isa_type: all
      isa_subscription_band: none
    constraints:
    - variable: isa_subscription_band
      operator: ==
      value: none
      label: ISA subscription band
    - variable: isa_subscription_amount
      operator: ==
      value: 0
      unit: gbp
      label: No further subscription in the year
