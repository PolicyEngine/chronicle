# HMRC property rental income statistics 2026, published 28 August 2026: the
# Self Assessment property pages of every unincorporated landlord, tax years
# 2020-21 to 2024-25. Unlike the SPI tables, this release counts all
# unincorporated landlords whether or not they are taxpayers, and its income is
# gross rents before expenses.
#
# That distinction is the reason the package exists, and the numbers say the
# reconciliation is not one subtraction. SPI Table 3.7's 'Net income from
# property' is taxpayers' property income after the expenses that are still
# deductible: GBP 29,300 million for 2023-24. This release puts 2023-24 gross
# property income at GBP 59.00 billion and declared allowable expenses at GBP
# 31.42 billion, and 2024-25 at GBP 58.99 billion and GBP 34.75 billion.
# Subtracting gives GBP 27.6 billion and GBP 24.2 billion, both below the SPI
# figure for a smaller population, which cannot be a coverage story.
#
# Table 8 says why: residential finance costs are GBP 12.82 billion of the
# 2024-25 expense total, and since 2020-21 they are not deducted from property
# income at all but relieved as a basic-rate reduction in the tax calculation
# (SPI Table 3.7 note 2). They are in this release's expenses and not in the
# SPI's net income. Reconciling the two therefore needs the expense
# composition, the non-taxpayer difference and the individual-versus-
# partnership split - three consumer decisions, not a factor.
#
# Chronicle's part is that both sides are now published facts: gross income,
# expenses and the expense composition here, net income of taxpayers in
# hmrc-spi-income-bands-2023-24. No multiplier between them is a fact, and
# none is stored.
#
# Tables 1 to 7, 9 to 13 are five-year series with one tax year per column.
# Period is a record-set field, so each year is its own record set carrying
# that year's column.
#
# Not ported: Tables 3 and 7, the average income and average expenses per tax
# entity. Both are the quotient of two ported series (GBP 49.81 billion over
# 2.85 million individuals is the published GBP 17,500 for 2024-25), and
# Chronicle does not store a value it can derive. Table 8 is a single tax year
# (2024-25) by expense type and is ported whole, including HMRC's published
# percentage of landlords declaring each expense type. That percentage is
# emitted as HMRC publishes it, not computed: dividing the ported counts
# reproduces it only to rounding (1.15 million of 2.88 million is 39.9 against
# the published 39.8 for residential finance costs), so it is a published value
# in its own right rather than a quotient Chronicle could stand in for.
#
# HMRC counts 'tax entities' - individuals and partnerships - so the facts use
# entity tax_unit with the publisher's split carried as a tax_entity_type
# filter, and the 'Total' rows as table_record_kind: total. The regional tables
# carry three rows that are not UK geographies: Channel Islands, Isle of Man
# and an Unknown residual, given statistical_scope ids in the hmrc namespace so
# the regional series sums to the published total.
