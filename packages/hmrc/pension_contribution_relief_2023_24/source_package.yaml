# HMRC Private pension statistics, Tables 6.1 and 6.2 (tidy CSV), tax year 2023-24,
# from the 31 July 2025 edition - the newest release that publishes the 2023-24
# detail: the 30 July 2026 edition's Tables 6.1/6.2 carry 2024-25 only
# (hmrc-salary-sacrifice-relief-2024-25), and its Table 6 revises only the 2023-24
# totals by relief line (for example Class 1 primary NICs relief 6,400 to 6,500).
# HMRC replaced the attachment in July 2026 and the original asset URL now returns
# 410 Gone, so the artifact is the UK Government Web Archive's capture of that
# asset (31 July 2025), byte-identical to what GOV.UK served.
#
# Every published cell is ported, as in the 2024-25 package: Income Tax relief on
# five contribution types and Class 1 primary and secondary NICs relief on three,
# each as a total and by sector, scheme type and rate of relief, under the
# general concepts hmrc.pension_contribution_income_tax_relief and
# hmrc.pension_contribution_nics_relief. The six salary-sacrifice headline cells
# are also emitted under the per-line concepts the 2024-25 package introduced
# (hmrc.ss_income_tax_relief_total and siblings), so a consumer bound to those
# concepts finds 2023-24 too; each pair of facts shares one source cell. The three
# Class 1 secondary additional-rate cells are '[z]' and emit no fact. HMRC marks
# 2023-24 provisional in this edition. GBP million, rounded to the nearest 100
# million; period stores the opening year (2023 to 2024 -> tax_year 2023).
