label: 'HMRC private pension statistics Tables 6.1 and 6.2: Income Tax and NICs relief on pension contributions
  by contribution type, sector, scheme type and rate, tax year 2023-24'
dimension_labels:
  hmrc.ss_relief_line: Salary sacrifice relief line
  hmrc.pension_relief_breakdown: Pension relief breakdown (sector, scheme type or rate)
