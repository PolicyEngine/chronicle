# SPI 2023-24 Tables 3.3 to 3.8, the band-grain sheets of the collated
# workbook: 13 total-income bands carrying income types, total income, tax,
# deductions and reliefs, in counts (thousands, 1e3) and amounts (GBP million,
# 1e6). Means, average rates and percentage-distribution columns are derived
# from the ported pairs and are not facts here. tax_year period 2023 (opening
# year; uk-data maps to 2024). Band lower bounds are numeric ODS cells, so
# numeric row-header guards work here. uk-data's 1.9x property-income scale
# (SPI-vs-ITSA coverage) and its uprated projections are populace-side
# adjustments, not facts. Same artifact populace's national HMRC stage parses
# (hmrc_income.py); Table 3.11's region cut of the same workbook is the
# hmrc-spi-income-by-region-2023-24 package.
#
# Every sheet covers UK taxpayers only - individuals with some liability to
# tax - so the counts are taxpayers, not adults, and the lowest band can hold
# taxpayers with no Personal Allowance entitlement (Table 3.3 note 2). The
# 'All ranges' rows are ported as table_record_kind: total.
#
# A band is both of its edges. Every banded row these record sets add carries
# total_income_upper_bound beside total_income_lower_bound - the next band its
# own block lists - and the last band a block lists is open, so it carries none.
# Blocks do not all stop at GBP 1 000 000: Table 3.4's savers and basic blocks
# stop at GBP 30 000, and their bands sum to the block total, so that band is
# open there although it is GBP 30 000 to GBP 40 000 on Table 3.3. Without the
# upper edge such rows shared a key with a different universe on another table
# (the Income Tax liabilities package's bands are not these). The Table 3.6 and
# 3.7 rows that predate them keep their original keys: they carry the income
# components, which no other table restates, and Microcosm binds them.
#
# Table 3.3 bands the same taxpayers twice: the before-tax sheet by total
# income before tax, the after-tax sheet by total income after the deduction
# of tax (note 1), so an individual can fall in different bands on the two
# sheets. The two are separate record sets, each filtering and constraining on
# its own bound - total_income_lower_bound and
# total_income_after_tax_lower_bound - and grouping on its own axis, so the
# banding measure is declared on every fact and the two banded populations
# cannot be read as one series.
#
# Table 3.4 analyses tax by marginal rate payable and by the publisher's
# classification of each taxpayer's largest income source (note 2a), carried
# as a measure-level largest_income_source filter over the same taxpayer-count
# and tax-amount concepts the other sheets use. HMRC writes '[Not available]'
# where it suppresses a cell, most often a small higher-rate or savers-rate
# cell; no fact is emitted for those, and rows are grouped into subsets by
# which measures they carry, so a suppressed cell is visible as the difference
# between the subsets rather than as a zero. Seven wholly suppressed rows of
# Table 3.4 select nothing at all. The same grouping covers Table 3.5, whose
# GBP 1 000 000 band has no personal-allowances cell.
#
# Table 3.5's 'Other income' pair is the publisher's own restatement of Table
# 3.7's 'Total property, interest, dividend and other income' - the same
# values column for column - so it carries that concept with an exact relation
# and the evidence on the measure, not a second concept. Table 3.7's 'Other
# income' [Note 6] pair is a different thing: the trust, estate, foreign and
# other taxable income residual, which keeps hmrc.spi_other_income_*.
