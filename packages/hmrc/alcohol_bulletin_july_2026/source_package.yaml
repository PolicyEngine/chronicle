# HMRC Alcohol Bulletin tables (May 2026 to July 2026), published 28 August 2026, for
# chronicle#381 and PolicyEngine/microcosm#1359. Generated by
# scripts/build_uk_excise_packages.py from the pinned ODS; nothing re-downloaded.
#
# Each product sheet's financial-year table (1a-5a, opening-year periods) and
# calendar-year table (1b-5b): clearances by strength band, relief and duty point and
# in total, in litres of alcohol (since February 2024 the bulletin uses litres, not
# hectolitres); UK beer production in litres and in litres of alcohol, and UK potable
# spirits production in litres of alcohol; and Alcohol Duty receipts by product, cash
# basis (cover note [2]), GBP million. The bulletin publishes no clearance volume in
# litres of product, so no strength is derivable from clearances.
#
# Clearances cover the Alcohol Duty regime introduced in August 2023 only (each sheet's
# note), so the 2023 to 2024 and calendar 2023 clearance record sets start on
# 1 August 2023. Receipts and production cover whole years. Every clearance fact
# carries all three breakdowns (abv_band, duty_relief, duty_point), with 'all' for the
# margins the column does not split. Total Alcohol Duty receipts are taken once, from
# the Beer sheet's column P; the Other_Fermented_Products sheet's receipts columns
# repeat the Wine sheet's and the total, and are not emitted. Monthly tables (1c-5c)
# and the provisional months stay in the preserved workbook and source cells.
