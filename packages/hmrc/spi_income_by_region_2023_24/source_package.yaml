# SPI 2023-24 Table 3.11: income and tax by sex, region and country. Fourteen
# geographies - the UK, England, the nine English regions, Wales, Scotland and
# Northern Ireland - times All, Male and Female, times the publisher's bands of
# total income, 476 worksheet rows in one long block. Rows carry the geography;
# the record set's own geography is the UK row's.
#
# Same artifact as hmrc-spi-income-bands-2023-24, which holds the band-grain
# sheets (Tables 3.3 to 3.8) of the same collated workbook. Table 3.11 is the
# only sheet in it with a sub-UK cut, and it is the only SPI surface that gives
# income components by band per region: the area workbook's Tables 3.14 and
# 3.15 (hmrc-spi-income-by-area-2023-24) give counts, means and medians by
# constituency and local authority, with no band axis and no income amounts.
#
# Rows carry HMRC's own wording for each area - 'Yorkshire and the Humber',
# 'East of England' - and Chronicle's register gives every identifier one
# canonical name on export (chronicle#281), so nothing here has to guess which
# spelling a consumer wants.
#
# Worksheet note 1 records that sub-UK estimates allocate taxpayers by address
# and carry larger sampling error than the UK figures. That is a consumer's
# judgement against facts that exist, not a reason to drop them, so the rows
# are ported as published and the caveat is recorded here and on the source
# page the concept evidence links.
#
# UK and England rows carry 13 bands; every other geography carries 10, the
# publisher stopping at GBP 200 000. The 'All Ranges' rows (spelled 'All
# ranges' once, at the UK Female block) are ported as table_record_kind: total.
# HMRC writes '[Not available]' where it suppresses a cell, mostly small
# self-employment and pension cells in Northern Ireland and the North East; no
# fact is emitted for those, and rows are grouped into subsets by which
# measures they carry, so a suppressed cell is the difference between the
# subsets rather than a zero.
#
# Table 3.11's 'Total income' is the SPI's income before tax - its UK rows
# restate Table 3.5's 'Total income before tax' band for band - so it carries
# that concept with an exact relation and the evidence on the measure. Its
# single 'Pension income' column is both state and private pension, which
# Table 3.6 splits; it keeps its own concept rather than being mapped onto
# either half.
#
# Not ported from this workbook here: Tables 3.1, 3.1a, 3.2, 3.9 and 3.10
# (percentile points, medians and means by age and sex, and self-employment
# by industry and by range of self-employment income). No consumer declares
# them, and 3.10 bands on self-employment income rather than total income.
