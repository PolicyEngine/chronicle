  measures:
  - measure_id: ftbr_amount_relieved
    label: 'First Time Buyers'' Relief: amount relieved, 2023-24'
    ordinal: 0
    column: C
    source_column_id: ftbr_amount_relieved
    expected_column_header_row: 10
    expected_column_header: Amount relieved
    concept: hmrc.sdlt.ftbr_amount_relieved
    source_concept: hmrc.sdlt.ftbr_amount_relieved
    concept_relation: source_label
    concept_authority: hmrc
    concept_evidence_url: https://www.gov.uk/government/statistics/uk-stamp-tax-statistics
    concept_evidence_notes: 'HMRC Annual Stamp Tax Statistics 2024 to 2025 (corrected 11 March 2026),
      Table_9a_(2023-24), column C (''Amount relieved''): residential transactions at £40,000 or above
      claiming First Time Buyers'' Relief, by country and within England, region (sheet note). Amounts
      relieved are estimates in millions, rounded to the nearest £1 million; transactions to the nearest
      100; the average to the nearest £100. In most cases exempt transactions correspond to purchases
      below £425,000 and liable transactions to claims for properties valued between £425,000 and £625,000
      (sheet notes), the thresholds in force from 23 September 2022 to 31 March 2025 (Table 2e notes).
      The FTBR percentage (column H, text that divides published counts) is not ported.'
    unit: gbp
    aggregation: sum
    expected_cell_type: number
    value_scale: 1000000
