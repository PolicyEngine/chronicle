    gbp_500k_to_1m: GBP 500,001 to GBP 1,000,000
    gbp_1m_to_1_5m: GBP 1,000,001 to GBP 1,500,000
    gbp_1_5m_to_2m: GBP 1,500,001 to GBP 2,000,000
    gbp_2m_to_3m: GBP 2,000,001 to GBP 3,000,000
    gbp_3m_to_4m: GBP 3,000,001 to GBP 4,000,000
    gbp_4m_to_5m: GBP 4,000,001 to GBP 5,000,000
    gbp_5m_to_10m: GBP 5,000,001 to GBP 10,000,000
    over_gbp_10m: More than GBP 10,000,000
    over_gbp_2m: More than GBP 2,000,000
    corporate_bodies_flat_rate: Corporate bodies paying flat rate
  sdlt_property_type:
    residential: Residential
    non_residential: Non-residential
  sdlt_buyer_type:
    individuals: Individuals
    other_buyers: Other buyers (non-natural persons)
  sdlt_higher_rates:
    additional_dwellings: Higher rates on additional dwellings (HRAD)
