    expected_column_header: Unknown
    concept: ird_taxable_income_distribution.individuals
    source_concept: ird_taxable_income_distribution.individuals
    concept_relation: source_label
    concept_authority: ird
    concept_evidence_url: https://www.ird.govt.nz/-/media/project/ir/home/documents/about-us/tax-statistics---current/revenue-and-refunds/tax-on-taxable-income/tax-on-taxable-income/taxable-income-distribution-of-individuals-2025.xlsx
    concept_evidence_notes: 'One publisher cell, without recalculation. Amounts are published in millions
      of NZ dollars. Explanatory notes in xl/drawings/drawing1.xml: from 2016 the tables use population
      data; negative income arising from losses is recorded as nil taxable income. Published totals use
      their cached workbook values and remain separate from component cells and other tables'' totals.
      Band spelling and spacing are preserved; no interval closure, income uprating or mean is inferred.
      The visible age table has a different open-ended band from the national table. Source universe:
      Explanatory notes!A40:C49 includes qualifying children and part-year records, passive-income-only
      individuals (automatic assessments from 2019), and taxable welfare/NZ Super/earnings-related ACC
      income; it excludes nonresident-return filers, individuals with no taxable income who did not file,
      and correctly source-taxed PIE-only individuals. Drawing 1 shape 2 and Explanatory notes!A58:C62
      define taxable income as assessable income less allowable deductions and claimed losses, excluding
      exempt and PIE income. Drawing 1 shape 3 defines tax on taxable income using the personal tax scale
      with IETC and specified IR3/PTS rebates, excluding WFF, overseas taxes paid that may reduce New
      Zealand tax payable, donation tax credits and other listed rebates. This is the publisher-defined
      tax calculation, not cash collections or a comprehensive net-liability measure.'
    unit: count
    aggregation: sum
    value_scale: 1
    expected_cell_type: number
    filters:
      age_band_source_label: Unknown
    constraints:
    - variable: age_band_source_label
      operator: ==
      value: Unknown
      label: Published age band
