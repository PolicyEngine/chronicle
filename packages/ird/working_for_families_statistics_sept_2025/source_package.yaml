  measures:
  - measure_id: wff_entitlement_nzd
    label: Aggregate Working for Families entitlement by published family-income band
    ordinal: 0
    column: AP
    source_column_id: total_entitlement
    expected_column_header_row: 11
    expected_column_header: "Total entitlement \n($million)"
    concept: ird_wff_statistics.aggregate_entitlement
    source_concept: ird_wff_statistics.aggregate_entitlement
    concept_relation: source_label
    concept_authority: ird
    concept_evidence_url: https://www.ird.govt.nz/about-us/tax-statistics/working-for-families-statistics/working-for-families-statistics-datasets
    concept_evidence_notes: >-
      Publisher 2023-24 tax-year income table, All Working for Families credits column.
      Family-income labels are preserved exactly, including Unknown and All;
      numeric labels are not recoded to inferred interval boundaries.
      The total includes credit components not separately shown in this table.
      The workbook Explanatory notes define assessed family scheme income as an
      entitlement-time-weighted average. For Work and Income recipients who did
      not file a WFF return, IRD uses individual tax-return income, which
      excludes partner income.
    unit: nzd
    aggregation: sum
    value_scale: 1000000
    expected_cell_type: number
    filters: {wff_credit_component: any}
    constraints:
    - {variable: wff_credit_component, operator: '==', value: any, label: All Working for Families credits}
