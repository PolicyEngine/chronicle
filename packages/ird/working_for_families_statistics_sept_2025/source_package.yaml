# Inland Revenue's September 2025 workbook reports administrative Working for
# Families entitlements for the 2024 New Zealand income tax year. This first NZ
# package keeps the non-derived 2024 WFF/IWTC statistics in the
# workbook: recipient families and aggregate entitlement by current credit,
# supported children and family size, and the full published family-income
# distribution. The publisher's average-entitlement table is parsed but is
# outside this package's emitted count-and-total-amount scope. CTC/PTC are
# obsolete and blank in 2024. The income table's
# explicit "Rounding adjustment" row is not a population stratum; it is parsed,
# excluded from facts, and pinned in package tests. Numeric income-band labels
# are preserved as labels, not silently interpreted as interval boundaries.
schema_version: ledger.source_package.v1
package_id: ird-working-for-families-statistics-sept-2025
label: Inland Revenue Working for Families administrative statistics, tax year 2024
# Chronicle-owned labels (chronicle#261, #265). The income-band values are the
# publisher's row text at AO48, AO49 and AO51 of the income sheet; numeric bands
# label themselves. The credit names are this package's constraint labels for the
# credits the workbook's Explanatory notes abbreviate as FTC, MFTC, IWTC and BSTC.
# The dimension labels and the 'any' and 'nonzero' value labels are Chronicle's
# wording; no publisher cell names them.
dimension_labels:
  'ird_wff_statistics.family_income_band_source_label': 'Published family income band'
  'ird_wff_statistics.tax_year': 'Tax year'
  'wff_credit_component': 'Working for Families credit type'
  'wff_entitlement_status': 'Working for Families entitlement status'
dimension_value_labels:
  'family_scheme_income_band_source_label':
    '180,000+': '180,000+'
    'All': 'All'
    'Unknown**': 'Unknown**'
  'wff_credit_component':
    'any': 'Any Working for Families credit'
    'bstc': 'Best Start Tax Credit'
    'ftc': 'Family Tax Credit'
    'iwtc': 'In-work Tax Credit'
    'mftc': 'Minimum Family Tax Credit'
  'wff_entitlement_status':
    'nonzero': 'Non-zero entitlement'
artifact:
  source_name: ird
  source_table: Working for Families statistics - September 2025
  resource_package: db
  resource_directory: data/ird/working_for_families_statistics_sept_2025
  manifest: manifest.yaml
  vintage: september_2025_release
  extracted_at: '2026-08-29'
  extraction_method: xlsx used-range cell parse of the two publisher data worksheets
  parser: xlsx_used_range
  artifact_year: 2024
  sheets:
  - Working for families data
  - Working for families income
record_sets:
- record_set_id: ird_wff_statistics.ty2024.recipient_families
  provenance_class: administrative
  record_set_spec_id: ird_wff_statistics.recipient_families.v1
  source_record_id_prefix: ird_wff_statistics.ty2024.recipient_families
  sheet_name: Working for families data
  period_type: tax_year
  period: 2024
  period_coverage: &tax_year_coverage
    basis: tax
    source_period_label: '2024 Tax Year / 2023-24 Tax Year'
    start_date: '2023-04-01'
    end_date: '2024-03-31'
    notes: >-
      Inland Revenue describes these as entitlements during an income tax year.
      The workbook displays 2024 on the aggregate sheet and 2023-24 on the
      income-distribution sheet. These are administrative claims with non-zero
      entitlement, not an estimate of all eligible families or cash paid during
      the financial year.
  geography_id: NZ
  geography_level: country
  geography_name: New Zealand
  geography_vintage: current
  entity: family
  entity_role: wff_entitled_family
  domain: working_for_families
  groupby_dimension: ird_wff_statistics.tax_year
  shared_filters:
    wff_entitlement_status: nonzero
  shared_constraints:
  - variable: wff_entitlement_status
    operator: ==
    value: nonzero
    label: Non-zero Working for Families entitlement
  rows:
  - value_id: all
    label: 2024 tax year
    ordinal: 0
    row_number: 27
    expected_row_header_column: A
    expected_row_header: '2024-03-01T00:00:00'
    guard_cells:
    - column: A
      row: 3
      expected_value: Tax Year
      label: table year header
    - column: A
      row: 1
      expected_value: Working for Families Tax Credits - number of WFF claims with non-zero entitlement (000s)
      label: table title
    table_record_kind: total
  measures:
  - measure_id: ftc_recipient_families
    label: Families with non-zero Family Tax Credit entitlement
    ordinal: 0
    column: B
    source_column_id: FTC
    expected_column_header_row: 3
    expected_column_header: FTC
    concept: ird_wff_statistics.recipient_families
    source_concept: ird_wff_statistics.recipient_families
    concept_relation: source_label
    concept_authority: ird
    concept_evidence_url: https://www.ird.govt.nz/about-us/tax-statistics/working-for-families-statistics/working-for-families-statistics-datasets
    concept_evidence_notes: >-
      Workbook table "number of WFF claims with non-zero entitlement (000s)",
      FTC column, 2024 tax year. Inland Revenue calls the total families and
      explains that a family may receive more than one credit.
