# Gambling Commission, Industry Statistics, annual report, financial year April 2025 to
# March 2026 (official statistics), published 17 September 2026, for chronicle#381. The
# publication covers the gambling industry in Great Britain (sheet 0, cell B40), and every
# fact is stamped Great Britain (K03000001), the National Lottery's included.
#
# The Commission regulates the National Lottery across the United Kingdom (its 'What we
# regulate' page, https://www.gamblingcommission.gov.uk/about-us/guide/what-we-regulate,
# last updated 5 May 2026, read 23 October 2026, not archived), but this publication
# describes its figures as Great Britain's, and the workbook prints the lottery as one
# total, with no country split. It does not say whether the lottery figures include
# Northern Ireland. The lottery's lines (sheet 1 column M, sheet 11) keep the
# publication's Great Britain and say all this in their notes.
#
# Generated by scripts/build_uk_excise_packages.py from the pinned workbook; nothing
# re-downloaded.
#
# Financial-year rows ('Apr YYYY - Mar YYYY', GBP million): gross gambling yield (stakes
# less prizes) by sector (sheet 1), by non-remote betting, bingo and casino activity
# (sheets 6 to 8), by remote casino game (10a), and by remote betting type and event
# (10b); turnover for the same splits and for remote gambling by sector (sheet 10);
# gaming machine GGY by venue and by machine category, before and after the category B
# changes of 1 July 2024 (sheet 4); and sales and their distribution for lotteries
# (sheet 9) and the National Lottery (sheet 11). Every fact carries each dimension of its
# family, with 'all' at the margins. Sheet 1's remote lines follow the remote licensing
# regime before November 2014 until 2013-14 (they equal sheet 12) and span both regimes
# in 2014-15; those years' notes say so.
#
# Left out: totals that restate a line already emitted (sheets 6 to 8's GGY totals
# restate sheet 1's sector lines, differing by at most GBP 0.01m, in 2011-12, 2022-23 and
# 2024-25; sheet 10's sector GGY and the remote sheets' totals restate sheets 1 and 10
# exactly; sheet 4's by-category 'Totals', column I, restates column B, differing by at
# most GBP 0.012m, in 2010-11 to 2013-14); published zeros that stand for no
# measurement (a turnover column zero in every year: bingo machines, peer-to-peer
# poker, betting exchanges; a year's zero whose quarters are all '-'; zero sales by
# channel against a positive total); percentage changes, machine and account counts,
# funds held in customer accounts, the External Lottery Manager columns; quarterly rows
# and the November 2014 to March 2015 part year; sheets 5, 6a to 6d, 7a, 7b, 8a and 8b
# (finer splits chronicle#381 does not ask for), sheet 10c (it restates sheets 1 and 10)
# and sheet 12 (remote gambling before November 2014); and '-' cells. The Commission
# marks the latest twelve months provisional ('P') and revisions 'R' (sheet 0, row 53):
# the marker stays in source_period_label.
