# Registers of Scotland, Property Market Report 2025-26 data tables (last updated 9 June
# 2026,
# https://www.ros.gov.uk/data-and-statistics/property-market-statistics/property-market-report),
# tables 9 and 10, for PolicyEngine/chronicle#420 item 13
# (PolicyEngine/uk-scottish-budget-2027-28#5; PolicyEngine/microcosm#1112), asked in
# PolicyEngine/chronicle#435. Written by scripts/build_uk_ros_high_value_sales_package.py
# from the pinned workbook. The RoS site answers scripted requests with HTTP 403; María
# downloaded the workbook in a browser on 10 November 2026, and the manifest keeps the
# link it recorded.
#
# Ported: the volume (table 9) and value (table 10, '£million', scaled to pounds) of
# residential property sales of more than £1 million, for Scotland and each local
# authority the tables list, in each financial year 2023-24, 2024-25 and 2025-26.
# Scotland's volumes are 403, 391 and 392. The price band is the filter house_price_band
# over_1m with the constraint sale_price > £1,000,000, on concepts
# ros.residential_property_sales and ros.residential_property_sales_value. These are
# sales, a flow over the year, not the stock of homes worth more than £1 million; 'Only
# true market residential sales are included' (Metadata sheet).
#
# The tables list 27 of the 32 council areas, with the publisher's own codes; they print
# no row for Na h-Eileanan Siar, North Lanarkshire, Orkney Islands, Shetland Islands or
# West Dunbartonshire. The 27 add to Scotland in every ported year (the generator asserts
# it), so those five had no such sales in these years. Table 9's Scotland row equals table
# 8's price band 'J - over £1,000,000' in every ported year; that J is RoS's own price
# band letter, not a council tax band.
#
# Not ported: the years before 2023-24, not asked in PolicyEngine/chronicle#420; table
# 11's top postal districts; and the rest of the report. RoS publishes no split above £2
# million, which PolicyEngine/chronicle#420 also asks for: that needs an ad hoc table from
# RoS. 168 facts.
