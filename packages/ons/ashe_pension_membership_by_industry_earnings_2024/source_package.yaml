# ONS ASHE pension table P2 (10 March 2026 release), 'Pension membership by pension type,
# earnings and SIC2007 industry', 2024 provisional, UK, sheet 'All' (all employee jobs), for
# PolicyEngine/chronicle#302 section 4: for each SIC 2007 industry section (A to S), summary
# category or sector by gross weekly earnings band (excluding overtime: less than GBP 100 up to
# over GBP 600), the number of jobs (thousands, indicative) and percentage of the row's jobs by
# pension type (defined benefit, defined contribution, group personal, group self-invested
# personal, group stakeholder, unknown, none). Sections carry their SIC 2007 letter
# (sic2007_section). The workbook's glossary defines the two summary categories as the sum of
# sections B to E (all Index of Production industries) and of sections G to U (all service
# industries, including T and U, which are not shown separately); they carry
# sic2007_summary_category, and the public and private sector rows carry sector. The zip's
# estimates workbook is parsed; the CV workbook beside it is not ported. Cells ONS suppresses
# ([u] coefficient of variation over 20 per cent or a lone case, [c] disclosure risk) or marks
# [w] (zero) emit no fact. The all-employees rows restate P1's all-ages rows cell for cell
# (ons-ashe-pension-membership-by-age-earnings-2024) and are not ported twice. The sex and
# working-pattern sheets are not ported. ASHE counts jobs, not people.
