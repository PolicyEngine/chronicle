# ONS Annual Survey of Hours and Earnings (ASHE) Table 6, age group, Table 6.1a 'Weekly
# pay - Gross (£)', United Kingdom, 2026 provisional (released 22 October 2026), for
# PolicyEngine/chronicle#420 item 4b (PolicyEngine/uk-young-people-work-review#6). Written
# by scripts/build_uk_young_people_packages.py from the member 'PROV - Age Group Table
# 6.1a Weekly pay - Gross 2026.xlsx' of the pinned zip.
#
# Every sheet but the notes is ported: all employee jobs, male, female, full-time,
# part-time, and the four sex by working-pattern sheets. Each sheet's 'All employees' row
# is its record sets' total; its seven age groups, 16-17, 18-21, 22-29, 30-39, 40-49,
# 50-59 and 60+, carry age_band with age bounds (groupby age_band). The 16-17 row sits in
# record sets of its own ('age_16_to_17'), whose notes carry footnote b: 'Figures for 16
# to 17 year olds include employees not on adult rates of pay', where every other row
# covers employees on adult rates (footnote a). The number of jobs (thousand; 'for
# indicative purposes only and should not be considered an accurate estimate of employee
# job counts', footnote c), the median, the mean and the 10th to 90th percentiles of
# weekly pay, with statistic estimate; the annual percentage changes are not ported. ONS
# colours each estimate by its coefficient of variation; Chronicle reads no colours, and
# Table 6.1b (ons-ashe-table6-weekly-pay-gross-cv-2026-provisional) carries the CVs.
#
# A cell ONS suppresses ('x': 'Estimates with a CV greater than 20% are suppressed from
# publication on quality grounds') emits no fact. A row with such a cell sits in a record
# set whose measures leave that column out ('without_p90' and the like), so the row's
# other cells are ported. The 'Not Classified' row prints ':' ('not applicable') and emits
# no fact. 12 marked cells are not ported; 924 facts.
#
# ASHE counts employee jobs, not people: it 'is based on a 1% sample of jobs taken from HM
# Revenue and Customs' Pay As You Earn (PAYE) records', so 'individuals with more than one
# job may appear in the sample more than once', and it 'does not cover the self-employed,
# nor does it cover employees not paid during the reference period' (Notes sheet).
#
# ASHE 2026 provisional estimates 'relate to the pay period that includes 22 April 2026'
# (Employee earnings in the UK: 2026); employees on adult rates whose pay for the survey
# pay-period was not affected by absence (table footnote a).
#
# Parity: the full-time all-employees median (sheet 'Full-Time', row 6) is the figure
# Employee earnings in the UK: 2026
# (https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/bulletins/annualsurveyofhoursandearnings/2026)
# prints, £811.20 in April 2026, to the bulletin's rounding, and every sheet's 'All
# employees' row is ASHE Table 2's (chronicle#407's
# ons-ashe-table2-weekly-pay-gross-2026-provisional), so the two tables' total facts share
# a semantic key; the age groups' jobs add to the all-employees jobs within the thousands'
# rounding. tests/test_source_uk_young_people_facts.py checks all three.
