# ONS ASHE pension table P8 (10 March 2026 release), 'Employee pension contribution bands by
# pension type and size of business', 2024 provisional, UK, sheet 'All', on the qualifying
# earnings basis, for PolicyEngine/chronicle#302 section 4: for each size of business (1 to 12
# employees up to 1000 or more) by pension type, the number of jobs (thousands, indicative) and
# percentage of the row's jobs by employee contribution rate band (0, under 2 per cent,
# one-point bands to 7 per cent and over). ONS's method as for P5
# (ons-ashe-employee-contribution-bands-by-age-2024-full-pay). Suppressed ([u], [c]) and [w]
# cells emit no fact. The all-employees rows restate P5's all-ages rows cell for cell
# (ons-ashe-employee-contribution-bands-by-age-2024-qualifying-earnings) and are not ported
# twice. The zip also holds the full pay basis
# (ons-ashe-employee-contribution-bands-by-business-size-2024-full-pay) and CV workbooks.
