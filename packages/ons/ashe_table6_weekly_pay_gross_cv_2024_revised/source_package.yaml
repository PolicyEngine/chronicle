# ONS Annual Survey of Hours and Earnings (ASHE) Table 6, age group, Table 6.1b
# 'coefficients of variation for Weekly pay - Gross (£)', United Kingdom, 2024 revised
# (released 23 October 2025), for PolicyEngine/chronicle#420 item 4b
# (PolicyEngine/uk-young-people-work-review#6). Written by
# scripts/build_uk_young_people_packages.py from the member 'Age Group Table 6.1b Weekly
# pay - Gross 2024 CV.xlsx' of the pinned zip.
#
# Every sheet but the notes is ported: all employee jobs, male, female, full-time,
# part-time, and the four sex by working-pattern sheets. Each sheet's 'All employees' row
# is its record sets' total; its seven age groups, 16-17, 18-21, 22-29, 30-39, 40-49,
# 50-59 and 60+, carry age_band with age bounds (groupby age_band). The 16-17 row sits in
# record sets of its own ('age_16_to_17'), whose notes carry footnote b: 'Figures for 16
# to 17 year olds include employees not on adult rates of pay', where every other row
# covers employees on adult rates (footnote a). The coefficient of variation (CV) ONS
# publishes for each estimate in Table 6.1a
# (ons-ashe-table6-weekly-pay-gross-2024-revised): 'The CV is the ratio of the standard
# error of an estimate to the estimate itself and is expressed as a percentage' (CV
# notes). Each fact takes its estimate's concept with the suffix
# _coefficient_of_variation, so a CV is never read as pay or jobs, and keeps the
# estimate's aggregation and dimensions, with statistic coefficient_of_variation and unit
# percent.
#
# A cell marked 'x' (CV over 20 per cent; the estimate is suppressed) or '.'
# ('unavailable' in the CV key) emits no fact. A row with such a cell sits in a record set
# whose measures leave that column out ('without_p90' and the like), so the row's other
# cells are ported. The 'Not Classified' row prints ':' ('not applicable') and emits no
# fact. 6 marked cells are not ported; 930 facts.
#
# ASHE counts employee jobs, not people: it 'is based on a 1% sample of jobs taken from HM
# Revenue and Customs' Pay As You Earn (PAYE) records', so 'individuals with more than one
# job may appear in the sample more than once', and it 'does not cover the self-employed,
# nor does it cover employees not paid during the reference period' (Notes sheet).
#
# ASHE 2024 revised estimates 'relate to the pay period that includes 17 April 2024'
# (Employee earnings in the UK: 2025); employees on adult rates whose pay for the survey
# pay-period was not affected by absence (table footnote a).
