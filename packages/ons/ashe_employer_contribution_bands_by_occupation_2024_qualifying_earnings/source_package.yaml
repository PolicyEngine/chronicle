# ONS ASHE pension table P11 (10 March 2026 release), 'Employer pension contribution bands by
# pension type and SOC2020 occupation', 2024 provisional, UK, sheet 'All', on the qualifying
# earnings basis, for PolicyEngine/chronicle#302 section 4: for each SOC 2020 major group (1 to
# 9) by pension type, the number of jobs (thousands, indicative) and percentage of the row's
# jobs by employer contribution rate band (0, under 4 per cent, up to 20 per cent and over).
# Major groups carry their SOC 2020 code (soc2020_major_group). ONS's method as for P5
# (ons-ashe-employee-contribution-bands-by-age-2024-full-pay). Suppressed ([u], [c]) and [w]
# cells emit no fact; the 0 per cent band is suppressed or [w] in every row, so it carries no
# fact. The all-employees rows restate P9's all-ages rows cell for cell
# (ons-ashe-employer-contribution-bands-by-age-2024-qualifying-earnings) and are not ported
# twice. The zip also holds the full pay basis
# (ons-ashe-employer-contribution-bands-by-occupation-2024-full-pay) and CV workbooks.
schema_version: ledger.source_package.v1
package_id: ons-ashe-employer-contribution-bands-by-occupation-2024-qualifying-earnings
label: 'ONS ASHE table P11: employer pension contribution rate bands (qualifying earnings basis) by pension
  type and SOC2020 occupation, UK, 2024 provisional'
dimension_labels:
  pension_type: Pension type
  contribution_basis: Contribution rate basis
  employer_contribution_rate_band: Employer contribution rate band
  soc2020_major_group: SOC 2020 major group
  ons.ashe_occupation_pension_type: Occupation by pension type
dimension_value_labels:
  soc2020_major_group:
    '1': Managers, directors and senior officials
    '2': Professional occupations
    '3': Associate professional and technical occupations
    '4': Administrative and secretarial occupations
    '5': Skilled trades occupations
    '6': Caring, leisure and other service occupations
    '7': Sales and customer service occupations
    '8': Process, plant and machine operatives
    '9': Elementary occupations
  pension_type:
    all: All employee jobs
    defined_benefit: Defined benefit
    defined_contribution: Defined contribution
    group_personal_pension: Group personal pension
    group_stakeholder_pension: Group stakeholder pension
    group_self_invested_personal_pension: Group self-invested personal pension
  employer_contribution_rate_band:
    Under 4%: Under 4%
    4% to < 8%: 4% to < 8%
    8% to < 10%: 8% to < 10%
    10% to < 12%: 10% to < 12%
    12% to < 15%: 12% to < 15%
    15% to < 20%: 15% to < 20%
    20% and over: 20% and over
  contribution_basis:
    qualifying_earnings: Percentage of qualifying earnings
