# ONS ASHE pension table P12 (10 March 2026 release), 'Employer pension contribution bands by
# pension type and size of business', 2024 provisional, UK, sheet 'All', on the full pay basis,
# for PolicyEngine/chronicle#302 section 4: for each size of business (1 to 12 employees up to
# 1000 or more) by pension type, the number of jobs (thousands, indicative) and percentage of
# the row's jobs by employer contribution rate band (0, under 4 per cent, up to 20 per cent and
# over). ONS's method as for P5 (ons-ashe-employee-contribution-bands-by-age-2024-full-pay).
# Suppressed ([u], [c]) and [w] cells emit no fact; the 0 per cent band is suppressed or [w] in
# every row, so it carries no fact. The all-employees rows restate P9's all-ages rows cell for
# cell (ons-ashe-employer-contribution-bands-by-age-2024-full-pay) and are not ported twice. The
# zip also holds the qualifying earnings basis
# (ons-ashe-employer-contribution-bands-by-business-size-2024-qualifying-earnings) and CV
# workbooks.
