# ONS ASHE pension table P10 (10 March 2026 release), 'Employer pension contribution bands by
# pension type and SIC2007 industry', 2024 provisional, UK, sheet 'All', on the full pay basis,
# for PolicyEngine/chronicle#302 section 4: for each SIC 2007 industry section (A to S), summary
# category or sector by pension type, the number of jobs (thousands, indicative) and percentage
# of the row's jobs by employer contribution rate band (0, under 4 per cent, up to 20 per cent
# and over). Sections carry their SIC 2007 letter (sic2007_section). The workbook's glossary
# defines the two summary categories as the sum of sections B to E (all Index of Production
# industries) and of sections G to U (all service industries, including T and U, which are not
# shown separately); they carry sic2007_summary_category, and the public and private sector rows
# carry sector. ONS's method as for P5
# (ons-ashe-employee-contribution-bands-by-age-2024-full-pay). Suppressed ([u], [c]) and [w]
# cells emit no fact; the 0 per cent band is suppressed or [w] in every row, so it carries no
# fact. The all-employees rows restate P9's all-ages rows cell for cell
# (ons-ashe-employer-contribution-bands-by-age-2024-full-pay) and are not ported twice. The zip
# also holds the qualifying earnings basis
# (ons-ashe-employer-contribution-bands-by-industry-2024-qualifying-earnings) and CV workbooks.
