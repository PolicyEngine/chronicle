# ONS ASHE pension table P7 (10 March 2026 release), 'Employee pension contribution bands by
# pension type and SOC2020 occupation', 2024 provisional, UK, sheet 'All', on the full pay
# basis, for PolicyEngine/chronicle#302 section 4: for each SOC 2020 major group (1 to 9) by
# pension type, the number of jobs (thousands, indicative) and percentage of the row's jobs by
# employee contribution rate band (0, under 2 per cent, one-point bands to 7 per cent and over).
# Major groups carry their SOC 2020 code (soc2020_major_group). ONS's method as for P5
# (ons-ashe-employee-contribution-bands-by-age-2024-full-pay). Suppressed ([u], [c]) and [w]
# cells emit no fact. The all-employees rows restate P5's all-ages rows cell for cell
# (ons-ashe-employee-contribution-bands-by-age-2024-full-pay) and are not ported twice. The zip
# also holds the qualifying earnings basis
# (ons-ashe-employee-contribution-bands-by-occupation-2024-qualifying-earnings) and CV
# workbooks.
schema_version: ledger.source_package.v1
package_id: ons-ashe-employee-contribution-bands-by-occupation-2024-full-pay
label: 'ONS ASHE table P7: employee pension contribution rate bands (full pay basis) by pension type and
  SOC2020 occupation, UK, 2024 provisional'
dimension_labels:
  pension_type: Pension type
  contribution_basis: Contribution rate basis
  employee_contribution_rate_band: Employee contribution rate band
  soc2020_major_group: SOC 2020 major group
  ons.ashe_occupation_pension_type: Occupation by pension type
dimension_value_labels:
  soc2020_major_group:
    '1': Managers, directors and senior officials
    '2': Professional occupations
    '3': Associate professional and technical occupations
    '4': Administrative and secretarial occupations
    '5': Skilled trades occupations
    '6': Caring, leisure and other service occupations
    '7': Sales and customer service occupations
    '8': Process, plant and machine operatives
    '9': Elementary occupations
  pension_type:
    all: All employee jobs
    defined_benefit: Defined benefit
    defined_contribution: Defined contribution
    group_personal_pension: Group personal pension
    group_stakeholder_pension: Group stakeholder pension
    group_self_invested_personal_pension: Group self-invested personal pension
  employee_contribution_rate_band:
    0%: 0%
    Under 2%: Under 2%
    2% to < 3%: 2% to < 3%
    3% to < 4%: 3% to < 4%
    4% to < 5%: 4% to < 5%
    5% to < 6%: 5% to < 6%
    6% to < 7%: 6% to < 7%
    7% and over: 7% and over
  contribution_basis:
    full_pay: Percentage of full pay
