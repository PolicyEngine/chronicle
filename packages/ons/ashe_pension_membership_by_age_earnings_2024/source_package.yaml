# ONS ASHE pension table P1 (10 March 2026 release), 'Pension membership by pension type,
# earnings and age', 2024 provisional, UK, sheet 'All' (all employee jobs), for
# PolicyEngine/chronicle#302 section 4: for each age group (16 to 21 up to 65 and over) and
# gross weekly earnings band (excluding overtime: less than GBP 100 up to over GBP 600), the
# number of jobs (thousands, indicative) and percentage of the row's jobs by pension type
# (defined benefit, defined contribution, group personal, group self-invested personal, group
# stakeholder, unknown, none). The zip's estimates workbook is parsed; the CV workbook beside it
# is not ported. Cells ONS suppresses ([u] coefficient of variation over 20 per cent or a lone
# case, [c] disclosure risk) or marks [w] (zero) emit no fact. The all-ages, all-earnings row
# restates the summary workbook's Table 1 for 2024 (ons-employee-workplace-pensions-summary-2024)
# to one more decimal place and is not ported twice. The sex and working-pattern
# sheets are not ported. ASHE counts jobs, not people.
