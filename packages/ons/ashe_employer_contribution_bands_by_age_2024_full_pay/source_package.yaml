# ONS ASHE pension table P9 (10 March 2026 release), 'Employer pension contribution bands
# by pension type and age', 2024 provisional, UK, sheet 'All', on the full pay basis, for
# PolicyEngine/chronicle#302 section 4, which asks for the employer contribution rate bands
# that replace Microcosm's three-times-employee heuristic: for each age group and pension type,
# the number of jobs (thousands, indicative) and percentage of the row's jobs by employer
# contribution rate band (0, under 4 per cent, up to 20 per cent and over). ONS's method as for
# P5. Suppressed ([u], [c]) and [w] cells emit no fact; the 0 per cent band is suppressed or [w]
# in every row, so it carries no fact. The zip also holds the qualifying earnings
# basis (ons-ashe-employer-contribution-bands-by-age-2024-qualifying-earnings) and CV workbooks.
