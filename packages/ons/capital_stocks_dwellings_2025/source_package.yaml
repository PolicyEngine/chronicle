# ONS, Capital stocks and fixed capital consumption (released 27 November 2025): the gross
# and net capital stock of dwellings at current prices, GBP billion (value_scale 1e9),
# 1995-2024, for the whole economy and each sector the tables print, from Tables 1.1.1
# (gross) and 2.1.1 (net). The tables print dwellings excluding land. The sectors are
# non-financial corporations (MIM8 gross, MKV5 net), financial corporations (J5LD, J5LF),
# central government (MJS8, MJS9), general government (MQ2L, MQ2T), households (MJY2,
# MJY3), NPISH (J5LL, J5LN), households and NPISH (MK2R, MK2S) and the total (MJF7, MJF8).
# The tables print no row for local government's dwellings, and general government equals
# central government in every year.
#
# The workbook states no estimation method, service lives or depreciation profile. Its
# notes say only that differences between totals and the sum of their parts are due to
# rounding (the tables print whole billions), that chained volume measures are referenced
# to 2023, and that 'z' marks data not collected. Note 1 on the sector rows says the
# release gives no asset breakdown of non-financial corporations into public and private
# corporations. ONS's bulletin of 27 November 2025 defines the gross stock as the value of
# all fixed assets still in use at a point in time, and the net stock as the gross stock
# less the consumption of fixed capital accrued up to that point. The stocks are modelled
# estimates (model_output).
#
# Written by scripts/build_uk_438_packages.py for PolicyEngine/chronicle#438 item 2.
