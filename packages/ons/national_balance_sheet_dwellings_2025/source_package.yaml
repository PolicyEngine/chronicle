# ONS, The UK national balance sheet estimates, 2025 edition (released 18 December 2025):
# dwellings (AN.111) at current prices, GBP million (value_scale 1e6), at the end of each
# year from 1995 to 2024, for the twelve institutional sectors the reference tables print,
# each from its own table: the whole economy (Table 2, E46Y); non-financial corporations
# (Table 3, E46D), public (Table 4, E46E) and private (Table 5, E46F); financial
# corporations (Table 6, E46G); general government (Table 7, E46I), central (Table 8,
# E46K) and local (Table 9, E46L); households and NPISH (Table 10, E46M), households
# (Table 11, E46V) and NPISH (Table 12, E46W); and the public sector (Table 13, E46X).
#
# The workbook is the one ons-national-balance-sheet-land-2025 pins, and this package
# reads each table's Dwellings column (B) for the years that package reads Land. Every
# table's notes say that its produced assets exclude the value of the land underneath
# them, and Table 2's note 1 traces the asset breakdown to ONS's capital stocks dataset,
# so the rows are modelled estimates (model_output), as the land rows are. Financial
# corporations (E46G) and local government (E46L) print 0 in every year, and the zeros are
# kept as printed.
#
# The sectors overlap as ONS's sector tree does (E46D = E46E + E46F, E46I = E46K + E46L,
# E46M = E46V + E46W, E46X = E46I + E46E, E46Y = E46D + E46G + E46I + E46M), so no total
# is derived. Written by scripts/build_uk_438_packages.py for PolicyEngine/chronicle#438
# item 1.
