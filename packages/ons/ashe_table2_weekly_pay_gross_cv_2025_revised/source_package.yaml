# ONS Annual Survey of Hours and Earnings (ASHE) Table 2, occupation by two-digit SOC
# 2020, Table 2.1b 'coefficients of variation for Weekly pay - Gross (£)', United Kingdom,
# 2025 revised (released 22 October 2026), for PolicyEngine/chronicle#407
# (PolicyEngine/microcosm#1490). Written by scripts/build_uk_occupation_packages.py from
# the member 'Occupation SOC20 (2) Table 2.1b Weekly pay - Gross 2025 CV.xlsx' of the
# pinned zip.
#
# Every sheet but the notes is ported: all employee jobs, male, female, full-time,
# part-time, and the four sex by working-pattern sheets. Each sheet's 'All employees' row
# is its record sets' total, and its rows for the nine SOC 2020 major groups and 26
# sub-major groups carry soc2020_major_group or soc2020_sub_major_group (groupby
# soc2020_group). The coefficient of variation (CV) ONS publishes for each estimate in
# Table 2.1a (ons-ashe-table2-weekly-pay-gross-2025-revised): 'The CV is the ratio of the
# standard error of an estimate to the estimate itself and is expressed as a percentage'
# (CV notes). Each fact repeats its estimate's concept, aggregation and dimensions, with
# statistic coefficient_of_variation and unit percent. ONS colours the estimates by these
# CVs (5 per cent or less 'precise', over 5 to 10 'reasonably precise', over 10 to 20
# 'acceptable') and suppresses those over 20; Chronicle reads no colours, so these facts
# carry the bands.
#
# A cell marked 'x' (CV over 20 per cent; the estimate is suppressed) or '.'
# ('unavailable' in the CV key) emits no fact. A row with such a cell sits in a record set
# whose measures leave that column out ('without_p90' and the like), so the row's other
# cells are ported. The 'Not Classified' row prints ':' ('not applicable') and emits no
# fact. 159 marked cells are not ported; 4053 facts.
#
# ASHE counts employee jobs, not people: it 'is based on a 1% sample of jobs taken from HM
# Revenue and Customs' Pay As You Earn (PAYE) records', so 'individuals with more than one
# job may appear in the sample more than once', and it 'does not cover the self-employed,
# nor does it cover employees not paid during the reference period' (Notes sheet).
#
# ASHE 2025 revised estimates 'relate to the pay period that includes 30 April 2025'
# (Employee earnings in the UK: 2026); employees on adult rates whose pay for the survey
# pay-period was not affected by absence (table footnote a).
