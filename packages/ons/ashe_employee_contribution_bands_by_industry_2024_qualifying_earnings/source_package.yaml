# ONS ASHE pension table P6 (10 March 2026 release), 'Employee pension contribution bands by
# pension type and SIC2007 industry', 2024 provisional, UK, sheet 'All', on the qualifying
# earnings basis, for PolicyEngine/chronicle#302 section 4: for each SIC 2007 industry section
# (A to S), summary category or sector by pension type, the number of jobs (thousands,
# indicative) and percentage of the row's jobs by employee contribution rate band (0, under 2
# per cent, one-point bands to 7 per cent and over). Sections carry their SIC 2007 letter
# (sic2007_section). The workbook's glossary defines the two summary categories as the sum of
# sections B to E (all Index of Production industries) and of sections G to U (all service
# industries, including T and U, which are not shown separately); they carry
# sic2007_summary_category, and the public and private sector rows carry sector. ONS's method as
# for P5 (ons-ashe-employee-contribution-bands-by-age-2024-full-pay). Suppressed ([u], [c]) and
# [w] cells emit no fact. The all-employees rows restate P5's all-ages rows cell for cell
# (ons-ashe-employee-contribution-bands-by-age-2024-qualifying-earnings) and are not ported
# twice. The zip also holds the full pay basis
# (ons-ashe-employee-contribution-bands-by-industry-2024-full-pay) and CV workbooks.
