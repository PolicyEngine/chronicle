    concept_evidence_url: https://api.beta.ons.gov.uk/v1/population-types/UR_HH/census-observations
    concept_evidence_notes: 'ONS Census 2021 API, population type UR_HH (All usual residents in households),
      area type rgn, dimensions resident_age_101a: each cell as published. ONS''s quality statement on
      the age variable: single-year estimates for ages 90 to 100 and over are less reliable than the 90
      and over group as a whole, because estimation and adjustment at these ages was based on the 90+
      range (Census 2021 dictionary, Age; resident_age_101a quality_statement_text in the API). Cells
      are as published after targeted record swapping and cell key perturbation, so they need not add
      to totals or match other tables (ONS, Protecting personal data in Census 2021 results).'
    unit: count
    aggregation: sum
    expected_cell_type: number
