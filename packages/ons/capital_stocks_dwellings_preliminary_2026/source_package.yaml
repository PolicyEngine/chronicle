# ONS, Preliminary capital stocks and fixed capital consumption (released 10 June 2026):
# the gross and net capital stock of dwellings at current prices, GBP billion (value_scale
# 1e9), 2025, for the whole economy, from Tables 1.1.1 (gross) and 2.1.1 (net). The tables
# print dwellings excluding land. This edition prints dwellings for the whole economy
# only: its sector tables (1.3.1, 2.3.1) cover all assets together. Every fact carries
# publication_status preliminary.
#
# The workbook states no estimation method, service lives or depreciation profile. Its
# notes say only that differences between totals and the sum of their parts are due to
# rounding (the tables print whole billions), that chained volume measures are referenced
# to 2023, and that 'z' marks data not collected. ONS's bulletin of 27 November 2025
# defines the gross stock as the value of all fixed assets still in use at a point in
# time, and the net stock as the gross stock less the consumption of fixed capital accrued
# up to that point. The stocks are modelled estimates (model_output).
#
# Written by scripts/build_uk_438_packages.py for PolicyEngine/chronicle#438 item 2.
