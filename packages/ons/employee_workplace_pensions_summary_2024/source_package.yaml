# ONS 'Employee workplace pensions in the UK: 2024 provisional and 2021 to 2023 final
# results' (10 March 2026), summary workbook, Tables 1 to 4, for PolicyEngine/chronicle#302
# section 4. ONS publishes this release from ASHE with DWP's method; it is the only release
# since April 2022, so it is the newest for every year, and the window from 2023 is ported: 2023
# (final) and 2024 (provisional). The 2021 to 2023 final estimates appear only in this workbook -
# the P1 to P12 tables carry 2024 provisional only.
#
# Ported: Table 1 (employee jobs by pension type, all jobs: percentage and number, thousands),
# Table 2's percentages (jobs with a workplace pension by type; its job counts restate Table
# 1's), Table 3 (membership by sector and sex: percentage of all jobs and number of jobs with a
# pension) and Table 4 (median employer contribution rate as a percentage of qualifying
# earnings, and the jobs it covers, by sector and sex). The unweighted sample counts are not
# ported. ASHE counts employee jobs, not people (someone with two jobs counts twice), on adult
# rates with pay unaffected by absence, UK-wide; ONS calls the job counts indicative.
schema_version: ledger.source_package.v1
package_id: ons-employee-workplace-pensions-summary-2024
label: 'ONS employee workplace pensions: membership by pension type, sector and sex, and median employer
  contribution rates, UK, 2023 (final) and 2024 (provisional)'
dimension_labels:
  pension_type: Pension type
