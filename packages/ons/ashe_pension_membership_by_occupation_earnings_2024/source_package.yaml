# ONS ASHE pension table P3 (10 March 2026 release), 'Pension membership by pension type,
# earnings and SOC2020 occupation', 2024 provisional, UK, sheet 'All' (all employee jobs), for
# PolicyEngine/chronicle#302 section 4: for each SOC 2020 major group (1 to 9) by gross weekly
# earnings band (excluding overtime: less than GBP 100 up to over GBP 600), the number of jobs
# (thousands, indicative) and percentage of the row's jobs by pension type (defined benefit,
# defined contribution, group personal, group self-invested personal, group stakeholder,
# unknown, none). Major groups carry their SOC 2020 code (soc2020_major_group). The zip's
# estimates workbook is parsed; the CV workbook beside it is not ported. Cells ONS suppresses
# ([u] coefficient of variation over 20 per cent or a lone case, [c] disclosure risk) or marks
# [w] (zero) emit no fact. The all-employees rows restate P1's all-ages rows cell for cell
# (ons-ashe-pension-membership-by-age-earnings-2024) and are not ported twice. The sex and
# working-pattern sheets are not ported. ASHE counts jobs, not people.
