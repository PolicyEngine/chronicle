# ONS Family Spending workbook 1: detailed expenditure and trends, the financial year
# ending 2025 edition (released 11 June 2026, next release to be announced), from the
# Living Costs and Food Survey, for PolicyEngine/chronicle#446. Microcosm reads these as
# the official reference of the LCFS stage's frame-against-donor decile receipt
# (PolicyEngine/microcosm#1717).
#
# Ported: mean weekly household expenditure by commodity group (COICOP divisions 1 to 12,
# their total, other expenditure items and total expenditure), with each decile's weighted
# households and households in the sample, by equivalised disposable income decile group
# in both versions Table 3.1E prints side by side (the updated OECD-modified scale with a
# 2-adult reference household, ONS's method from FYE 2025, and the OECD-modified scale
# with a 1-adult reference household used before), and by gross income decile group (Table
# A6). The all-household column is identical in the three blocks and is read once, from
# Table 3.1E's updated-scale block, without decile filters.
#
# Suppressed cells ('..', fewer than 10 reporting households) carry no fact: Education in
# every decile of every block, and Health in every gross income decile. The source cells
# keep the marker. No selected cell carries another marker.
#
# Not ported: the detailed items below each division, the income boundaries, means and
# medians of the groups, the per-person totals, Table 3.1 (unequivalised disposable income
# deciles), the percentage tables (3.2, 3.2E), the quintile tables (3.1E5, 3.2E5) and the
# other tables, none of which the issue asks for. Workbook 2, the file the issue names,
# has no equivalised decile table for all households (only Tables A4 and A7, by gross and
# unequivalised disposable income).
#
# Written by scripts/build_uk_446_packages.py.
