      group''. Households are ranked by their equivalised disposable income. Table 3.1E''s note 1: from
      FYE 2025 onwards ONS equivalises with the modified OECD scale based on a two-person reference household,
      replacing the previous single-person reference household, and for FYE 2025 it publishes tables using
      both methods side by side. This block uses the OECD-modified scale with a 1-adult reference household,
      the method used before FYE 2025. Average weekly household expenditure (£), FYE 2025 prices as published.
