      groups''), ''13 Other expenditure items'' and total expenditure (1-12 plus 13). Housing (net) excludes
      mortgage interest payments, council tax and Northern Ireland rates (mortgage interest is in category
      13), and total expenditure includes net rather than gross rent (the table''s notes). ONS Family
      Spending workbook 1 (detailed expenditure and trends), financial year ending 2025 edition, released
      11 June 2026, from the Living Costs and Food Survey of UK private households. Background notes:
      figures are means over all households in the group, not only those reporting the expenditure; ONS
      suppresses (''..'') figures based on fewer than 10 reporting households, and such cells carry no
      fact; individual figures are rounded independently, so components need not add to the totals shown.'
