    concept_evidence_url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/expenditure/datasets/familyspendingworkbook1detailedexpenditureandtrends
    concept_evidence_notes: 'Table 3.1E (OECD-modified scale, 1-adult reference), column ''Highest ten
      per cent''. Households are ranked by their equivalised disposable income. Table 3.1E''s note 1:
      from FYE 2025 onwards ONS equivalises with the modified OECD scale based on a two-person reference
      household, replacing the previous single-person reference household, and for FYE 2025 it publishes
      tables using both methods side by side. This block uses the OECD-modified scale with a 1-adult reference
      household, the method used before FYE 2025. Average weekly household expenditure (£), FYE 2025 prices
      as published. The commodity groups are the publisher''s COICOP divisions 1 to 12, their total (''1-12
      All expenditure groups''), ''13 Other expenditure items'' and total expenditure (1-12 plus 13).
      Housing (net) excludes mortgage interest payments, council tax and Northern Ireland rates (mortgage
      interest is in category 13), and total expenditure includes net rather than gross rent (the table''s
      notes). ONS Family Spending workbook 1 (detailed expenditure and trends), financial year ending
      2025 edition, released 11 June 2026, from the Living Costs and Food Survey of UK private households.
      Background notes: figures are means over all households in the group, not only those reporting the
      expenditure; ONS suppresses (''..'') figures based on fewer than 10 reporting households, and such
      cells carry no fact; individual figures are rounded independently, so components need not add to
      the totals shown.'
    unit: gbp_per_week
    aggregation: mean
    expected_cell_type: number
