# Social Security Scotland, 'Carer Support Payment statistics and Carer's Allowance
# Supplement statistics to 30 June 2026' (published 11 August 2026,
# https://www.socialsecurity.gov.scot/publications/2026/08/carer-support-payment-statistics-and-carers-allowance-supplement-statistics-to-30-june-2026),
# the caseload tables, for PolicyEngine/chronicle#420 item 7
# (PolicyEngine/uk-scottish-budget-2027-28#6 and PolicyEngine/uk-pip-review-2026#1).
# Written by scripts/build_uk_scottish_social_security_packages.py from the pinned
# workbook. Statistics producer: Social Security Scotland, an executive agency of the
# Scottish Government, so the source id is scotgov.
#
# Ported: Table 9's total caseload and its carers in payment and with underlying
# entitlement ('Underlying entitlement or In payment for the caseload calculation is based
# on the status of an individual as on the last day of each month', note 15), each month
# from April 2024 to June 2026, for all clients, new applications and case transfers; and
# at 30 June 2026, Table 11's caseload by age group and Table 10's by council area. All as
# concept scotgov.carer_support_payment_caseload, carers, at Scotland or the council's
# code. Tables 10 and 11's totals are Table 9's June 2026 caseload, ported once. Not
# ported: the percentage columns, November 2023 to March 2024 (the pilot's first months;
# Carer Support Payment opened in three pilot areas on 20 November 2023 and reached the
# rest of Scotland in stages, note 2), and Table 10's 'Other' row, which has no council
# code.
#
# Semantics as published: 'The caseload presented in the Carer Support Payment caseload
# table is based on a true point-in-time on the last day of each month to calculate the
# caseload of that month' (note 14); 'The caseload measure counts an individual only once'
# (note 13). 'This is a derived statistic calculated based on identifying all cases who
# are in receipt of, or have been approved for, a payment in the caseload period, even if
# they have not been paid yet' (note 16). 'Figures are rounded for disclosure control and
# may not sum due to rounding' (note 1); a cell marked [c], suppressed for disclosure
# control, emits no fact (4 in the ported rows).
#
# Parity, asserted by the generator within the rounding to the nearest 5; largest gaps:
# Table 10: councils and 'Other' add to the total: at most 5; Table 11: age bands add to
# the total: at most 5; Table 9: in payment and underlying entitlement add to the
# caseload: at most 5; Table 9: in payment and underlying entitlement add to the caseload
# (skipped: a [c] cell): 2; Table 9: routes add to all clients: at most 5; Table 9: routes
# add to all clients (skipped: a [c] cell): 4. 282 facts.
schema_version: ledger.source_package.v1
