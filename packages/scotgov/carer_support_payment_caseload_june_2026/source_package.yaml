label: 'Social Security Scotland: Carer Support Payment caseload in payment and with underlying entitlement
  by type of client, April 2024 to June 2026, and by age and council area at 30 June 2026'
dimension_labels:
  scotgov.carer_support_payment_month: Carer Support Payment caseload month
  geography: Geography
  age_band: Age band
  case_route: Type of client
  carer_support_payment_status: Carer Support Payment status
dimension_value_labels:
  age_band:
    under_18: Age under 18
    18_to_24: Age 18 to 24
    25_to_29: Age 25 to 29
    30_to_34: Age 30 to 34
    35_to_39: Age 35 to 39
    40_to_44: Age 40 to 44
    45_to_49: Age 45 to 49
    50_to_54: Age 50 to 54
    55_to_59: Age 55 to 59
    60_to_64: Age 60 to 64
    65_and_over: Age 65 and over
  case_route:
    all: All clients
    new_applicant: New applicants
    case_transfer: Case transfers
  carer_support_payment_status:
    in_payment: In payment
    underlying_entitlement: Underlying entitlement
