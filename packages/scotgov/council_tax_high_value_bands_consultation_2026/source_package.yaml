# Scottish Government, 'Council Tax High-Value Property Bands (Mansion Tax): consultation'
# (published 6 July 2026, closed 24 August 2026,
# https://www.gov.scot/publications/consultation-council-tax-high-value-property-bands-mansion-tax/),
# Figures 2 and 3 on page 9 of the consultation paper, for PolicyEngine/chronicle#420 item
# 13 (PolicyEngine/uk-scottish-budget-2027-28#5; PolicyEngine/microcosm#1112), asked in
# PolicyEngine/chronicle#435. Written by
# scripts/build_uk_scottish_high_value_bands_package.py from the pinned PDF.
#
# Ported, at Scotland, as the published low and high estimates: the number of properties
# in the proposed Band I (more than £1 million and up to £2 million) and Band J (more than
# £2 million) at 1 April 2026 values, 12,680 to 16,740 and 760 to 1,070 (Figure 3); and
# the additional annual revenue, compared to the average Band H charge, at the paper's
# illustrative multipliers on 2026-27 Band D charges, £9.13m to £12.05m and £2.74m to
# £3.85m (Figure 2, '£ millions', scaled to pounds). Band is council_tax_band I or J and
# the bound is statistic low_estimate or high_estimate, filters on the two estimate
# concepts. The facts are model_output estimates: the paper calls its rates illustrative,
# and the figures' source reads 'Source: Illustrative Scottish Government estimates based
# on Records of Scotland data, CTAXBASE statistics and analysis by the Institute for
# Fiscal Studies'.
#
# Reading the labels: the charts print their data labels series by series, the low
# estimates for Band I and Band J and then the high estimates, as their legends order
# them. The generator asserts that order against the paper's own text: each band's high
# estimate exceeds its low, Band I exceeds Band J, the property ranges bracket
# 'approximately 15,000 properties in total', and the revenue ranges sum to the 'between
# £12 million and £16 million per year' the paper states.
#
# What the revenue is measured against: 'compared to the average Band H charge', Band I
# properties 'would pay around £720 more per year' and Band J properties 'around £3,600
# more per year'. Each revenue label is its property label times that increase, to the
# £0.01m the chart prints (the generator asserts it), so the figures apply the full
# increase over the average Band H charge to every estimated property.
#
# The item's other part, Registers of Scotland's residential sales over £1 million, is the
# package ros-property-market-report-2025-26. RoS publishes no split above £2 million. 8
# facts.
