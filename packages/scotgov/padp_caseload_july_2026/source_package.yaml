  to July 2026'
dimension_labels:
  scotgov.padp_month: Pension Age Disability Payment caseload month
  case_route: Type of client
dimension_value_labels:
  case_route:
    all: All clients
    new_applicant: New applicants
    case_transfer: Case transfers
artifact:
