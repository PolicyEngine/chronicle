# Social Security Scotland, 'Pension Age Disability Payment and Scottish Adult Disability
# Living Allowance statistics to 31 July 2026' (published 15 September 2026,
# https://www.socialsecurity.gov.scot/publications/2026/09/pension-age-disability-payment-and-scottish-adult-disability-living-allowance-statistics-to-31-july-2026),
# the Pension Age Disability Payment workbook's Table 13 caseload totals, for
# PolicyEngine/chronicle#420 item 7 (PolicyEngine/uk-scottish-budget-2027-28#6 and
# PolicyEngine/uk-pip-review-2026#1), which asks for the Pension Age Disability Payment
# total. Written by scripts/build_uk_scottish_social_security_packages.py from the pinned
# workbook. Statistics producer: Social Security Scotland, an executive agency of the
# Scottish Government, so the source id is scotgov.
#
# Ported: the caseload each month from October 2024, when Pension Age Disability Payment
# opened ('From 21 October 2024, Pension Age Disability Payment opened for new
# applications in the pilot areas of Argyll and Bute, Highland, Aberdeen City, Orkney
# Islands and Shetland Islands', note 2; national from 22 April 2025), to July 2026, for
# all clients, new applicants and case transfers, as concept scotgov.padp_caseload at
# Scotland. Case transfers print 0 before they began; those published zeros are ported.
# Not ported: the higher and lower award levels and percentages, and the workbook's other
# caseload tables (age, condition, council area at 31 July 2026), which #420 does not ask
# for.
#
# Semantics as published: 'Figures are rounded for disclosure control and may not sum due
# to rounding' (note 1). Note 37: 'As part of ongoing quality assurance work, we have
# identified two issues affecting caseload figures for case transfers. Some clients who
# had left the caseload, but then later received a backdated payment were still being
# counted on the caseload for the intervening months. Some clients who are missing an
# entitlement start date were not being counted on the caseload. Both issues have now been
# resolved.' The workbook's notes do not define the caseload's date basis.
#
# Parity, asserted by the generator within the rounding to the nearest 5; largest gaps:
# Table 13: routes add to all clients: at most 5. 66 facts.
schema_version: ledger.source_package.v1
