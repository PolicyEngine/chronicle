  measures:
  - measure_id: scotgov_dwelling_stock_by_tenure
    label: Dwelling stock
    ordinal: 0
    column: N
    source_column_id: Total Number of Dwellings which are from local authorities, New Towns, Scottish
      Homes
    concept: scotgov.dwelling_stock_by_tenure
    unit: count
    aggregation: sum
    expected_cell_type: number
    expected_column_header_row: 4
    expected_column_header: Total Number of Dwellings which are from local authorities, New Towns, Scottish
      Homes
    concept_evidence_notes: 31 March 2024 dwelling-stock estimate. Publisher fractions are retained. Privately
      owned vacant dwellings and second homes are separate from occupied owner-occupied and privately
      rented stocks; social rented stocks include vacant dwellings. [z] not-applicable local authority
      stock cells are excluded, not replaced with zero. NRS dwelling counts and Scottish Household Survey
      tenure proportions underpin the publisher estimates.
  period_coverage:
    start_date: '2024-03-31'
    end_date: '2024-03-31'
    basis: calendar
    source_period_label: 31 March 2024
    notes: Publisher dwelling stock estimates; stocks and occupancy definitions differ by tenure.
  shared_filters:
    dwelling_stock_tenure: local_authorities_new_towns_scottish_homes
  shared_constraints:
  - variable: dwelling_stock_tenure
    operator: ==
    value: local_authorities_new_towns_scottish_homes
    label: dwelling_stock_tenure
dimension_value_labels:
  dwelling_stock_tenure:
    all_dwellings: Total number of dwellings
    owner_occupied: Total Number of Owner-Occupied Dwellings
    rented_privately_or_with_job_business: Total number of dwellings which are Rented privately or with
      a job/business
    vacant_private_and_second_homes: Total Number of Vacant private dwellings and second homes
    housing_associations: Total Number of Dwellings which are from housing associations
    local_authorities_new_towns_scottish_homes: Total Number of Dwellings which are from local authorities,
      New Towns, Scottish Homes
