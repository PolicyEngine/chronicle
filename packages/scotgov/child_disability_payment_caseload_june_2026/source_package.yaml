# Social Security Scotland, 'Child Disability Payment statistics to 30 June 2026'
# (published 18 August 2026,
# https://www.socialsecurity.gov.scot/publications/2026/08/child-disability-payment-statistics-to-30-june-2026),
# Table 14's caseload totals, for PolicyEngine/chronicle#420 item 7
# (PolicyEngine/uk-scottish-budget-2027-28#6 and PolicyEngine/uk-pip-review-2026#1), which
# asks for the Child Disability Payment total. Written by
# scripts/build_uk_scottish_social_security_packages.py from the pinned workbook.
# Statistics producer: Social Security Scotland, an executive agency of the Scottish
# Government, so the source id is scotgov.
#
# Ported: the total number of children in receipt, each month from April 2024 to June
# 2026, for all clients, new applicants and case transfers, as concept
# scotgov.child_disability_payment_caseload at Scotland. Not ported: the table's award
# type columns and percentages, its months before April 2024, and the workbook's other
# caseload tables (care and mobility levels, age by single year and month, condition,
# council area), which #420 does not ask for.
#
# Semantics as published: 'The caseload is based on a true point-in-time on the last day
# of each month to calculate the caseload of that month' (note 3); 'The total number of
# children in receipt measure counts an individual only once and can include children
# receiving care or mobility awards only or both' (note 4). 'This is a derived statistic
# calculated based on identifying all cases who are in receipt of, or have been approved
# for, a payment in the caseload period, even if they have not been paid yet' (note 2).
# 'Figures are rounded for disclosure control and may not sum due to rounding' (note 1).
#
# Parity, asserted by the generator within the rounding to the nearest 5; largest gaps:
# Table 14: routes add to all clients: at most 5. 81 facts.
