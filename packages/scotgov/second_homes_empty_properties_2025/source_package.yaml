      Term Empty 12 Months'' (''Long Term Empty Properties: 12 months or more''), column M (''2024'').
      Empty Properties: properties which have been empty for more than 6 months and are liable for council
      tax. Of which, there are long term empty properties (empty for more than 12 months). Note 1: ''Trends
      over time for all these statistics should be interpreted with some caution, given that increases
      and decreases can be caused in part by reclassification exercises which local authorities carry
      out from time to time, or issues with management information systems, rather than being real changes
      in the numbers of properties.'' Note 2: ''From 1st April 2013 local authorities gained the discretionary
      power to remove the empty properties discount or set a council tax increase of 100% on certain properties
      which have been empty for one year or more. This, along with associated improvements in the data
      held by local authorities, has led to the reclassification of a number of properties and has had
      a significant bearing on the year-on-year changes in the figures.'' Note 10: ''In September 2024
      the guidance for empty properties data collection was strengthened to ensure that councils excluded
      properties empty less than 6 months from their data return (in CTAXBASE 8b). It was discovered that
      prior to 2024 some councils had included these in their return to the Scottish Government. Empty
      homes (properties empty for more than 6 months) will therefore be overstated in such instances;
      however, we are not able to quantify the impact of their inclusion on published statistics before
      2024. The decrease of 6% in empty homes between 2023 and 2024, is likely to be associated with a
      programme of work to clarify that empty homes should only be recorded at 6 months or over. This
      decrease was driven by the City of Edinburgh, where data from 2024 is now provided for empty homes
      6 months or over (decrease of 57%, -4,107).'' Note 11: ''Following the strengthening of guidance
      described in note 10, there was one authority (South Ayrshire) who reported they have a very small
      number of properties empty less than 6 months included in the total for empty properties.'''
