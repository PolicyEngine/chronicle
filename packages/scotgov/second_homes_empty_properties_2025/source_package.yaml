    concept_evidence_notes: 'Second homes and empty properties in September 2025, web table, sheet ''Second
      Homes Empty Properties'' (''Total Second Homes and Empty Properties''), column U (''2024''). The
      worksheet''s total of second homes and empty properties. The contents sheet describes it as ''Total
      Second Homes and Long Term Empty Properties''; in every cell it is the Second Homes table plus the
      Empty Properties (6 months +) table, which the generator asserts. Second homes: homes which are
      furnished and lived in for at least 25 days in a 12-month period but not as someone’s main residence.
      Empty Properties: properties which have been empty for more than 6 months and are liable for council
      tax. Of which, there are long term empty properties (empty for more than 12 months). Note 1: ''Trends
      over time for all these statistics should be interpreted with some caution, given that increases
      and decreases can be caused in part by reclassification exercises which local authorities carry
      out from time to time, or issues with management information systems, rather than being real changes
      in the numbers of properties.'' Note 10: ''In September 2024 the guidance for empty properties data
      collection was strengthened to ensure that councils excluded properties empty less than 6 months
      from their data return (in CTAXBASE 8b). It was discovered that prior to 2024 some councils had
      included these in their return to the Scottish Government. Empty homes (properties empty for more
      than 6 months) will therefore be overstated in such instances; however, we are not able to quantify
      the impact of their inclusion on published statistics before 2024. The decrease of 6% in empty homes
      between 2023 and 2024, is likely to be associated with a programme of work to clarify that empty
      homes should only be recorded at 6 months or over. This decrease was driven by the City of Edinburgh,
      where data from 2024 is now provided for empty homes 6 months or over (decrease of 57%, -4,107).''
      Note 11: ''Following the strengthening of guidance described in note 10, there was one authority
      (South Ayrshire) who reported they have a very small number of properties empty less than 6 months
      included in the total for empty properties.'' Note 14: ''Powers enabling Councils in Scotland to
      apply either, a 50% Council Tax discount, the standard rate, or an up to 100% council tax premium
      (double the rate) on second homes came into force in April 2024. 30 local authorities have introduced
      the premium in some form as of September 2024.'''
    unit: count
    aggregation: sum
