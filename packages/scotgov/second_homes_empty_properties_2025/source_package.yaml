- record_set_id: scotgov.second_homes_empty_properties_2025.empty_properties.y2024
  provenance_class: administrative
  assertion: observation
  record_set_spec_id: uk.local_geography.council_tax.scotland_second_homes_empty_properties.empty_properties.v1
  source_record_id_prefix: scotgov.second_homes_empty_properties_2025.empty_properties.y2024
  sheet_name: Empty Properties (6 months +)
  period_type: month
  period: 2024-09
  period_coverage:
    basis: calendar
    source_period_label: September 2024
    notes: '''Data presented for September each year'' (cover sheet): the councils'' council tax base
      (CTAXBASE) returns at September 2024, read from the Second homes and empty properties in September
      2025 edition. Note 13: ''As a result of a cyber attack on Na h-Eileanan Siar in November 2023 the
      council was still working through a large backlog of changes to accounts and properties at the time
      of the 2024 data collection. For this reason, the figures are not as up to date as they would normally
      be.'''
  geography_id: S92000003
  geography_level: country
  geography_name: Scotland
  geography_vintage: current
  entity: dwelling
  entity_role: chargeable_dwelling
  domain: council_tax_stock
  groupby_dimension: geography
  measures:
  - measure_id: empty_properties
    label: Empty properties (empty for more than 6 months, liable for council tax)
    ordinal: 0
    column: U
    source_column_id: empty_properties
    expected_column_header_row: 4
    expected_column_header: '2024'
    concept: scotgov.council_tax.empty_properties
    source_concept: scotgov.council_tax.empty_properties
    concept_relation: source_label
    concept_authority: scotgov
    concept_evidence_url: https://www.gov.scot/publications/second-homes-and-empty-properties-in-september-2025/
    concept_evidence_notes: 'Second homes and empty properties in September 2025, web table, sheet ''Empty
      Properties (6 months +)'' (''Empty Properties (6 months +)''), column U (''2024''). Empty Properties:
      properties which have been empty for more than 6 months and are liable for council tax. Of which,
      there are long term empty properties (empty for more than 12 months). Note 1: ''Trends over time
      for all these statistics should be interpreted with some caution, given that increases and decreases
      can be caused in part by reclassification exercises which local authorities carry out from time
      to time, or issues with management information systems, rather than being real changes in the numbers
      of properties.'' Note 10: ''In September 2024 the guidance for empty properties data collection
      was strengthened to ensure that councils excluded properties empty less than 6 months from their
      data return (in CTAXBASE 8b). It was discovered that prior to 2024 some councils had included these
      in their return to the Scottish Government. Empty homes (properties empty for more than 6 months)
      will therefore be overstated in such instances; however, we are not able to quantify the impact
      of their inclusion on published statistics before 2024. The decrease of 6% in empty homes between
      2023 and 2024, is likely to be associated with a programme of work to clarify that empty homes should
      only be recorded at 6 months or over. This decrease was driven by the City of Edinburgh, where data
      from 2024 is now provided for empty homes 6 months or over (decrease of 57%, -4,107).'' Note 11:
      ''Following the strengthening of guidance described in note 10, there was one authority (South Ayrshire)
      who reported they have a very small number of properties empty less than 6 months included in the
      total for empty properties.'' Note 12: ''Caution should be taken when interpreting the North Lanarkshire
      change between 2023 and 2024 as it seems likely, rather than an increase in empty homes this year,
      that their previous returns have under reported empty homes.'''
    unit: count
    aggregation: sum
    expected_cell_type: number
