  period_coverage:
    basis: calendar
    source_period_label: September 2025
    notes: '''Data presented for September each year'' (cover sheet): the councils'' council tax base
      (CTAXBASE) returns at September 2025, read from the Second homes and empty properties in September
      2025 edition.'
  geography_id: S92000003
  geography_level: country
