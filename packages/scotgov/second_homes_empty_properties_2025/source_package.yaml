# Scottish Government, 'Second homes and empty properties in September 2025' (published 16
# December 2025,
# https://www.gov.scot/publications/second-homes-and-empty-properties-in-september-2025/),
# the web table's six tables, for PolicyEngine/chronicle#435 item 1 (Microcosm's Scottish
# council tax level, PolicyEngine/microcosm#1095). Written by
# scripts/build_uk_scottish_second_homes_package.py from the pinned workbook. The
# councils' council tax base (CTAXBASE) returns give the counts; 'Data presented for
# September each year' (cover sheet), so each year is month YYYY-09, as the CTAXBASE
# chargeable dwellings packages stamp their September counts.
#
# Ported, for Scotland and its 32 council areas at September 2024 and September 2025:
# second homes; empty properties, empty for more than 6 months and liable for council tax;
# long-term empty properties, 12 months or more; the long-term empty properties where a
# discount below 10% or an increase has been applied; dwellings with an unoccupied
# exemption from council tax; and the worksheet of second homes plus empty properties.
# Each class is its own concept, scotgov.council_tax.<measure id>, with the cover sheet's
# definition and the notes on it quoted in the evidence notes. Second homes and empty
# properties are chargeable dwellings (entity role chargeable_dwelling, as MHCLG's Council
# Taxbase lines 11 to 17); unoccupied exemptions are exempt_dwelling. The September 2024
# edition's web table (published 17 December 2024, sha256 8c796fb0…) prints the same cells
# for every year to 2024: this edition revises none of them.
#
# Not ported: the years before 2024 (from 1996, 2005, 2013 or 2014), not asked in
# PolicyEngine/chronicle#435, some of which notes 3 to 9 qualify. Nothing in the edition
# splits the counts by council tax band or by premium or discount rate beyond the
# long-term empty table, and CTAXBASE's published tables give chargeable dwellings by band
# only (the scotgov-council-tax-bands packages), with no Band D equivalents by class.
#
# Geography: Scotland and the register's S12 codes. The web table spells some areas its
# own way ('Edinburgh, City of', 'Glasgow' on two sheets, '&' for 'and', 'SCOTLAND' and
# trailing spaces on some sheets); each row guard carries its sheet's exact text, and each
# area's geography name is its first sheet's spelling.
#
# Caveats, quoted in the evidence notes: trends 'should be interpreted with some caution'
# (note 1); empty homes before 2024 'will therefore be overstated' where councils included
# properties empty less than 6 months (note 10), and South Ayrshire still includes 'a very
# small number' of them (note 11); Na h-Eileanan Siar's 2024 figures 'are not as up to
# date as they would normally be' (note 13); and the second homes premium powers from
# April 2024 (note 14).
#
# Parity, asserted by the generator: in every table and year the 32 councils add to
# Scotland (12 checks) except one misprinted cell, the long-term empty properties with a
# discount below 10% or an increase at September 2025, where the Scotland row prints
# 25,073 and the councils add to 25,703, the figure the edition's empty homes page gives;
# it is ported as printed. In every area and year (66 checks) second homes plus empty
# properties is the total, long-term empty is within empty, and the discount or increase
# subset is within long-term empty. Scotland: second homes 21,606 and 20,927, empty
# properties 43,538 and 44,453, long-term empty 31,596 and 32,337 (2024 and 2025). 396
# facts.
