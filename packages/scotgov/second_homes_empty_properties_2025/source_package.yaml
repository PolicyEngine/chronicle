      (CTAXBASE) returns at September 2024, read from the Second homes and empty properties in September
      2025 edition. Note 13: ''As a result of a cyber attack on Na h-Eileanan Siar in November 2023 the
      council was still working through a large backlog of changes to accounts and properties at the time
      of the 2024 data collection. For this reason, the figures are not as up to date as they would normally
      be.'''
