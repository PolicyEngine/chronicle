    concept_evidence_notes: 'Second homes and empty properties in September 2025, web table, sheet ''Second
      Homes'' (''Second Homes''), column U (''2024''). Second homes: homes which are furnished and lived
      in for at least 25 days in a 12-month period but not as someone’s main residence. Note 1: ''Trends
      over time for all these statistics should be interpreted with some caution, given that increases
      and decreases can be caused in part by reclassification exercises which local authorities carry
      out from time to time, or issues with management information systems, rather than being real changes
      in the numbers of properties.'' Note 14: ''Powers enabling Councils in Scotland to apply either,
      a 50% Council Tax discount, the standard rate, or an up to 100% council tax premium (double the
      rate) on second homes came into force in April 2024. 30 local authorities have introduced the premium
      in some form as of September 2024.'''
