# Land & Property Services, Lone Pensioner Allowance statistics to year end 2024
# (published 29 May 2024), for PolicyEngine/chronicle#395 item 1. Written by
# scripts/build_uk_395_packages.py.
#
# Lone Pensioner Allowance is a 20% reduction in the rates of ratepayers aged 70 or over
# who live alone. LPS processes owner occupiers' applications and NIHE those of ratepayers
# who rent. Table 1.1: owner occupiers with a current award at year-end 31 March 2010 to
# 2024, nil awards included. Table 1.2: the net amount payable to owner occupiers over
# each financial year. Both are by district council, under today's council names for every
# year as the notes say, and for Northern Ireland. Table 1.5: Northern Ireland's net
# amounts for the private rented sector, NIHE and housing association tenants, and for all
# tenures.
#
# Every amount shares one concept and carries its tenure as lpa_tenure. Table 1.5's owner-
# occupier column restates Table 1.2's Northern Ireland row, Table 1.3 restates the
# Northern Ireland rows of Tables 1.1 and 1.2, and Table 1.4 restates Table 1.5's renting
# columns: none is ported again, and the build asserts each copy equal. Counts are stamped
# by the calendar year of the 31 March they are current on, and amounts by the financial
# year's opening year. No 2024-25 edition is published yet.
schema_version: ledger.source_package.v1
package_id: lps-lone-pensioner-allowance-ye-2024
label: 'LPS Lone Pensioner Allowance: owner occupiers awarded and net amounts by district council, and
  Northern Ireland''s net amounts by tenure, 2009-10 to 2023-24'
dimension_labels:
  lps.district_council: District Council
  lpa_tenure: Lone Pensioner Allowance tenure
dimension_value_labels:
  lpa_tenure:
    owner_occupier: Owner occupier
    private_rented_sector: Private Rented Sector
    nihe: NIHE
    housing_association: Housing Association
    all: All tenures
artifact:
  source_name: lps
  source_table: Lone Pensioner Allowance statistics to year end 2024, Tables 1.1, 1.2 and 1.5
  resource_package: db
  resource_directory: data/lps/lone_pensioner_allowance_ye_2024
  manifest: manifest.yaml
  vintage: lps_allowance_statistics_2024_05_29
  extracted_at: '2026-10-30'
  extraction_method: xlsx used-range cell parse of the declared tables
  parser: xlsx_used_range
  artifact_year: 2024
  sheets:
  - Table 1.1
  - 'Table 1.2 '
  - Table 1.5
