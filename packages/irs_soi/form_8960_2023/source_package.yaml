# SOI's entity-side partnership tables (23pa01/04/06/10/23) have no
# passive/nonpassive industry split, and Publication 1304 Table 1.4 reports
# entity income/loss without a passive split. Form 8960 line 4 is therefore the
# sole administrative anchor for the passive pass-through NIIT base.
