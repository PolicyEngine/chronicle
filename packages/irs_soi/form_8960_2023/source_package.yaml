  vintage: tax_year_2023_rev_6_2026
  extracted_at: "2026-08-19"
  extraction_method: >-
    manual transcription from the supervisor-verified Publication 4801
    (Rev. 6-2026) Form 8960 text extraction into a curated CSV; page 214 return
    counts and page 215 amounts in thousands of dollars kept verbatim
  parser: delimited_text_full_rows
  sheet_name: form_8960_selected_lines
  artifact_year: 2023
