label: DfT NTS0601a trips per person by age and main mode, all people, England, 2023 to 2025
dimension_labels:
  'dft.age_band': 'Age band'
dimension_value_labels:
  'sex':
    'All people': 'All people'
  'age_band':
    '0 to 16': 'Age 0 to 16'
    '17 to 20': 'Age 17 to 20'
    '21 to 29': 'Age 21 to 29'
    '30 to 39': 'Age 30 to 39'
    '40 to 49': 'Age 40 to 49'
    '50 to 59': 'Age 50 to 59'
    '60 to 69': 'Age 60 to 69'
    '70 and over': 'Age 70 and over'
    'All Ages': 'All ages'
