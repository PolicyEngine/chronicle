# DfT National Travel Survey table NTS0303a publishes weighted average trips
# per person per year for England by main mode. This package keeps the three
# latest complete calendar years and the two local-bus columns alongside the
# publisher's all-modes total. The overall rows are the table's unfiltered
# England population aggregate; no age or sex filter is asserted because the
# source table does not carry either dimension.
#
# Values come directly from the numeric ODS cells without rounding, preserving
# the precision in the publisher artifact. DfT cautions that in 2025 most travel
# diaries changed from paper to digital. The change reduced the overall average
# number of trips recorded per person, with the largest effects on short walks,
# car trips, and shopping, personal-business, and leisure trips; interview-based
# statistics are unaffected. Comparisons involving 2025 should account for this
# discontinuity in diary collection.
