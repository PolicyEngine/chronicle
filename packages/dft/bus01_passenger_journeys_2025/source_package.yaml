# DfT BUS01 publisher totals for local bus passenger journeys.
#
# Included: BUS01a passenger journeys for 13 requested English geographies and
# the three published urban-rural classes, plus BUS01c concessionary passenger
# journeys for the 13 requested geographies, across all published years.
# London appears once, as one of the nine standard regions.
# Excluded source columns: Scotland, Wales and Great Britain (BUS01a Q:S;
# BUS01c O:Q). This England package carries the publisher's England totals and
# English subgeographies; the devolved-country and Great Britain totals are
# intentionally outside its declared scope.
#
# Excluded optional sheets: BUS01b passenger journeys per head; BUS01d
# concessionary journeys as a percentage; BUS01e passenger journeys by local
# authority; BUS01f passenger journeys per head by local authority; BUS01g
# elderly/disabled journeys by local authority; and BUS01h elderly/disabled
# journeys as a percentage by local authority.
#
# No subtraction, share, per-head, or local-authority facts are derived here.
# Every selected value is guarded by its fiscal-year row, geography column,
# table and unit headings; BUS01c also guards both the Type value and heading.
schema_version: ledger.source_package.v1
package_id: dft-bus01-passenger-journeys-2025
label: DfT BUS01 local bus passenger and concessionary journeys, years ending March 2005 to 2025
dimension_labels:
  "dft.bus_area": "Local bus statistics area"
dimension_value_labels:
  "journey_category":
    elderly_disabled_concessionary: "Elderly/Disabled journeys"
    total_concessionary: "Total concessionary journeys"
