# Welsh Government, Council tax collection rates in Wales, 2024-25
# (statistical release, June 2025). Table 2 prints, for each of the 22 billing
# authorities and for Wales, the amounts outstanding in respect of 2024-25
# bills and arrears in GBP thousands: arrears brought forward, prior-year
# debits and credits, arrears collected and written off, the in-year total
# debits (the net collectable debit: the council tax for the year that
# authorities would collect if everyone liable had paid, net of the council
# tax reduction scheme), the amounts collected and written off in year, and
# the in-year collection rate. Publisher note 3: the amounts are net of all
# deductions on council tax bills, such as council tax reduction scheme.
#
# Ported: the 'Total Wales [Note 5]' row and the 22 billing authority rows
# (added for PolicyEngine/chronicle#408, in the record set at the end),
# publisher columns 1, 2, 3, 4, 6, 7 and 9. Excluded: columns 5, 8, 10, 11
# and 12, which the publisher labels as formulas over the other columns
# (5=(1+2-3-4), 8=(7/6), 10=(6-7-9), 11=(10+5), 12=(11-1)), so the in-year
# collection rate is consumer arithmetic (column 7 over column 6); and
# Table 1, which prints collection rates as percentages (the current-year
# rate is column 8's ratio, the previous-year rate is a revised restatement
# of the earlier release, and a memo 'assumed collection rate' is a budget
# assumption) and is outside this amounts-only package. Publisher note 5, on
# the Total Wales row and on Bridgend and Merthyr Tydfil: any differences
# compared to arrears carried forward are due to incorrectly stated arrears in
# the previous year.
# Values are the workbook's stored cells (the Total Wales amounts are stored
# as integers). Split-year labels store the opening year: 2024-25 is
# fiscal_year 2024.
#
# gov.wales 403s a plain fetch; the workbook was retrieved with browser
# headers and pinned byte-for-byte (sha256 in manifest.yaml).
