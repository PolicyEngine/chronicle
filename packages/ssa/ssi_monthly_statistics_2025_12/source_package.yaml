    concept_authority: ledger-us
    concept_evidence_url: https://www.ssa.gov/policy/docs/statcomps/ssi_monthly/2025-12/table01.html
    concept_evidence_notes: >-
      SSA SSI Monthly Statistics, December 2025, Table 1 (Number of
      recipients, total payments, average monthly payment, and number of
      awards, by type of payment, eligibility category, and age, December
      2025), "Total with— Federal payment" row: persons receiving a federal
      SSI payment in December 2025, by the three published age groups (under
      18 / 18-64 / 65 or older; all ages 7,264,734 = 1,015,006 + 3,820,243 +
      2,429,485). The line counts everyone whose federally administered
      December 2025 payment included a federal SSI payment, with or without
      state supplementation, and excludes the 127,467 people receiving
      federally administered state supplementation only; counts include
      retroactive payments per table footnote c. The table keeps the rows,
      columns and footnotes of the December 2024 table that
      ssa-ssi-monthly-statistics-2024-12 reads (chronicle#449).
    unit: count
    aggregation: sum
    expected_cell_type: number
    expected_column_header_row: 1
    expected_column_header: recipient_count
