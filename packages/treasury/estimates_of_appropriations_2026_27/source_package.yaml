  measures:
  - measure_id: published_expenses_nzd
    label: Published Benefits or Related Expenses (NZD)
    ordinal: 0
    column: K
    source_column_id: amount_000
    expected_column_header_row: 1
    expected_column_header: Amount $000
    concept: treasury.benefits_or_related_expenses
    source_concept: treasury.benefits_or_related_expenses
    concept_relation: source_label
    concept_authority: treasury
    concept_evidence_url: https://www.budget.govt.nz/budget/excel/data/b26-expenditure-data.xlsx
    concept_evidence_notes: "Raw Data: Vote Social Development; Appropriation or Category Type Benefits\
      \ or Related Expenses; Amount $000; Year is year ending 30 June (Explanation!B3), with publisher\
      \ Amount Type retained. Explanation!B21 says historical raw data are not restated for restructuring;\
      \ B23 applies the 2026/27 appropriation name/scope across years absent advised material change.\
      \ Current Scope is preserved as a guard on every selected row. Accommodation Assistance is not AS-only:\
      \ Vote Social Development Estimates 2026/27 printed pp243\u2013245 (PDF indices 60\u201362), Conditions\
      \ on Use lists Accommodation Supplement and Away from Home Allowance; see evidence.md for verbatim\
      \ rows. The PDF contributes no facts. No reconciliation, growth rates, averages, aging or imputation."
    unit: nzd
    aggregation: sum
    expected_cell_type: number
    value_scale: 1000
