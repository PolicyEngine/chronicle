# DESNZ publishes this QEP table at calendar-year and financial-year grains. The
# workbook does not publish quarterly bill observations, so this package does
# not create them. This issue's payment-method scope is standard metering;
# Economy 7 is a separate tariff/metering arrangement outside that scope. Each
# bill fact keeps the publisher's consumption basis, VAT treatment, payment
# method, and tariff classification. DESNZ describes the fixed-versus-variable
# classification as official statistics in development.
