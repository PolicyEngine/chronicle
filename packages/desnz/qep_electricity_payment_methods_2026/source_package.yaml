      for standard electricity'', column ''Direct Debit (%)'': the percentage of the region''s customers
      paying by direct debit. Includes electricity customers on standard electricity tariffs only. Note
      4. Direct debit transfers an agreed or variable amount directly from the customer’s bank account
      to the energy supplier. Data on gas and electricity tariffs is received directly from a sample of
      energy companies that supply electricity and gas across the UK via a quarterly survey. In order
      for the sample data to be comparable for the whole market, data is uplifted to Ofgem''s total customer
      numbers.'
