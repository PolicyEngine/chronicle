  measures:
  - measure_id: standard_credit
    label: Credit (%)
    ordinal: 0
    column: D
    source_column_id: standard_credit
    expected_column_header_row: 9
    expected_column_header: Credit (%)
    concept: desnz.qep.domestic_electricity_payment_method_share
    source_concept: desnz.qep.domestic_electricity_payment_method_share
    concept_relation: source_label
    concept_authority: desnz
    concept_evidence_url: https://www.gov.uk/government/statistical-data-sets/quarterly-domestic-energy-price-statistics
    concept_evidence_notes: 'Quarterly Energy Prices table 2.4.2, ''Regional variation of payment method
      for standard electricity'', column ''Credit (%)'': the percentage of the region''s customers paying
      by standard credit. Includes electricity customers on standard electricity tariffs only. Note 3.
      Standard credit customers pay on receipt of their bill which is usually payment 3 months in arrears.
      Data on gas and electricity tariffs is received directly from a sample of energy companies that
      supply electricity and gas across the UK via a quarterly survey. In order for the sample data to
      be comparable for the whole market, data is uplifted to Ofgem''s total customer numbers.'
    unit: percent
    aggregation: share
    expected_cell_type: number
    filters:
      payment_method: standard_credit
    constraints:
    - {variable: payment_method, operator: ==, value: standard_credit, label: Payment method}
  - measure_id: direct_debit
    label: Direct Debit (%)
    ordinal: 1
    column: E
    source_column_id: direct_debit
    expected_column_header_row: 9
    expected_column_header: Direct Debit (%)
    concept: desnz.qep.domestic_electricity_payment_method_share
    source_concept: desnz.qep.domestic_electricity_payment_method_share
    concept_relation: source_label
    concept_authority: desnz
    concept_evidence_url: https://www.gov.uk/government/statistical-data-sets/quarterly-domestic-energy-price-statistics
    concept_evidence_notes: 'Quarterly Energy Prices table 2.4.2, ''Regional variation of payment method
      for standard electricity'', column ''Direct Debit (%)'': the percentage of the region''s customers
      paying by direct debit. Includes electricity customers on standard electricity tariffs only. Note
      4. Direct debit transfers an agreed or variable amount directly from the customer’s bank account
      to the energy supplier. Data on gas and electricity tariffs is received directly from a sample of
      energy companies that supply electricity and gas across the UK via a quarterly survey. In order
      for the sample data to be comparable for the whole market, data is uplifted to Ofgem''s total customer
      numbers.'
    unit: percent
    aggregation: share
    expected_cell_type: number
    filters:
      payment_method: direct_debit
    constraints:
    - {variable: payment_method, operator: ==, value: direct_debit, label: Payment method}
  - measure_id: prepayment
    label: Prepayment (%)
    ordinal: 2
    column: F
    source_column_id: prepayment
    expected_column_header_row: 9
    expected_column_header: Prepayment (%)
    concept: desnz.qep.domestic_electricity_payment_method_share
    source_concept: desnz.qep.domestic_electricity_payment_method_share
    concept_relation: source_label
    concept_authority: desnz
    concept_evidence_url: https://www.gov.uk/government/statistical-data-sets/quarterly-domestic-energy-price-statistics
    concept_evidence_notes: 'Quarterly Energy Prices table 2.4.2, ''Regional variation of payment method
      for standard electricity'', column ''Prepayment (%)'': the percentage of the region''s customers
      paying by prepayment. Includes electricity customers on standard electricity tariffs only. Note
      5. Prepayment requires the customer to make advance payment before fuel can be used. Data on gas
      and electricity tariffs is received directly from a sample of energy companies that supply electricity
      and gas across the UK via a quarterly survey. In order for the sample data to be comparable for
      the whole market, data is uplifted to Ofgem''s total customer numbers.'
    unit: percent
    aggregation: share
    expected_cell_type: number
    filters:
      payment_method: prepayment
    constraints:
    - {variable: payment_method, operator: ==, value: prepayment, label: Payment method}
