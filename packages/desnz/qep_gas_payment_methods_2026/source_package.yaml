# DESNZ, Quarterly Energy Prices table 2.5.2, 'Regional variation of payment method for
# gas' (updated 29 September 2026, data to the quarter ending June 2026,
# https://www.gov.uk/government/statistical-data-sets/quarterly-domestic-energy-price-statistics),
# for PolicyEngine/chronicle#420 item 12: a Direct Debit, standard credit and prepayment
# draw in Microcosm (PolicyEngine/uk-energy-price-cap-jan-2027#4), asked in
# PolicyEngine/chronicle#435 for Microcosm's next data PR. Written by
# scripts/build_uk_qep_payment_method_packages.py from the pinned workbook.
#
# Ported: the percentage of domestic customers paying by standard credit, Direct Debit and
# prepayment, for the 14 former Public Electricity Supplier distribution areas, England
# and Wales, Scotland and Great Britain (the table has no Northern Ireland or United
# Kingdom row), each quarter from April to June 2024 to April to June 2026 (sheet '2.5.2')
# and each year 2024 and 2025 (sheet '2.5.2 (Annual)'). Data in these tables shows the
# regional variation (Public Electricity Supplier region, for consistency with the
# electricity tables) of payment method for domestic gas customers. Payment method is a
# filter on concept desnz.qep.domestic_gas_payment_method_share; each region's three
# shares are the publisher's rounded percentages and add to 100 within 1 point(s). The
# shares come from DESNZ's quarterly survey of a sample of suppliers, 'uplifted to Ofgem's
# total customer numbers' (methodology sheet). Regions are the desnz:qep:pes ids the unit
# cost packages use. The publisher's annual figure for Table 2.5.2 Regional variation of
# payment method for gas.
#
# Not ported: earlier quarters and years, not asked in PolicyEngine/chronicle#420; the
# fixed and online tariff sheets; and tables 2.4.1 and 2.5.1, which split customers by
# supplier type, not payment method. The next update is due 17 December 2026 (cover
# sheet). 561 facts.
