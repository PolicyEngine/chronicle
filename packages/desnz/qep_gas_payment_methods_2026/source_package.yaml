    concept: desnz.qep.domestic_gas_payment_method_share
    source_concept: desnz.qep.domestic_gas_payment_method_share
    concept_relation: source_label
    concept_authority: desnz
    concept_evidence_url: https://www.gov.uk/government/statistical-data-sets/quarterly-domestic-energy-price-statistics
    concept_evidence_notes: 'Quarterly Energy Prices table 2.5.2, ''Regional variation of payment method
      for gas'', column ''Credit (%)'': the percentage of the region''s customers paying by standard credit.
      Data in these tables shows the regional variation (Public Electricity Supplier region, for consistency
      with the electricity tables) of payment method for domestic gas customers. Note 3. Standard credit
      customers pay on receipt of their bill which is usually payment 3 months in arrears. Data on gas
      and electricity tariffs is received directly from a sample of energy companies that supply electricity
      and gas across the UK via a quarterly survey. In order for the sample data to be comparable for
      the whole market, data is uplifted to Ofgem''s total customer numbers.'
    unit: percent
    aggregation: share
    expected_cell_type: number
    filters:
      payment_method: standard_credit
