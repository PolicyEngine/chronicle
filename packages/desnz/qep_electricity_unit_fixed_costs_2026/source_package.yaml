# DESNZ publishes this QEP table at calendar-year and financial-year grains. The
# workbook does not publish quarterly unit-cost or fixed-cost observations, so
# this package does not create them. This issue's payment-method scope is
# standard metering; Economy 7 is a separate tariff/metering arrangement
# outside that scope. Unit and fixed costs are price components, so they do not
# carry a bill-consumption filter. The separate annual-bill facts preserve
# DESNZ's 3,400 kWh electricity and 11,200 kWh gas assumptions.
# Northern Ireland's 23 explicit zero fixed-cost cells are omitted under the
# all-zero observation rule; its non-zero 2023 standard-credit cell is retained.
