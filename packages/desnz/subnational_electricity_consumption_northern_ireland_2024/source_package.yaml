    concept: desnz.subnational.domestic_electricity_meter_count
    source_concept: desnz.subnational.domestic_electricity_meter_count
    concept_relation: source_label
    concept_authority: desnz
    concept_evidence_url: https://www.gov.uk/government/statistics/sub-national-electricity-consumption-statistics-in-northern-ireland
    concept_evidence_notes: 'DESNZ 2013 sheet, column C: thousands converted to count. Domestic or non-domestic
      by NIE Networks tariff (cover sheet). DESNZ: not directly comparable with Great Britain''s electricity
      statistics, because of differences in market structure and collection methodology (methodology booklet,
      July 2026, section 5.3); Northern Ireland''s years are financial years from 2012 where Great Britain''s
      run February to January, and 2015 onwards is not directly comparable with earlier years (section
      5.2). Northern Ireland files domestic standard, domestic Economy 7 and all-domestic rows under this
      concept, told apart by domestic_scope; Great Britain''s rows are all_domestic only, so a selector
      that does not pin domestic_scope pools the three.'
    unit: count
    aggregation: sum
    expected_cell_type: number
    filters:
      domestic_scope: domestic_standard
      metric: meter_count
    constraints:
    - variable: domestic_scope
      operator: ==
      value: domestic_standard
      label: Domestic scope
    - variable: metric
      operator: ==
      value: meter_count
      label: Metric
