    label: Recipients
    ordinal: 0
    column: D
    source_column_id: recipients
    concept: ed_fsa.recipient_count
    source_concept: Recipients (in millions)
    concept_relation: source_label
    concept_authority: ed_fsa
    concept_evidence_url: https://studentaid.gov/data-center/student/portfolio
    concept_evidence_notes: 'Includes outstanding principal and interest balances of Direct
      Loan borrowers in Repayment, Deferment, and Forbearance. "Recipient counts are based
      at the loan level. As a result, recipients may be counted multiple times across varying
      loan statuses." Includes the number of recipients in the specified loan status. The
      recipient is the student that benefits from the federal student loan. In most cases,
      the recipient is the borrower, but in parent PLUS loans, the parent is the borrower
      and their child is the recipient. "Repayment Plan summary includes Direct Loan or Federally
      Managed borrowers in Repayment, Deferment and Forbearance categories and excludes borrowers
      in Default, In-School, and Grace." "Data Run Date: Data is run at the end of each quarter
      listed by federal fiscal year. Each federal fiscal year begins October 1 and ends September
      30. Q1 ends 12/31, Q2 ends 3/31, Q3 ends 6/30, and Q4 ends 9/30."'
    unit: count
    aggregation: sum
    value_scale: 1000000
    expected_cell_type: number
