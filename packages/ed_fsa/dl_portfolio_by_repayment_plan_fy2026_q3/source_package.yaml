    concept_evidence_notes: 'Includes outstanding principal and interest balances of Direct
      Loan and ED-held Federal Family Education Loan (FFEL) borrowers in Repayment, Deferment,
      and Forbearance. "Recipient counts are based at the loan level. As a result, recipients
      may be counted multiple times across varying loan statuses." Includes the number of
      recipients in the specified loan status. The recipient is the student that benefits
      from the federal student loan. In most cases, the recipient is the borrower, but in
      parent PLUS loans, the parent is the borrower and their child is the recipient. "Repayment
      Plan summary includes Direct Loan or Federally Managed borrowers in Repayment, Deferment
      and Forbearance categories and excludes borrowers in Default, In-School, and Grace."
