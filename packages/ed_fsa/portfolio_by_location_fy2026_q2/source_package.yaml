  measures:
  - measure_id: dollars_outstanding
    label: Dollars outstanding
    ordinal: 0
    column: B
    source_column_id: balance
    expected_column_header_row: 6
    expected_column_header: Balance (in billions)
    concept: ed_fsa.dollars_outstanding
    source_concept: Balance (in billions)
    concept_relation: source_label
    concept_authority: ed_fsa
    concept_evidence_url: https://studentaid.gov/data-center/student/portfolio
    concept_evidence_notes: 'Includes the outstanding principal and interest balance of loans
      in the specified location category. Location summary includes Direct Loan, Federal Family
      Education Loan, and Perkins Loan borrowers in an Open loan status. Interest on School-Held
      Perkins Loans is not included in the balances. Data Run Date: Data is run at the end
      of each month listed by federal fiscal year. Each federal fiscal year begins October
      1 and ends September 30. Q1 ends 12/31, Q2 ends 3/31, Q3 ends 6/30, and Q4 ends 9/30.'
    unit: usd
    aggregation: sum
    value_scale: 1000000000
    expected_cell_type: number
  - measure_id: borrowers
    label: Borrowers
    ordinal: 1
    column: C
    source_column_id: borrowers
    expected_column_header_row: 6
    expected_column_header: Borrowers (in thousands)
    concept: ed_fsa.borrower_count
    source_concept: Borrowers (in thousands)
    concept_relation: source_label
    concept_authority: ed_fsa
    concept_evidence_url: https://studentaid.gov/data-center/student/portfolio
    concept_evidence_notes: 'Includes the number of borrowers in the specified location category.
      In most cases, the borrower is the recipient, but in parent PLUS loans, the parent is
      the borrower and their child is the recipient. Current address is not required to be
      reported to the U.S. Department of Education by commercial lenders (FFEL or Perkins).
      These loans are included within the "Not Reported" Category. The location of the borrower
      is reported by the servicer; however, it is outside of the U.S. states and territories
      listed within the report. Location summary includes Direct Loan, Federal Family Education
      Loan, and Perkins Loan borrowers in an Open loan status. Interest on School-Held Perkins
      Loans is not included in the balances. Data Run Date: Data is run at the end of each
      month listed by federal fiscal year. Each federal fiscal year begins October 1 and ends
      September 30. Q1 ends 12/31, Q2 ends 3/31, Q3 ends 6/30, and Q4 ends 9/30.'
    unit: count
    aggregation: sum
    value_scale: 1000
    expected_cell_type: number
