  measures:
  - measure_id: borrowers
    label: Borrowers
    ordinal: 0
    column: D
    source_column_id: borrowers
    concept: ed_fsa.borrower_count
    source_concept: Borrowers (in millions)
    concept_relation: source_label
    concept_authority: ed_fsa
    concept_evidence_url: https://studentaid.gov/data-center/student/portfolio
    concept_evidence_notes: 'Includes the number of borrowers in the specified debt size category.
      The borrower is the person that holds the federal student loan. In most cases, the borrower
      is the student, but in parent PLUS loans, the parent is the borrower. Debt Size summary
      includes Direct Loan, Federal Family Education Loan, and Perkins Loan borrowers in an
      Open loan status. Interest on School-Held Perkins Loans is not included in the balances.
      Data Run Date: Data is run at the end of each month listed by federal fiscal year. Each
      federal fiscal year begins October 1 and ends September 30. Q1 ends 12/31, Q2 ends 3/31,
      Q3 ends 6/30, and Q4 ends 9/30. Note: "Due to rounding and timing differences, the total
      figures may differ slightly from those in the Portfolio Summary report."'
    unit: count
    aggregation: sum
    value_scale: 1000000
    expected_cell_type: number
