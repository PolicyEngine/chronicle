schema_version: ledger.source_package.v1
package_id: jct-tax-expenditures-2025
label: JCT 2025 individual income tax expenditure estimates
dimension_labels:
  'jct.tax_expenditure': 'Tax expenditure'
artifact:
  source_name: jct
  source_table: Estimates of Federal Tax Expenditures for Fiscal Years 2025-2029
  resource_package: db
  resource_directory: data/jct/tax_expenditures_2025
  manifest: manifest.yaml
  vintage: jcx_45_25
  extracted_at: "2026-11-27"
  extraction_method: manual extraction from JCX-45-25 Table 1 individual income tax revenue-loss columns
  parser: delimited_text_full_rows
  sheet_name: jct_tax_expenditures_2025
record_sets:
  - record_set_id: jct.tax_expenditures.fy2025
    # A JCT tax expenditure estimate is a model estimate, so the record set is
    # model_output. Its assertion stays the default, observation: fiscal year
    # 2025 had ended when JCT published JCX-45-25 in December 2025, and
    # docs/agent-source-package-harness.md types a model estimate of a period
    # that had happened as model_output + observation (the maintainer's ruling
    # in chronicle#449). The later fiscal years of the table, which the package
    # does not read, would be source_projection.
    provenance_class: model_output
    record_set_spec_id: jct.individual_tax_expenditure_revenue_loss.v1
    source_record_id_prefix: jct.tax_expenditures.fy2025
    sheet_name: jct_tax_expenditures_2025
    # JCX-45-25 Table 1 gives its estimates by federal fiscal year ("Fiscal
    # Years 2025 - 2029"); the package reads the 2025 column of the Individuals
    # block. It is the edition after jct-tax-expenditures-2024 (JCX-48-24) and
    # declares that package's concept, measure, unit and row labels. One
    # difference: JCT prints the charitable deduction on three lines (education,
    # health, and other than education and health). This package reads each
    # line as its own row and stores no sum; the 2024 package's
    # charitable_deduction row is the sum of the three.
    period_type: fiscal_year
    period: 2025
    geography_id: 0100000US
    geography_level: country
    geography_name: United States
    geography_vintage: current
    entity: tax_unit
    entity_role: federal_income_tax_unit
    domain: federal_income_tax
    groupby_dimension: jct.tax_expenditure
    rows:
      - value_id: salt_deduction
        label: State and local tax deduction
        ordinal: 0
        row_number: 2
        expected_row_header_column: A
        expected_row_header: salt_deduction
        filters:
          tax_expenditure: salt_deduction
        constraints:
          - variable: tax_expenditure
            operator: "=="
            value: salt_deduction
            label: JCT tax expenditure row
        table_record_kind: total
      - value_id: medical_expense_deduction
        label: Medical expense deduction
        ordinal: 1
        row_number: 3
        expected_row_header_column: A
        expected_row_header: medical_expense_deduction
        filters:
          tax_expenditure: medical_expense_deduction
        constraints:
          - variable: tax_expenditure
            operator: "=="
            value: medical_expense_deduction
            label: JCT tax expenditure row
        table_record_kind: total
      - value_id: charitable_deduction_other_than_education_and_health
